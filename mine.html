<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover 是「底部黑边」的解药，不是可选装饰：
     不带它时页面视口被系统 inset 在安全区以内，底部那条 home indicator / 手势条
     不归页面画，由宿主 WebView 填色（嵌入式 webview 默认多为黑）→ 玩家看到「下面一片黑」。
     带上它之后页面才铺到物理屏边缘（html 的 --bg 把整屏画满），
     同时 env(safe-area-inset-*) 才会返回真实值（没有 cover 时它恒为 0，
     下面那些 calc(... + env(...)) 全是死代码）。
     env() 的值在 play 面上由平台 safe-area 运行时改写成 --solo-env-safe-*，
     两条通道共用同一套写法，不要改成裸数字。 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<!-- 宿主 chrome（状态栏/地址栏/安全区）跟着页面底色走，避免深色页配白/黑条 -->
<meta name="theme-color" content="#141a24">
<!-- Monetag 站点所有权验证。必须留在原始 HTML 的 <head> 里：验证器抓页面源码、不执行 JS，
     且 Monetag 要求验证通过后不要移除（用于持续确认所有权）。
     注册的站点应是本游戏自己的子域 play-color-mines.run.ceo —— 不是 run.ceo
     （run.ceo 首页属于平台，我们改不了它的 <head>，也不该声称拥有整个平台）。 -->
<meta name="monetag" content="2f9e3e08b43a9d525e226b36d0a22368">
<title>Color Mines</title>
<style>
  :root{
    --bg:#141a24; --surface:#1e2735; --ink:#f2f5f9; --ink-2:#9fb0c3; --ink-3:#6b7a8d;
    --edge:rgba(255,255,255,.09); --accent:#ffb454; --ok:#43d17c; --bad:#ff5d5d;
    --cell-gap:3px;
    /* 明确声明深色：告诉内核这页本来就是暗的，别再用 Android WebView 的
       algorithmic darkening（force-dark）反色一遍，也让 UA 默认画布跟着变暗。 */
    color-scheme:dark;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;
    height:100%; overflow-x:hidden; touch-action:manipulation; user-select:none; -webkit-user-select:none;}
  body{display:flex; flex-direction:column; align-items:center; min-height:100%;
    background:radial-gradient(circle at 50% -10%, #22304a 0%, #141a24 62%);}
  /* 四边都让位：有了 viewport-fit=cover，页面画到物理屏边缘，
     内容必须自己躲开刘海/挖孔（top）、曲面边与横屏挖孔（left/right）、手势条（bottom）。 */
  .wrap{width:100%; max-width:560px;
    padding:calc(10px + env(safe-area-inset-top, 0px)) calc(12px + env(safe-area-inset-right, 0px))
            calc(18px + env(safe-area-inset-bottom, 0px)) calc(12px + env(safe-area-inset-left, 0px));
    display:flex; flex-direction:column; gap:10px;}

  /* ---------- HUD ---------- */
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .title{font-weight:800; font-size:15px; letter-spacing:.04em;}
  .title em{font-style:normal; color:var(--accent);}
  .hud{display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--surface); border:1px solid var(--edge); border-radius:12px; padding:8px 12px;}
  .hud .box{display:flex; flex-direction:column; align-items:center; gap:2px; min-width:56px;}
  .hud .k{font-size:11px; color:var(--ink-2); letter-spacing:.06em;}
  .hud .v{font-size:15px; font-weight:800; font-variant-numeric:tabular-nums;}
  .hud .v.low{color:var(--bad); animation:blink 1s steps(2) infinite;}
  @keyframes blink{50%{opacity:.45}}
  .hearts b{color:var(--bad); letter-spacing:1px; font-size:14px;}
  .hearts b.off{color:#3a4657;}

  /* ---------- 棋盘 ---------- */
  .boardwrap{background:var(--surface); border:1px solid var(--edge); border-radius:14px; padding:8px;}
  .board{display:grid; gap:var(--cell-gap); width:100%; aspect-ratio:1; touch-action:none;}
  .cell{position:relative; container-type:inline-size; border-radius:6px; border:1px solid rgba(0,0,0,.28);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    font-size:32px; font-weight:800; overflow:hidden;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22), inset 0 -2px 0 rgba(0,0,0,.18);}
  .cell.small{font-size:20px; border-radius:5px;}
  .cell .mk{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:rgba(0,0,0,.62); text-shadow:0 1px 0 rgba(255,255,255,.25); pointer-events:none; z-index:1;}
  /* 理由里说「第 9 行已经有雷了」，可棋盘没有行号，玩家得自己从上往下数——
     四位独立视觉评审各自都提了这一条。讲到某一行/某一列时就把那一整条淡淡点亮：
     不占版面、不加坐标轴、也不跟三种高亮的 outline 抢语义（这里走 ::after 覆盖层）。 */
  /* 只靠半透明提亮不够：棋盘色块饱和度很高，白纱盖上去几乎看不出（视觉评审两轮实测
     「接近不可感知」）。改成沿行/列方向拉两条贯通的亮边 —— 整条像被一根标尺框住，
     既一眼可见、又不洗掉格子本来的颜色（颜色还要用来认色块）。 */
  .cell.clueline::after{content:''; position:absolute; inset:0; z-index:0; pointer-events:none;
    box-sizing:border-box; background:rgba(255,255,255,.22);}
  .cell.clueline-row::after{border-top:3px solid rgba(255,255,255,.92); border-bottom:3px solid rgba(255,255,255,.92);}
  .cell.clueline-col::after{border-left:3px solid rgba(255,255,255,.92); border-right:3px solid rgba(255,255,255,.92);}
  .cell .mk::before{font-size:32px; line-height:1;}
  .cell.small .mk::before{font-size:20px;}
  @supports (font-size:1cqi){
    .cell .mk::before{font-size:clamp(18px,58cqi,48px);}
    .cell.small .mk::before{font-size:clamp(12px,58cqi,30px);}
  }
  .cell.safe .mk::before{content:'✕'; font-weight:900; -webkit-text-stroke:.035em currentColor;}
  .cell.hintsafe .mk::before{content:'✕'; color:#0b6b3a; font-weight:900; -webkit-text-stroke:.035em currentColor;}
  /* 道具「找线索」的表现（2026-08-26 · owner 选定方案 A）：
     高亮线索来源那一组 + 目标格聚光并打问号，落子仍由玩家自己点——
     道具教的是「该看哪里」，不代替思考。 */
  .cell.cluegroup{outline:2px solid rgba(255,180,84,.85); outline-offset:-2px; z-index:2;}
  .cell.cluespot{outline:3px solid #ffd07a; outline-offset:-1px; z-index:3;
    box-shadow:0 0 0 4px rgba(255,180,84,.35), 0 0 22px 6px rgba(255,180,84,.55);
    animation:cluepulse 1.1s ease-in-out infinite;}
  /* ❓ 必须小：视觉评审两位判读者都把目标格的底色认错了（实际与被排除格同属一个色块，
     底色 rgb(143,143,240) 完全一致）。大号 emoji 把格子铺满，玩家就看不出它归哪个色块，
     「这个色块其它格都排除了」这句话在画面上便无从验算。缩到六成，露出底色。 */
  .cell.cluespot .mk::before{content:'❓'; color:#20160a; text-shadow:none; font-size:.62em;}
  /* 「这一格已经被这条线索排除了」（2026-08-27 修 RCA）：此前组内所有格都涂同一个
     .cluegroup，玩家分不清「引擎已经排掉的」和「还可能是雷的」，于是线索看上去像
     给了多个选择、却只解释了一个。三态分开：已排除 = 灰虚框 + 淡 ✕；
     当前正在讲的这一步 = 绿实框（跟着理由逐步点亮）；还没排除的 = 紫框 + ? 。 */
  /* 已排除格必须**保住原来的色相**（玩家要靠颜色认出它属于哪个色块，理由才对得上），
     所以只降饱和压暗，绝不用 opacity —— 视觉评审实测：opacity 会把格子压成一片深紫，
     玩家认不出它归哪个色块，「这个色块其它格都排除了」这句话在画面上就没法自证。
     ✕ 同时要能看清：白字 + 深描边，不跟着背景一起变淡。 */
  /* 虚线用中性白：色块归属已经靠保留下来的底色表达了，再用橙色会跟目标格的橙实框抢注意力 */
  .cell.clueruled{outline:2px dashed rgba(255,255,255,.6); outline-offset:-2px; z-index:2;
    filter:saturate(.8) brightness(.8);}
  .cell.clueruled .mk::before{content:'✕'; color:#fff; font-weight:900;
    -webkit-text-stroke:.045em rgba(0,0,0,.6); text-shadow:none;}
  /* 正在讲的这一步：绿色是全屏唯一的「当前焦点」语义，配脉冲，好跟目标格的橙色分开 */
  .cell.cluestep{outline:3px solid #5fe0a6; outline-offset:-1px; z-index:3;
    box-shadow:0 0 0 4px rgba(95,224,166,.42), 0 0 18px 5px rgba(95,224,166,.5);
    animation:cluestepglow 1.1s ease-in-out infinite;}
  .cell.cluestep .mk::before{content:'✕'; color:#04361a; font-weight:900;
    -webkit-text-stroke:.04em rgba(255,255,255,.7); text-shadow:none;}
  @keyframes cluestepglow{50%{box-shadow:0 0 0 7px rgba(95,224,166,.26), 0 0 24px 8px rgba(95,224,166,.38);}}
  /* 「雷就在这几格里」的范围态（2026-08-29）：**绝不能复用 .cluestep**——那个样式画的是 ✕
     「这格已排除」，跟「这几格里有雷」正好相反，真页面截图当场就露馅了。
     所以给范围格一套自己的语义：紫框 + ❓（与结论格 .cluespot 的橙框区分开：
     橙 = 就是这一格，紫 = 还不知道是哪一格）。 */
  .cell.cluerange{outline:3px solid #b39dff; outline-offset:-1px; z-index:3;
    box-shadow:0 0 0 4px rgba(179,157,255,.34), 0 0 16px 4px rgba(179,157,255,.42);}
  /* ❓ 要带白描边：范围格的底色是各色块自己的颜色，深色符号落在粉/红底上会被读成
     「危险/这里是雷」（独立视觉评审 2026-08-29 实测把这 4 格全读成了雷）。
     白描边把符号从底色里拎出来，语义回到中性的「不知道是哪一格」。 */
  .cell.cluerange .mk::before{content:'❓'; color:#1b1526; text-shadow:none; font-size:.62em;
    -webkit-text-stroke:.05em rgba(255,255,255,.9);}
  @media (prefers-reduced-motion:reduce){ .cell.cluestep{animation:none;} }
  /* 聚光灯：讲解途中把不相干的格子整体压暗，只留这一行亮着。
     为什么要走到这一步——半透明提亮（.17→.27）和 3px 贯通白边都试过，计算样式实测
     确实渲染了，但三位独立判读者都「看不到那一行」：在高饱和棋盘上，任何加法都会被
     周围颜色吃掉。减法才管用。只在讲解步开，结论步恢复全亮。 */
  /* 压暗要克制：.42/.5 实测把暗区不同颜色泥成一片，观感像「面板失效」而不是「聚焦」，
     而这游戏的颜色本身就是信息（要靠它认色块）—— 同一条纪律，上次栽在已排除格，这次栽在暗区。
     结论目标格与「这一步的依据雷」不参与压暗：前者是预告，后者是理由的前提，都得看得见。 */
  .board.spotlight .cell:not(.clueline):not(.cluespot):not(.cluecause):not(.cluerange){filter:brightness(.62) saturate(.85);}
  /* 范围步用更狠的聚光：候选格的底色是色块自己的颜色（可能正好跟旁边一大片同色），
     只靠紫描边压不住 —— 独立视觉评审两轮都把这几格读错了。把其余整盘压暗，
     高亮才真的是高亮。 */
  .board.rangelit .cell:not(.cluerange){filter:brightness(.5) saturate(.7);}
  /* 「第 9 行里已经有雷了」——那颗雷就是这一步的前提，得指出来。绿虚线：与当前步的
     绿实线同系（同属这一步），虚线表示它是依据而非结论。 */
  /* 光有虚线不够：格子小，虚线段会糊成实线，压在暖色底上绿意也认不出来（评审实测）。
     补一圈柔和绿光——比当前步弱一档，「亮度分级」不依赖颜色对比就能读出主次。 */
  .cell.cluecause{outline:3px dashed #5fe0a6; outline-offset:-2px; z-index:2;
    box-shadow:0 0 0 3px rgba(95,224,166,.32), 0 0 13px 3px rgba(95,224,166,.4);}
  .cell.cluepend{outline:2px solid rgba(139,123,255,.9); outline-offset:-2px; z-index:2;}
  .cell.cluepend .mk::before{content:'?'; color:#d9d3ff; font-weight:900; -webkit-text-stroke:.03em rgba(60,50,120,.9);}
  @keyframes cluepulse{50%{box-shadow:0 0 0 7px rgba(255,180,84,.22), 0 0 26px 9px rgba(255,180,84,.42);}}
  @media (prefers-reduced-motion:reduce){ .cell.cluespot{animation:none;} }
  .cluebar{display:flex; align-items:flex-start; gap:9px; border-radius:13px; padding:10px 12px;
    background:linear-gradient(120deg,rgba(255,180,84,.16),var(--surface) 60%);
    border:1px solid rgba(255,180,84,.45);}
  .cluebar.deep{background:linear-gradient(120deg,rgba(139,123,255,.16),var(--surface) 60%);
    border-color:rgba(139,123,255,.5);}
  .cluebar .ic{font-size:19px; line-height:1.2; flex:none;}
  .cluebar .tx{font-size:12.5px; line-height:1.5; color:var(--ink); flex:1; min-width:0;}
  .cluebar .tx b{display:block; color:var(--accent);}
  .cluebar.deep .tx b{color:#c3b8ff;}
  /* 理由这一行原来用 --ink-3(#6b7a8d)，在深底上对比度不够（视觉评审 2026-08-27 实测扣分）：
     提一档到 --ink-2；落子动作单独一行，别跟理由挤在一起被折行折断。 */
  .cluebar .tx span{display:block; font-size:12px; color:var(--ink-2); margin-top:2px;}
  .cluebar .tx span.act{color:var(--accent); font-weight:700; margin-top:3px;}
  .cluebar .tx span.stp{font-size:10.5px; font-weight:800; letter-spacing:.04em; margin:0 0 2px;
    color:var(--ink-3); text-transform:uppercase;}
  .cluebar.deep .tx span.act{color:#c3b8ff;}
  .cluebar .ok{flex:none; border:0; border-radius:9px; padding:7px 11px; font:inherit; font-size:12px;
    font-weight:800; background:var(--accent); color:#20160a; cursor:pointer;}
  .cell.opened{filter:saturate(.35) brightness(.72);}
  .cell.opened .mk::before{content:'·'; font-size:.65em;}
  .cell.mine{filter:brightness(1.06);}
  .cell.mine .mk::before{content:'💣'; text-shadow:none;}
  .cell.boom{animation:shake .4s;}
  @keyframes shake{20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
  .cell.pop{animation:pop .35s;}
  @keyframes pop{40%{transform:scale(1.18)}}

  /* ---------- 道具 ---------- */
  .tools{display:flex; gap:8px;}
  .tool{flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    background:var(--surface); border:1px solid var(--edge); border-radius:12px;
    padding:10px 8px; color:var(--ink); font-size:13px; font-weight:700; cursor:pointer;}
  .tool .cnt{background:rgba(255,180,84,.16); color:var(--accent); border-radius:8px; padding:1px 7px; font-size:12px;}
  .tool:disabled{opacity:.45;}
  .hintline{font-size:11px; color:var(--ink-3); text-align:center; line-height:1.5;}
  @media (min-width:700px){
    .hintline{font-size:13px; color:#b9c5d3; line-height:1.65;}
    .hud .k,.topbar .backbtn{color:#aeb9c8;}
  }

  /* ---------- 弹窗 / toast ---------- */
  .overlay{position:fixed; inset:0; background:rgba(8,12,18,.66); display:none;
    align-items:center; justify-content:center; z-index:30;
    padding:calc(20px + env(safe-area-inset-top, 0px)) calc(20px + env(safe-area-inset-right, 0px))
            calc(20px + env(safe-area-inset-bottom, 0px)) calc(20px + env(safe-area-inset-left, 0px));}
  .overlay.show{display:flex;}
  /* 高度上限 + 列表自己滚（2026-08-29）：原来弹窗没有任何高度约束，内容多高窗就多高，
     超过视口后底部按钮被顶到屏幕外、且没有任何东西可滚（剧情图鉴 11 行就撞线）。
     标题与按钮留在弹窗上，中间的列表区独立滚动 —— 所有弹窗一起受益。 */
  .dialog{position:relative; background:var(--surface); border:1px solid var(--edge); border-radius:16px;
    padding:20px; width:100%; max-width:320px; display:flex; flex-direction:column; gap:12px; text-align:center;
    max-height:calc(100vh - 40px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    max-height:calc(100dvh - 40px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));}
  #dlgList{flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  /* 关闭入口：任何弹窗都必须能退出（硬规则：禁止出现用户无法返回的窗口） */
  .dlgx{position:absolute; top:6px; right:8px; width:32px; height:32px; padding:0; border:0;
    border-radius:9px; background:transparent; color:var(--ink-3); font-size:16px; line-height:1;
    cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .dlgx:hover{background:rgba(255,255,255,.07); color:var(--ink);}
  .dialog h2{margin:0; font-size:18px;}
  .dialog p{margin:0; font-size:13px; color:var(--ink-2); line-height:1.6;}
  .dialog .btn{border:0; border-radius:10px; padding:11px; font-size:14px; font-weight:800; cursor:pointer;}
  .btn.primary{background:var(--accent); color:#20160a;}
  .btn.ghost{background:transparent; color:var(--ink-2); border:1px solid var(--edge);}
  .toast{position:fixed; left:50%; bottom:calc(80px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%) translateY(8px);
    background:#0d1420; border:1px solid var(--edge); color:var(--ink); border-radius:10px;
    padding:8px 14px; font-size:13px; opacity:0; transition:.25s; pointer-events:none; z-index:40; white-space:nowrap;}
  .toast.show{opacity:1; transform:translateX(-50%);}

  /* 兜底广告卡（house 源）：没有第三方广告可放时也要真的"看"一段，
     否则「看广告拿奖励」就退化成白送 —— 这正是本次 RCA 的问题所在。 */
  .admask{position:fixed; inset:0; z-index:60; background:rgba(4,8,14,.92);
    display:flex; align-items:center; justify-content:center;
    padding:calc(22px + env(safe-area-inset-top, 0px)) calc(22px + env(safe-area-inset-right, 0px))
            calc(22px + env(safe-area-inset-bottom, 0px)) calc(22px + env(safe-area-inset-left, 0px));}
  .adbox{width:100%; max-width:340px; background:var(--surface); border:1px solid var(--edge);
    border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:12px; text-align:center;}
  .adbox .adlab{font-size:11px; color:var(--ink-3); letter-spacing:.12em; text-transform:uppercase;}
  .adbox .adart{height:150px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    font-size:40px; background:linear-gradient(135deg,#1d2836,#0f1620); border:1px solid var(--edge);}
  .adbox .adtip{font-size:12px; color:var(--ink-2);}
  .adbox .adcd{font-size:15px; font-weight:800; color:var(--accent);}
  .adbox button{border:0; border-radius:10px; padding:10px; font-size:13px; font-weight:700; cursor:pointer;
    background:rgba(127,127,127,.18); color:var(--ink-2);}
  .adbox button:disabled{opacity:.45; cursor:default;}

  /* 首页周活动入口按钮（骨架由 core/home.js 的 weekly-event-entry 产出） */

    font:inherit; color:var(--ink); cursor:pointer; position:relative;}

  .eventbtn .ic{font-size:20px; color:var(--accent);}
  .eventbtn .t{display:flex; flex-direction:column; text-align:left; min-width:0;}
  .eventbtn .t b{font-size:14px;}
  .eventbtn .t span{font-size:11px; color:var(--ink-3);}
  .eventbtn .frag{font-size:13px; font-weight:800; color:var(--accent); flex:0 0 auto;}

  /* 每周活动（机制在 core/weekly.js，奖励内容由 game.config.json 的 weekly 段配置） */
  .wk{padding:14px 16px 30px; display:flex; flex-direction:column; gap:14px;}
  .wktop{display:flex; align-items:center; gap:10px;}
  .wktop button{background:transparent; border:0; color:var(--ink-2); font-size:14px; cursor:pointer; padding:4px 2px;}
  .wktop .wkh{flex:1; text-align:center; font-size:15px; font-weight:800; color:var(--ink);}
  .wkcard{background:var(--surface); border:1px solid var(--edge); border-radius:14px; padding:14px;
    display:flex; flex-direction:column; gap:10px;}
  .wkcard .wkth{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
  .wkcard .wkth b{font-size:16px; color:var(--ink);}
  .wkcard .wkth span{font-size:11px; color:var(--ink-3);}
  .wkfrag{display:flex; align-items:baseline; justify-content:space-between;}
  .wkfrag .lab{font-size:12px; color:var(--ink-3);}
  .wkfrag .num{font-size:20px; font-weight:800; color:var(--accent);}
  .wkbar{height:8px; border-radius:6px; background:rgba(127,127,127,.22); overflow:hidden;}
  .wkbar i{display:block; height:100%; background:var(--accent); border-radius:6px; transition:width .3s;}
  .wkcarry{font-size:11px; color:var(--ink-3);}
  .wkgrid{display:flex; flex-direction:column; gap:10px;}
  .wkpic{display:flex; align-items:center; gap:10px; background:var(--surface);
    border:1px solid var(--edge); border-radius:12px; padding:10px 12px;}
  .wkpic .ico{font-size:20px; width:26px; text-align:center; flex:0 0 auto;}
  .wkpic .info{flex:1 1 auto; min-width:0;}
  .wkpic .info b{display:block; font-size:14px; color:var(--ink);}
  .wkpic .info span{font-size:11px; color:var(--ink-3);}
  .wkpic.locked{opacity:.55;}
  .wkpic.claimed .info b{color:var(--ink-3);}
  .wkpic button{flex:0 0 auto; border:0; border-radius:9px; padding:7px 12px; font-size:12px;
    font-weight:700; cursor:pointer; background:var(--accent); color:#1a1205;}
  .wkpic button[disabled]{background:rgba(127,127,127,.2); color:var(--ink-3); cursor:default;}
  .wkgrand{border-color:var(--accent);}
  .wknote{font-size:11px; color:var(--ink-3); line-height:1.7; text-align:center;}

  /* selftest:begin —— 开发自检面板样式。发布构建（scripts/strip-selftest.mjs）整段剔除，线上产物没有这段。 */
  /* 隐藏工具面板（仅 URL 带 #selftest 时显示，普通玩家看不到） */
  .selftest{position:fixed; left:calc(10px + env(safe-area-inset-left, 0px)); right:calc(10px + env(safe-area-inset-right, 0px));
    bottom:calc(10px + env(safe-area-inset-bottom, 0px)); z-index:50; background:#0d1420;
    border:1px solid var(--edge); border-radius:12px; padding:10px; display:flex;
    flex-direction:column; gap:8px;}
  .selftest pre{margin:0; font-size:11px; line-height:1.55; color:var(--ink-2); white-space:pre-wrap;
    word-break:break-all; max-height:46vh; overflow:auto; user-select:text; -webkit-user-select:text;}
  /* selftest:end */

  /* 设置页底部的构建标记：一眼分辨设备拿到的是哪一版（排查「到底更没更新」用） */
  .buildline{margin-top:10px; text-align:center; font-size:11px; color:var(--ink-3);
    user-select:text; -webkit-user-select:text; white-space:pre-line; word-break:break-all;
    cursor:pointer;}

  /* ---------- 首页（与 water.html home 同款布局） ---------- */
  [hidden]{display:none !important;}
  .home{display:flex; flex-direction:column; gap:14px; padding-top:26px;}
  .home .logo{text-align:center; font-size:30px; font-weight:700; letter-spacing:.08em; color:var(--ink);}
  .home .logo em{display:block; font-style:normal; color:var(--accent); font-size:13px; letter-spacing:.3em; margin-top:4px;}
  .homestats{display:flex; gap:10px;}
  .homestats .st{flex:1; background:var(--surface); border:1px solid var(--edge); border-radius:12px;
    padding:10px 12px; text-align:center;}
  .homestats .st b{display:block; font-size:20px; color:var(--ink); margin-bottom:2px;}
  .homestats .st span{font-size:11px; color:var(--ink-3);}
  /* 道具格 = 图标按钮（数量不在首页显示，点开背包窗口看） */
  .homestats .stbtn{font:inherit; cursor:pointer; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:2px;}
  .homestats .stbtn:hover{border-color:var(--accent);}
  .homestats .stbtn .sticon{font-size:20px; line-height:1.15; margin-bottom:2px;}
  /* 背包窗口内的道具行 */
  .bagrow{display:flex; align-items:center; gap:10px; text-align:left;
    background:var(--bg-2, rgba(255,255,255,.04)); border:1px solid var(--edge);
    border-radius:10px; padding:10px 12px;}
  .bagrow .bagicon{font-size:22px; line-height:1; flex:0 0 auto;}
  .bagrow .baginfo{flex:1 1 auto; min-width:0;}
  .bagrow .baginfo b{display:block; font-size:14px; color:var(--ink);}
  .bagrow .baginfo span{font-size:11px; color:var(--ink-3);}
  .bagrow .bagqty{flex:0 0 auto; font-size:16px; font-weight:800; color:var(--accent);}
  .bagrow.empty .bagqty{color:var(--ink-3);}
  /* 每行的「+」：获取入口（金币买 / 看广告）。指头点得准（32px）、与数量分开一段距离，
     免得想看数量却点成了购买。 */
  .bagrow .bagadd{flex:0 0 auto; width:32px; height:32px; padding:0; border-radius:50%;
    border:1px solid rgba(255,180,84,.55); background:rgba(255,180,84,.14); color:var(--accent);
    font:inherit; font-size:19px; font-weight:800; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;}
  .bagrow .bagadd:hover{background:var(--accent); color:#20160a;}
  .bagrow .bagadd:active{transform:scale(.94);}
  /* 用完了的道具，「+」实心高亮：零库存行才是最该补货的那一行，光靠灰掉的「×0」
     一眼扫过去看不出来（视觉评审 2026-08-29 实测「状态可读性」只给 6 分）。 */
  .bagrow.empty .bagadd{background:var(--accent); color:#20160a; border-color:var(--accent);}
  .bagempty{font-size:12px; color:var(--ink-3); line-height:1.6;}
  /* 图鉴的行样式（.cgrow / .volrow）已随模块下沉到 core/story.js 的 styles()，
     和 HomeCore.styles() 一起注入 —— 不搬进 core，别的游戏还得各抄一份 CSS。 */
  .bigbtn{border:0; border-radius:14px; padding:16px; font-size:17px; font-weight:800; cursor:pointer;
    background:var(--accent); color:#20160a;}
  .bigbtn small{display:block; font-weight:600; font-size:12px; margin-top:4px; opacity:.9;}
  .energy{display:flex; gap:10px; align-items:center; background:var(--surface); border:1px solid var(--edge);
    border-radius:12px; padding:10px 12px;}
  /* 并排行：体力条 + 金币牌同一行（体力不再独占整行） */
  .hrow{display:flex; gap:10px; align-items:stretch;}
  .hrow .rowcell{min-width:0;}                       /* 允许收缩，长数字不撑破布局 */
  .hrow .rowcell > *{height:100%; box-sizing:border-box;}
  .coinbox{display:flex; gap:8px; align-items:center; justify-content:center;
    background:var(--surface); border:1px solid var(--edge); border-radius:12px; padding:10px 12px;}
  .coinbox .icon{font-size:20px;}
  .coinbox .info{display:flex; flex-direction:column; line-height:1.15; min-width:0;}
  .coinbox .info b{font-size:17px; font-weight:800; color:var(--ink);}
  .coinbox .info span{font-size:11px; color:var(--ink-3);}
  .energy .icon{font-size:22px;}
  .energy .info{flex:1;}
  .energy .val{font-size:15px; font-weight:800; color:var(--ink);}
  .energy .val .max{color:var(--ink-3); font-weight:600;}
  .energy .sub{font-size:12px; color:var(--ink-2); margin:2px 0 4px;}
  .energy .bar{height:5px; border-radius:3px; background:rgba(255,255,255,.08); overflow:hidden;}
  .energy .bar i{display:block; height:100%; background:var(--accent); border-radius:3px;}
  /* 双连胜卡(2026-08-24 · core/winstreak.js) */
  .streakcard{display:flex; gap:10px; align-items:center; background:var(--surface); border:1px solid var(--edge);
    border-radius:12px; padding:10px 12px;}
  .streakcard .ic{font-size:22px;}
  .streakcard .info{flex:1; min-width:0;}
  .streakcard .val{font-size:15px; font-weight:800; color:var(--ink);}
  .streakcard .val span{color:var(--ink-3); font-weight:600; font-size:11px;}
  .streakcard .sub{font-size:11px; color:var(--ink-3); margin:2px 0 4px; display:flex; justify-content:space-between; gap:8px;}
  .streakcard .bar{height:5px; border-radius:3px; background:rgba(255,255,255,.08); overflow:hidden;}
  .streakcard .bar i{display:block; height:100%; background:var(--ok); border-radius:3px; transition:width .3s;}
  .streakcard .wsclaim{background:var(--accent); color:#20160a; border-radius:9px; padding:9px 11px;
    font-size:12px; font-weight:800; white-space:nowrap;}
  .profilerow{display:flex; gap:10px; align-items:center; background:var(--surface); border:1px solid var(--edge);
    border-radius:12px; padding:10px 12px; cursor:pointer; color:var(--ink); font-size:13px; text-align:left; width:100%;}
  .profilerow .avatar{width:32px; height:32px; border-radius:50%; background:var(--accent); color:#20160a;
    display:flex; align-items:center; justify-content:center; font-weight:800; flex:none;}
  .profilerow .profileinfo{flex:1; display:flex; flex-direction:column; gap:1px;}
  .profilerow .profilelabel{font-size:11px; color:var(--ink-3);}
  .profilerow .profilesource{font-size:11px; color:var(--ink-3);}
  .idrow .avatar{position:relative;}
  .idnameline{display:flex; align-items:center; gap:6px; min-width:0;}
  .idnameline .profilename{font-weight:800; min-width:0; overflow-wrap:anywhere;}
  .idsource{display:none; flex:none; font-style:normal; font-size:10px; font-weight:600; color:var(--ink-3);
    border:1px solid var(--edge); border-radius:999px; padding:1px 5px;}
  .idsource.show{display:inline-block;}
  .idsub{font-size:11px; color:var(--ink-3); line-height:1.4; white-space:normal; overflow-wrap:anywhere;}
  .idrow #idAction{flex:none; max-width:88px; text-align:right; color:var(--ink-2);}
  .idbadge{position:absolute; right:-2px; bottom:-2px; width:14px; height:14px; border-radius:50%;
    border:2px solid var(--surface); display:flex; align-items:center; justify-content:center;
    font-style:normal; font-size:9px; font-weight:900; line-height:1;}
  .idbadge.off{background:var(--surface); box-shadow:inset 0 0 0 1px var(--ink-3);}
  .idbadge.ok{background:var(--ok); color:var(--surface);}
  .idbadge.ok::after{content:'✓';}
  .idbadge.warn{background:var(--accent); color:var(--surface);}
  .idbadge.warn::after{content:'!';}
  .langrow{display:flex; align-items:center; justify-content:space-between; background:var(--surface);
    border:1px solid var(--edge); border-radius:12px; padding:10px 12px; font-size:13px; color:var(--ink-2);}
  /* 开/关两态必须一眼可辨：原来两态同底同框、只差一个字，视觉评审实测「状态识别靠单字」。
     开 = 橙底（与全局 CTA 同一套语义），关 = 中性描边；点击区顺带提到 44px 拇指线。
     这一条同时改善音效开关（同一套样式），只影响彩雷（water 有自己的副本）。 */
  /* 两态都必须长得像「控件」，且不能跟橙色主按钮撞色（两轮视觉评审分别栽在这两点上：
     纯文字的关态被当成说明文字；橙底的开态被当成第二个主行动按钮）。
     定型：开 = 绿底（通用「已开启」语义，与橙色 CTA 完全分开），关 = 浅底 + 描边；
     两态同尺寸同圆角，行高不再因状态而跳。点击区 44px 拇指线。 */
  /* 设置行的标签区：名词 + 一行副说明（说清「关掉会少什么」），右侧控件不受影响 */
  /* text-align 必须显式写 left：弹窗容器是居中排版的，包一层之后 label 从 flex item
     变成块级子元素，就跟着继承了居中 —— 于是这一行的标题居中、另两行左对齐（视觉评审
     实测「比行高差异更伤」）。 */
  .langrow .rowlb{display:flex; flex-direction:column; align-items:flex-start; text-align:left;
    gap:2px; min-width:0; flex:1; padding-right:10px;}
  .langrow .rowhint{font-size:11px; line-height:1.4; color:var(--ink-3); font-weight:400;}
  .sfxbtn{border:1px solid var(--edge-strong); background:rgba(255,255,255,.08); color:var(--ink);
    border-radius:9px; padding:0 18px; min-height:44px; min-width:64px; cursor:pointer;
    font-size:13px; font-weight:800;}
  .sfxbtn[aria-pressed="true"]{background:var(--ok); color:#06281a; border-color:transparent;}
  .langrow select{appearance:none; -webkit-appearance:none; color-scheme:dark; border:1px solid var(--edge);
    background-color:#151d29; color:var(--ink); border-radius:8px; padding:6px 30px 6px 10px;
    font:inherit; cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),
      linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);
    background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;
    background-size:5px 5px,5px 5px; background-repeat:no-repeat;}
  .langrow select:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .backbtn{background:transparent; border:0; color:var(--ink-2); font-size:13px; cursor:pointer; padding:4px 6px; flex:none;}
  .game{display:flex; flex-direction:column; gap:10px;}
  .home > .hintline{margin-top:3px;}
</style>

  var LANG_DIAG = {

  /* t(key, vars)：取词 + {占位符} 插值。缺 key 由 core 抛错（宁可炸也不显示空白）。 */
  function t(key, vars) {
    var s = I18n.t(LANG, key);
    if (!vars) return s;
    return s.replace(/\{(\w+)\}/g, function (m, name) {
      return vars[name] !== undefined ? String(vars[name]) : m;
    });

  var Stock = StockCore.create(CFG.stock);

  /* 账本体检（issue #1 · 广告奖励可信度）：只增账本 + max 合并会把**被篡改的数字永久固化**
     —— 控制台改一次 granted，换设备清缓存都回不去。这里在每次云档合并后查一次：
     累计获得量若超过按游戏规则物理上可能的量，削平并记异常。
     天数只认服务端盖的 created_date：本地时钟是玩家的，拿它当证据等于自己骗自己；
     拿不到可信天数就**不削**，只把这条路走了多少次计下来（否则它常态化走空也没人知道）。 */
  var STOCK_AUDIT = { checked: 0, clamped: 0, unknownAge: 0, last: null };
  function accountAgeDays(row) {
    var created = row && (row.created_date || row.created_at);
    if (!created) return null;
    var ms = Date.parse(created);
    if (!isFinite(ms)) return null;
    var days = (Date.now() - ms) / 86400000;
    return days >= 0 ? days : null;
  }
  function auditStock(row) {
    var res = Stock.audit(save, accountAgeDays(row));
    STOCK_AUDIT.checked += 1;
    if (res.unknownAge) {
      STOCK_AUDIT.unknownAge += 1;
      console.warn('[mine stock] ledger-audit skipped reason=unknown-age' +
        ' totals checked/clamped/unknownAge=' + STOCK_AUDIT.checked + '/' +
        STOCK_AUDIT.clamped + '/' + STOCK_AUDIT.unknownAge);
      return;
    }
    if (!res.anomalies.length) return;
    Object.assign(save, res.patch);
    persist();
    STOCK_AUDIT.clamped += 1;
    STOCK_AUDIT.last = res.anomalies;
    console.warn('[mine stock] ledger-anomaly clamped=' + JSON.stringify(res.anomalies) +
      ' totals checked/clamped/unknownAge=' + STOCK_AUDIT.checked + '/' +
      STOCK_AUDIT.clamped + '/' + STOCK_AUDIT.unknownAge);
  }
  /* 金币：通关攒、可直接买道具（不用看广告）。彩雷这边【故意不写 coins 配置】，
     走 core/coins.js 的默认值——通关 +1、200 金币换 1 个道具；
     倒水那边显式配了自己的数值（通关 +2、撤销 150 换 2 个），证明每个游戏都能自定。 */
  var Coins = CoinsCore.create(CFG.coins, Stock);
  Object.assign(save, Stock.migrate(save));
  function load(){ try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } }
  function persist(){
    /* 多标签页保护：写盘前先跟磁盘上的现值把「只增账本」取大。
       同一浏览器开两个标签页时，另一个标签页手里是过期快照，它的下一次写盘
       （首页体力每秒结算就会触发）会把已花掉的金币/道具覆盖回去 —— 实测复现过。
       granted/spent 单调只增，取大不会丢任何一侧的消耗。 */
    try {
      var onDisk = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (onDisk) Object.assign(save, Stock.reconcile(save, onDisk));
    } catch (e) {}
    save.updatedMs = Date.now(); Object.assign(save, Stock.legacyPatch(save));
    try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} platformSync(); }
  /* 用掉一个道具：spent+1（只增）；库存不足返回 false，交给「看广告补充」 */
  function spendTool(key) {
    var patch = Stock.spend(save, key);
    if (!patch) return false;
    Object.assign(save, patch); persist(); return true;
  }
  /* 发放道具（看广告补充等）：granted+n（只增） */
  function grantTool(key, n) {
    var patch = Stock.grant(save, key, n);
    if (!patch) return false;
    Object.assign(save, patch); persist(); return true;
  }
  function ensureTempName() {
    if (typeof save.alias === 'string' && save.alias.trim()) return save.alias.trim();
    save.alias = t('playerPrefix') + String(Math.floor(1000 + Math.random() * 9000));
    persist();
    return save.alias;
  }
  ensureTempName();

  /* ============ 音效（首页设置可开关） ============ */
  var AC = null;
  function blip(freq, dur) {
    withAudio(function (ac) {                 // 同样走统一解锁：手机上挂起态要等 resume 兑现再排程
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle'; o.frequency.value = freq;
      g.gain.setValueAtTime(.16, ac.currentTime);      // 峰值由共享压缩器兜底，可以放心给足
      g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + dur);
      o.connect(g); g.connect(masterIn(ac));
      o.start(); o.stop(ac.currentTime + dur);
    });

  /* 轻触觉反馈：优先 Telegram WebApp 的 haptic，否则用浏览器 Vibration API（安卓可用，
     iOS Safari 不支持则静默跳过）。纯设备 API，无任何第三方素材。
     不跟音效开关联动——静音场景下震动正是唯一的反馈通道。
     时长取舍（2026-08-20 修）：原来给 12ms，低于多数安卓马达的可感阈值（普遍要 20~30ms
     才有触感），手机上等于没震。
     降级可观测：震动不可用/被拒是静默降级路径，把原因记进 BUZZ_STATE + console，
     以后再有「手机上感受不到震动」时能直接查原因，而不是靠猜。 */
  var BUZZ_STATE = 'never-called';
  function buzz(ms) {
    function mark(state) {
      if (state !== BUZZ_STATE && state !== 'telegram-haptic' && state !== 'vibrate-ok') {
        console.warn('[mine haptic] 震动降级：' + state);   // 只在异常态出声，别刷日志
      }
      BUZZ_STATE = state; return state;
    }
    try {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (tg && tg.HapticFeedback) { tg.HapticFeedback.impactOccurred('light'); return mark('telegram-haptic'); }
      if (navigator.vibrate) return mark(navigator.vibrate(ms || 30) ? 'vibrate-ok' : 'vibrate-refused');

     时钟一恢复就跳变，排程点已经过期，手机上首次点击往往整段无声。
     所以必须等 resume 兑现后再按新的 currentTime 排程。 */
  function withAudio(play) {
    if (!save.sfx) return 'sfx-off';
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state === 'suspended' && AC.resume) {
        var p = AC.resume();
        if (p && p.then) { p.then(function () { play(AC); }, function () {}); return 'resuming'; }
      }
      play(AC);
      return AC.state;
    } catch (e) { return 'audio-error:' + (e && e.name); }
  }

  /* 找对雷的鼓励音：两个音符的轻柔上行（A5 → D6）+ 一下轻震动。
     法律风险规避：完全由 Web Audio 振荡器现场合成，不含任何第三方采样/音频文件，
     也不引用任何既有旋律（两个音符的上行音程本身不构成受保护作品），无需任何授权。
     音量取舍（2026-08-20 修）：最初设 .035/.045（≈-27dBFS），线上实测确实发声，但手机小喇叭
     加环境噪音下基本听不见——上调到 .07/.09（与原提示音 .08 同级），靠三角波 + 90ms 衰减
     保持柔和，而不是靠压低音量。8ms 淡入防爆音，两声总长不到 0.2 秒。
     AC.resume()：iOS/移动端 AudioContext 可能处于 suspended，不唤醒就静默不出声。 */
  /* 频段与音色依据（2026-08-20 改，出处：ISO 226 等响曲线 / Fletcher-Munson，以及 Web Audio API 官方书
     "Volume and Loudness" 一章对 DynamicsCompressorNode 的建议）：
     ① 人耳在 2~5kHz 最敏感（耳道共振 + 中耳听骨传递），3~4kHz 需要的声压最低；低于 500Hz 敏感度大幅下降。
        原来两音在 880/1174Hz，正好落在吃亏区间——手机小喇叭低频输出本来就弱，再叠上「媒体音量只开一半」
        （低声压下等响曲线在低频抬得最高），于是第一个被淹掉的就是它。把两音搬到 2093Hz(C7) → 2794Hz(F7)，
        靠听觉灵敏度换可闻性，而不是靠把振幅顶上去。
     ② 音量开大也不刺耳：等响曲线在高声压下会变平，频段之间的差异变小，所以搬到敏感区不会额外扎耳；
        再叠三重保险——正弦波（没有谐波，落在敏感区不需要靠谐波提亮）、lowpass 削掉残余毛刺、
        DynamicsCompressorNode 压住峰值（官方书：游戏这种无法预知的混音适度压缩是好做法，还能降低削波风险）。
     ③ 依旧保留 8ms 淡入 + 指数衰减，避免瞬态咔哒。 */
  /* 上行大三和弦琶音 C6–E6–G6–C7（频率比 4:5:6:8，全是简单整数比）。
     为什么从「两个裸正弦」换成琶音（2026-08-20 第二轮，依据见下）：
     ① 音乐心理学：八度 2:1、纯五 3:2、大三 5:4 这类**简单频率比**被普遍判定为协和、悦耳，
        复杂比（小二度等）才被判为刺耳；听众也偏好谐波关系明确、没有拍频的声音。
     ② 行业实践：游戏/老虎机的「赢了」反馈普遍用**上行琶音与更丰满的和声**来抬升兴奋感，
        短促单音只承担「操作已收到」的确认功能。
     ③ 所以上一版（两个裸正弦、总长 <0.2 秒）能听见但不动人——它是提示音，不是奖励音。
     每音再叠一个八度泛音（2:1）做出钟琴般的亮泽，末音留 0.4 秒余韵，总长约 0.6 秒。
     法律风险：仍是振荡器现场合成、无任何采样，且刻意不复刻任何已有游戏的可识别动机，
     只用通用的大三和弦琶音——基础音乐元素，不构成受保护作品。 */
  var CHEER_NOTES = [           // [基频, 起始偏移秒, 包络峰值, 时长秒]
    [1046.50, 0,    .105, .18],   // C6
    [1318.51, .075, .105, .18],   // E6（大三度 5:4）
    [1568.00, .150, .110, .24],   // G6（纯五度 3:2）
    [2093.00, .225, .125, .40]    // C7（八度 2:1）+ 余韵
  ];

  /* 共享输出链：lowpass(4.5kHz) → compressor → destination。只建一次，所有音效都从这里出去，
     这样峰值上限由压缩器统一兜住，单个音效怎么调都不会在大音量下扎耳。 */
  var MASTER = null;
  function masterIn(ac) {
    if (MASTER && MASTER.ac === ac) return MASTER.node;
    var lp = ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 5600; lp.Q.value = .7;   // 放宽一点，留住八度泛音的亮泽
    var comp = ac.createDynamicsCompressor();
    comp.threshold.value = -24; comp.knee.value = 12; comp.ratio.value = 8;
    comp.attack.value = .003; comp.release.value = .15;
    /* 输出归一：压缩器本身不做增益补偿，两个音符包络叠加后峰值实测能冲到 0.46（旧版 0.086），
       满音量会偏吵。这里统一乘 0.5 把峰值锁回 ~0.23，RMS 相对旧版仍有 +8dB 级提升——
       也就是「一半音量能听见」靠 RMS 与敏感频段拿，「满音量不刺耳」靠这一级限住峰值。 */
    var outGain = ac.createGain(); outGain.gain.value = .5;
    lp.connect(comp); comp.connect(outGain); outGain.connect(ac.destination);
    /* 一条很轻的延时支路当「余韵」：让奖励音收尾时有一点空间感，听起来是庆祝而不是滴一声。
       只有 18% 湿声 + 少量反馈，不会把短促的提示音糊掉。 */
    var dly = ac.createDelay(.5); dly.delayTime.value = .11;
    var fb = ac.createGain(); fb.gain.value = .22;
    var wet = ac.createGain(); wet.gain.value = .18;
    lp.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(comp);
    MASTER = { ac: ac, node: lp };
    return lp;
  }

  /* 每个音 = 基频 + 一个八度泛音（2:1 是最简的比，加进来只提亮泽、不引入刺耳的高次成分）。 */
  var CHEER_PARTIALS = [[1, 1], [2, .30]];            // [倍频, 相对音量]
  function playNotes(ac, notes) {
    var out = masterIn(ac);
    notes.forEach(function (n) {
      var t0 = ac.currentTime + n[1], peak = n[2], dur = n[3] || .1;
      CHEER_PARTIALS.forEach(function (h) {

        o.start(t0); o.stop(t0 + dur + .02);

  }
  function cheer() {
    if (clockPause.muted) return;      // 广告期间静音（adBreak 契约：mute 进、un-mute 出）
    buzz();
    withAudio(function (ac) { playNotes(ac, CHEER_NOTES); });
  }

  /* ============ 运行时状态 ============ */
  var S = null;        // 当前关：{lv,size,board,mines:Set,found:Set,marks:Set,opened:Set,lives,remain,timerId,done}
  var clickTimer = null, lastTap = { idx: -1, t: 0 };

  var $ = function (id) { return document.getElementById(id); };
  var boardEl = $('board');

  /* ============ 开关 ============ */
  function startLevel(lv) {
    resetGestureState();
    var data = MineLevels.get(lv);
    if (!data) { toast(t('levelGenFail')); return; }
    var mines = new Set();
    data.board.mines.forEach(function (c, r) { mines.add(r * data.size + c); });
    S = { lv: lv, size: data.size, board: data.board, mines: mines,
          found: new Set(), marks: new Set(), opened: new Set(),
          lives: data.lives, remain: data.timeLimit, timerId: null, done: false,
          clue: null };                     // 道具「找线索」当前高亮的那一条
    $('clueBar').hidden = true;
    renderBoard(); renderHud();
    if (S.remain != null) startTimer();
  }

  /* ============ 关卡时钟：广告与切后台期间必须停表 ============
     用户实报（2026-08-26）：「看广告回来本该 +60s，结果只剩 20-30s」。
     根因不在加时那一行，而在广告源的 resolve 时机：core/adplay.js 的 directlink 源
     在 openUrl() 打开新标签的那一刻就 resolve({ok:true})——玩家还在广告页看，
     父页面已经判「看完」并重启计时，于是 60 秒在玩家回来之前就被吃掉了。
     所以暂停不能只包住「广告 promise 期间」，还要包住「页面不可见期间」。

     PV ref（强，官方文档）：Google H5 Games Ad Placement API 的 adBreak() 契约——
     beforeAd「Mute and pause the game flow」/ afterAd「Resume the game and un-mute」，
     奖励在真看完之后发放。倒水已按此落地（adPauseGame/adResumeGame），这里补上彩雷。 */
  var clockPause = { depth: 0, wasTicking: false, remain: -1, muted: false };

  function pauseClock() {
    if (clockPause.depth++ > 0) return;
    clockPause.wasTicking = !!(S && S.timerId);
    clockPause.remain = (S && typeof S.remain === 'number') ? S.remain : -1;
    stopTimer();
    clockPause.muted = true;          // 契约要求 mute：广告有自己的声音，别叠在一起
  }

  function resumeClock() {
    if (clockPause.depth <= 0) return;
    if (--clockPause.depth > 0) return;
    clockPause.muted = false;
    /* 兜底：暂停期间一秒都不该流失。少了就按快照补回并大声打日志——
        说明有路径绕过了 pauseClock（同页 iframe 广告、别处又开了一个 tick 等）。 */
    if (clockPause.remain >= 0 && S && typeof S.remain === 'number' && S.remain < clockPause.remain) {
      console.warn('[mine ads] clock lost ' + (clockPause.remain - S.remain) +
        's while paused; restored from snapshot (should not happen: some path bypassed pauseClock)');
      S.remain = clockPause.remain;
      renderTime();
    }
    clockPause.remain = -1;
    var resume = clockPause.wasTicking;
    clockPause.wasTicking = false;
    if (resume && S && !S.done) startTimer();
  }

  function startTimer() {
    stopTimer();
    /* 暂停期间不许真的开表：directlink 那条路会在玩家还没回来时就发奖并调用本函数，
       此时页面仍不可见，开表等于继续吃玩家的时间。记下「本该在跑」，恢复时再开。 */
    if (clockPause.depth > 0) { clockPause.wasTicking = true; return; }
    S.timerId = setInterval(function () {
      if (S.done) return stopTimer();
      S.remain -= 1; renderTime();
      if (S.remain <= 0) { stopTimer(); onTimeUp(); }
    }, 1000);
  }
  function stopTimer(){ if (S && S.timerId) { clearInterval(S.timerId); S.timerId = null; } }

  /* 页面不可见就停表：既护住「广告开在新标签」（directlink 按访问计费，玩家真的会离开页面），
     也顺手修掉「切后台接个电话回来时间没了」——限时关卡里这同样是差体验。 */
  document.addEventListener('visibilitychange', function () {
    if (!S || S.done) return;
    if (document.hidden) pauseClock();
    else resumeClock();
  });

  /* ============ 渲染 ============ */
  function renderBoard() {
    boardEl.innerHTML = '';
    boardEl.style.gridTemplateColumns = 'repeat(' + S.size + ',1fr)';
    for (var i = 0; i < S.size * S.size; i++) {
      var d = document.createElement('div');
      d.className = 'cell' + (S.size >= 9 ? ' small' : '');
      d.dataset.idx = i;
      var region = S.board.region[i] % COLORS.length;
      var texture = REGION_TEXTURES[region];
      d.style.backgroundColor = COLORS[region];
      d.style.backgroundImage = texture.image;
      d.style.backgroundSize = texture.size;
      var mk = document.createElement('span'); mk.className = 'mk'; d.appendChild(mk);
      boardEl.appendChild(d);
    }
    boardEl.onpointerdown = onTap;
  }
  function cellEl(idx){ return boardEl.children[idx]; }
  function renderHud() {
    $('hudLv').textContent = S.lv;
    $('hudLeft').textContent = S.size - S.found.size;
    var hs = '';
    for (var i = 0; i < 3; i++) hs += '<b class="' + (i < S.lives ? '' : 'off') + '">♥</b>';
    $('hearts').innerHTML = hs;
    $('cntMine').textContent = Stock.stock(save, 'toolMine');
    $('cntSafe').textContent = Stock.stock(save, 'toolSafe');
    renderTime();
  }
  function renderTime() {
    var el = $('hudTime');
    if (S.remain == null) { el.textContent = '∞'; el.classList.remove('low'); return; }
    var s = Math.max(0, S.remain);
    el.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    el.classList.toggle('low', s <= 30);
  }

  /* ============ 点击：单击标记 / 双击挖开 / 拖动批量标记 ============ */
  var drag = null;   // {pointerId,startIdx,lastIdx,mode:'mark'|'erase',moved}

  function canPaint(idx) { return !(S.found.has(idx) || S.opened.has(idx)); }

  // 拖动涂抹：mark 只标记未标记的；erase 只取消已标记的；雷/已挖开一律跳过
  function applyMark(idx, mode) {
    if (!canPaint(idx)) return;
    var el = cellEl(idx);
    if (mode === 'mark') {
      if (S.marks.has(idx)) return;
      S.marks.add(idx); el.classList.add('safe');
    } else {
      if (!S.marks.has(idx)) return;
      S.marks.delete(idx); el.classList.remove('safe', 'hintsafe');
    }
  }

  function cellIdxFromPoint(ev) {
    var t = document.elementFromPoint(ev.clientX, ev.clientY);
    var cell = t && t.closest ? t.closest('.cell') : null;
    return (cell && boardEl.contains(cell)) ? Number(cell.dataset.idx) : -1;
  }

  function resetTapChain() {
    lastTap = { idx: -1, t: 0 };
  }

  function resetGestureState() {
    if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
    resetTapChain();
    drag = null;
  }

  function samePointer(ev, press) {
    return ev.pointerId === press.pointerId;
  }

  function commitTap(idx) {
    var now = Date.now();
    if (lastTap.idx === idx && now - lastTap.t < DBL_MS) {
      resetTapChain();
      if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
      if (dig(idx)) vibrateCorrectMine();
      return;
    }
    lastTap = { idx: idx, t: now };
    if (clickTimer) clearTimeout(clickTimer);
    clickTimer = setTimeout(function () {
      clickTimer = null;
      resetTapChain();
      toggleMark(idx);
    }, DBL_MS);
  }

  function onDragMove(ev) {
    if (!drag || S.done || !samePointer(ev, drag)) return;
    var idx = cellIdxFromPoint(ev);
    if (!drag.moved && idx !== drag.startIdx) {
      drag.moved = true;                       // 进入拖动：取消单击/双击判定
      if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
      resetTapChain();
      applyMark(drag.startIdx, drag.mode);     // 起点按拖动模式生效
    }
    if (idx < 0 || !drag.moved || idx === drag.lastIdx) return;
    drag.lastIdx = idx;
    applyMark(idx, drag.mode);
  }

  function onDragEnd(ev) {
    if (!drag || !samePointer(ev, drag)) return;
    var press = drag;
    drag = null;
    if (ev.type === 'pointercancel' || ev.isPrimary === false ||
        (typeof ev.button === 'number' && ev.button !== 0)) {
      resetGestureState();   // 必须连 pending 的单击计时器一起清：否则手势取消后仍会冒出「幽灵安全标记」
      return;
    }
    if (S.done || press.moved) return;
    var idx = cellIdxFromPoint(ev);
    if (idx !== press.startIdx) {
      resetGestureState();   // 在别的格子抬手＝放弃这次点击，pending 计时器同样要清掉
      return;
    }
    commitTap(press.startIdx);
  }
  document.addEventListener('pointermove', onDragMove, { passive: true });
  document.addEventListener('pointerup', onDragEnd);
  document.addEventListener('pointercancel', onDragEnd);

  function onTap(ev) {
    if (ev.isPrimary === false || (typeof ev.button === 'number' && ev.button !== 0)) return;
    if (S.done) return;
    var cell = ev.target.closest('.cell');
    if (!cell) return;
    var idx = Number(cell.dataset.idx);
    if (S.found.has(idx) || S.opened.has(idx)) return;
    if (drag) return;
    // 记录拖动起点：起点已标记 → 本次拖动取消标记；未标记 → 本次拖动补标记
    drag = {
      pointerId: ev.pointerId,
      startIdx: idx,
      lastIdx: idx,
      mode: S.marks.has(idx) ? 'erase' : 'mark',
      moved: false
    };
  }

  function toggleMark(idx) {
    if (S.clue && S.clue.idx === idx) clearClue();   // 玩家照着提示落子了，高亮该退场
    if (S.done || S.found.has(idx) || S.opened.has(idx)) return;
    var el = cellEl(idx);
    if (S.marks.has(idx)) { S.marks.delete(idx); el.classList.remove('safe', 'hintsafe'); }
    else { S.marks.add(idx); el.classList.add('safe'); blip(660, .06); }
  }

  function vibrateCorrectMine() {
    try {
      if (typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function') navigator.vibrate(18);
    } catch (e) {}
  }

  function dig(idx) {
    var el = cellEl(idx);
    /* 玩家照着线索挖了 → 高亮与线索条必须退场。
       toggleMark 里早就有这一句，dig 却漏了，于是「挖完雷 ❓ 还挂在格子上」
       （2026-08-27 真页面验收逮到）。落子的两条路都要收口。 */
    if (S.clue && S.clue.idx === idx) clearClue();
    if (S.mines.has(idx)) {                 // 挖中雷 = 找对
      S.found.add(idx); S.marks.delete(idx);
      el.classList.remove('safe', 'hintsafe');
      el.classList.add('mine', 'pop');
      cheer();                              // 找对了：轻轻鼓励一下
      renderHud();
      if (S.found.size === S.size) onWin();
      return true;
    } else {                                // 挖错 → 扣血
      S.opened.add(idx); S.marks.delete(idx);
      el.classList.remove('safe', 'hintsafe');
      el.classList.add('opened', 'boom');
      blip(320, .25);   // 原来 140Hz：手机小喇叭物理上放不出这么低的频率，等于没有反馈
      S.lives -= 1; renderHud();
      if (S.lives <= 0) return onDead();
      toast(t('notMine', { lives: S.lives }));
    }
  }

  /* ============ 道具 ============ */
  $('toolMine').addEventListener('click', function () {
    if (S.done) return;
    if (Stock.stock(save, 'toolMine') <= 0) return offerAdTool('toolMine', t('itemToolMineName'));
    /* S.found 是 Set，引擎按数组消费（indexOf）：直接把 Set 传进去会抛 TypeError，
       道具点了等于没点（库存不减、雷也不标） */
    var idx = MineEngine.pickUnfoundMine(S.board, Array.from(S.found));
    if (idx < 0) return toast(t('allMinesFound'));
    if (!spendTool('toolMine')) return offerAdTool('toolMine', t('itemToolMineName'));
    S.found.add(idx); S.marks.delete(idx);
    var el = cellEl(idx);
    el.classList.remove('safe', 'hintsafe');
    el.classList.add('mine', 'pop');
    cheer();                                // 道具找到的雷同样给鼓励音
    renderHud();
    if (S.found.size === S.size) onWin();
  });

  /* 道具「找线索」（2026-08-26 改造，owner 选定方案 A）：
     不再随机给一个安全格——按当前盘面的真实线索推出一格，高亮线索来源并讲清理由，
     落子仍由玩家自己点。事实喂 S.opened(已挖开=非雷)、S.found(已确认的雷) 与 S.marks；
     marks 是玩家自己的记号（可能表示「排除」，也可能表示「我怀疑这儿有雷」），
     引擎只采信其中确实不是雷的那些，**不拿它去判玩家标错**。 */
  function clearClue() {
    if (!S || !S.clue) return;
    var el;
    (S.clue.paint || []).forEach(function (i) {
      el = cellEl(i);
      if (el) el.classList.remove('cluegroup', 'clueruled', 'cluestep', 'cluepend', 'cluerange',
        'clueline', 'clueline-row', 'clueline-col', 'cluecause');
    });
    el = cellEl(S.clue.idx); if (el) el.classList.remove('cluespot');
    $('board').classList.remove('spotlight', 'rangelit');
    S.clue = null;
    $('clueBar').hidden = true;
  }

  /* 一条线索拆成 N 步：前面每一步讲「这几格为什么不是雷」（引擎的 ruled 记账），
     最后一步才是结论。修的正是用户实报的「按提示其实有多个选择，但只解释了正确的那个」——
     组里每一格欠的理由，现在逐格还清；实在还不清的（enum 层）走 pending 明说。 */
  function clueSteps(hint) {
    var steps = (hint.ruled || []).map(function (r) { return { kind: 'ruled', r: r }; });
    /* 兜底层（enum）讲不出理由：这时先插一步**只给范围**，答案要玩家自己点「直接告诉我」才揭晓。
       用户实报「这个提示无端端就给出了最终答案，不理解」——「无端端」的要害不是答案不对，
       而是**替玩家做了揭晓这个决定**。讲得清的层不插这一步（它本来就在讲理）。 */
    if (hint.why === 'enum' && (hint.shortlist || []).length > 1) steps.push({ kind: 'range' });
    steps.push({ kind: 'final' });
    return steps;
  }

  /* 这一步的理由指的是哪一整条线（行/列）？没有就返回 null（如「紧贴着雷」是邻域，不是线）。 */
  function stepLine(step, hint) {
    /* 'range' 步没有 r（它讲的不是某条排除规则，而是「范围就在这一组里」），
       所以跟结论步一样按 hint.group 取线；不加这一档会踩 step.r 为 undefined 直接崩。 */
    if (step.kind === 'final' || step.kind === 'range') {
      var g = hint.group;
      return g && (g.kind === 'row' || g.kind === 'col') ? { kind: g.kind, at: g.at } : null;
    }
    var r = step.r;
    if (r.rule === 'group-mine' && r.group) return { kind: r.group.kind, at: r.group.at };
    if (r.rule === 'confine' && r.from) return { kind: r.from.kind, at: r.from.at };
    if (r.rule === 'squeeze') return { kind: r.lineKind, at: r.from };
    return null;
  }

  function lineCells(ref) {
    var out = [], size = S.size, i;
    if (!ref || (ref.kind !== 'row' && ref.kind !== 'col')) return out;
    for (i = 0; i < size; i++) out.push(ref.kind === 'row' ? ref.at * size + i : i * size + ref.at);
    return out;
  }

  function showClue(hint, step) {
    var steps = clueSteps(hint);
    var i = Math.max(0, Math.min(step || 0, steps.length - 1));
    var cur = steps[i], last = i === steps.length - 1;
    var groupCells = (hint.group && hint.group.cells ? hint.group.cells : [])
      .filter(function (c) { return c !== hint.idx; });
    var ruled = hint.ruled || [], pending = hint.pending || [];

    clearClue();
    var marked = groupCells.slice();
    ruled.forEach(function (r) { r.cells.forEach(function (c) { if (marked.indexOf(c) < 0) marked.push(c); }); });
    pending.forEach(function (c) { if (marked.indexOf(c) < 0) marked.push(c); });
    /* 整条线只是「看这儿」的背景带，不该跟着吃组框；paint 只是清理用的并集。 */
    var line = lineCells(stepLine(cur, hint));
    var paint = marked.slice();
    line.forEach(function (c) { if (paint.indexOf(c) < 0) paint.push(c); });
    S.clue = { idx: hint.idx, paint: paint, hint: hint, step: i };

    var lineRef = stepLine(cur, hint);
    var lineDir = lineRef && lineRef.kind === 'col' ? 'clueline-col' : 'clueline-row';
    line.forEach(function (c) {
      var el = cellEl(c);
      if (el) el.classList.add('clueline', lineDir);
    });
    /* 这一步的依据（「第 N 行已经有雷了」里的那颗雷 / 「紧贴着雷」里那颗雷）要指出来，
       否则玩家得自己在亮行里找「哪儿已经有雷了」。 */
    if (!last && cur.r && Number.isInteger(cur.r.at)) {
      var causeEl = cellEl(cur.r.at);
      if (causeEl) causeEl.classList.add('cluecause');
      if (paint.indexOf(cur.r.at) < 0) paint.push(cur.r.at);
    }
    /* k 组覆盖的依据是「这几个组的雷只能落在这些格里」——那些候选格必须点出来，
       否则玩家无从验算，这条理由就退化成又一句空话。 */
    if (!last && cur.r && cur.r.cand) {
      cur.r.cand.forEach(function (c) {
        var el = cellEl(c);
        if (el) el.classList.add('cluecause');
        if (paint.indexOf(c) < 0) paint.push(c);
      });
    }
    /* **讲过的排除要落成玩家自己的 ✕，不能随线索一起消失**（用户实报 2026-08-29：
       「推理过程标记不是雷的都需要保留下来，现在推理过程结束了，所有标记都自动消失了」）。
       线索的高亮是临时态，clearClue 会全清；真正留下来的是 S.marks + .safe。
       逐步落：讲到第几步就落到第几步 —— 中途关掉，已经讲明白的那部分照样留在盘面上。
       落下来还有个连带好处：下一次用道具时它们已是既有事实，链会更短。 */
    ruled.forEach(function (r, ri) {
      if (ri > i) return;
      r.cells.forEach(function (c) {
        if (S.found.has(c) || S.opened.has(c) || S.marks.has(c)) return;
        S.marks.add(c);
        var el = cellEl(c);
        if (el) el.classList.add('safe');
      });
    });

    /* 讲解途中开聚光灯，把这一行以外的格子压暗；结论步恢复全亮（那时要看整个色块） */
    $('board').classList.toggle('spotlight', !last && cur.kind !== 'range' && line.length > 0);
    $('board').classList.toggle('rangelit', cur.kind === 'range');
    /* 组的橙框只在**结论步**铺：讲解途中焦点必须唯一，否则一大片橙色会压过
       当前这一步的绿色高亮，玩家的视线被引到不该看的地方（视觉评审实测的层次反转）。 */
    /* 橙框 = 「这一组」。**只能套在结论组的格上**：v6 起 marked 里还混着整条推理链
       沿途排掉的格（散落全盘），给它们套橙框等于谎称它们属于这一组（2026-08-29 截图逮到）。 */
    if (last) groupCells.forEach(function (c) { var el = cellEl(c); if (el) el.classList.add('cluegroup'); });
    /* v6 起 ruled 是**整条推理链**，沿途排掉的格可能散落全盘、颜色各异。
       讲解途中要把它们画出来（那是路径），但**结论步只画结论组**：
       结论那句话说的是「这个色块其它格都排除了」，画面上若混进别的颜色，
       文案与画面当场自相矛盾（真页面门禁 2026-08-28 立的规矩，2026-08-29 差点被链改破坏）。 */
    var groupSet = {};
    (hint.group && hint.group.cells ? hint.group.cells : []).forEach(function (c) { groupSet[c] = 1; });
    ruled.forEach(function (r, ri) {
      if (ri > i && !last) return;                       // 还没讲到的步骤先不剧透
      var cls = (!last && ri === i) ? 'cluestep' : 'clueruled';
      r.cells.forEach(function (c) {
        if (last && !groupSet[c]) return;
        var el = cellEl(c);
        if (el) { el.classList.remove('cluegroup'); el.classList.add(cls); }
      });
    });
    if (last) pending.forEach(function (c) {
      var el = cellEl(c);
      if (el) { el.classList.remove('cluegroup'); el.classList.add('cluepend'); }
    });
    /* 范围步：把候选整片点亮，但**绝不点亮答案格** —— 这一步的全部意义就是先不揭晓 */
    if (cur.kind === 'range') {
      (hint.shortlist || []).forEach(function (c) {
        var el = cellEl(c);
        if (el) { el.classList.remove('cluegroup', 'clueruled'); el.classList.add('cluerange'); }
        if (paint.indexOf(c) < 0) paint.push(c);
      });
    } else {
      var spot = cellEl(hint.idx);
      if (spot) spot.classList.add('cluespot');
    }

    var bar = $('clueBar');
    bar.hidden = false;
    bar.classList.toggle('deep', last && pending.length > 0);
    /* 进度光靠「第 i/N 步」几个字看不出来，补一排点阵（纯符号，不进字典） */
    var dots = '';
    for (var d = 0; d < steps.length; d++) dots += (d <= i ? '●' : '○');
    $('clueStep').textContent = steps.length > 1
      ? t('clueStepOf', { i: i + 1, n: steps.length }) + '  ' + dots : '';
    if (cur.kind === 'ruled') {
      $('clueIc').textContent = '🔎';        // 🚫 是全卡最扎眼的红，且与「排掉」语义重复
      $('clueTitle').textContent = t('clueRuledTitle', { k: cur.r.cells.length });
      $('clueWhy').textContent = clueRuledText(cur.r);
      $('clueAct').textContent = '';
      $('clueOk').textContent = t('clueNextStep');
    } else if (cur.kind === 'range') {
      /* 只给范围那一步：按钮从「下一步」换成「直接告诉我」，揭晓这个动作交回玩家手里 */
      $('clueIc').textContent = '🔦';
      $('clueTitle').textContent = t('clueRangeTitle');
      $('clueWhy').textContent = t('clueRange', { k: (hint.shortlist || []).length });
      $('clueAct').textContent = '';
      $('clueOk').textContent = t('clueReveal');
    } else {
      $('clueIc').textContent = pending.length ? '🧩' : '💣';
      $('clueTitle').textContent = t(pending.length ? 'cluePendTitle' : 'clueMineTitle');
      /* 理由 + 落子动作：光指位置不够，得告诉他「双击才算挖雷」——
         单击是打 ✕，玩家照着提示单击等于把雷 ✕ 掉，比不提示还糟。 */
      $('clueWhy').textContent = clueWhyText(hint);
      $('clueAct').textContent = '👉 ' + t('clueAction');
      $('clueOk').textContent = t('clueGotIt');
    }
  }

  /* 每一步「排掉这几格」的理由：规则 + 依据（哪一组 / 哪颗雷 / 哪两条线），
     全部来自引擎的 ruled 记账，不在 UI 层自己编。 */
  /* 指示词而不是行号：画面已经把那一整条点亮了，文字再说「第 9 行」等于请玩家
     从上往下数一遍去核对 —— 六轮视觉评审反复卡在这一句上，根因是文案在用文字
     重复画面已经做到的事。画面负责定位，文案只负责讲理。 */
  function groupDeixis(g) {
    if (g && g.kind === 'row') return t('gThisRow');
    if (g && g.kind === 'col') return t('gThisCol');
    return t('gThisRegion');
  }

  function clueRuledText(r) {
    var k = r.cells.length;
    if (r.rule === 'group-mine') return t('clueRuledGroupMine', { g: groupDeixis(r.group), k: k });
    if (r.rule === 'touch-mine') return t('clueRuledTouchMine', { k: k });
    /* confine 牵扯两组，两边都用指示词就分不清谁是谁：被点亮的那一组用指示词，另一组具名。 */
    if (r.rule === 'confine') return t('clueRuledConfine', { a: groupDeixis(r.from), b: groupLabel(r.into), k: k });
    /* k 组覆盖：两边都是一串组名，必须都具名（指示词只够指一个「这」） */
    if (r.rule === 'cover') return t('clueRuledCover', { a: groupList(r.from), b: groupList(r.into), k: k });
    /* 反证（v6）：这一步没有「一眼可见」的理由，必须把矛盾说出来，否则又变成天降结论 */
    if (r.rule === 'refute') {
      var bad = r.bad === 'adjacent' ? t('clueRefuteAdj')
        : t('clueRefuteEmpty', { g: r.badGroup ? groupLabel(r.badGroup) : t('gRegion') });
      return t('clueRuledRefute', { bad: bad });
    }
    return t('clueRuledSqueeze', { a: groupDeixis({ kind: r.lineKind }), k: k });
  }

  /* 一串组名（k 组覆盖要一口气念两三个组） */
  function groupList(gs) {
    return (gs || []).map(groupLabel).join(t('gJoin'));
  }

  /* 组名（讲理由时要指得出是哪一行/哪一列/哪个色块） */
  function groupLabel(g) {
    if (!g) return t('gRegion');
    if (g.kind === 'row') return t('gRow', { n: (g.at || 0) + 1 });
    if (g.kind === 'col') return t('gCol', { n: (g.at || 0) + 1 });
    return t('gRegion');
  }

  /* 理由文案：局部推理讲得出具体规则；深度判定（跨行列联立）诚实说明，
     不硬编一个假理由——假理由比没理由更伤信任。 */
  function clueWhyText(hint) {
    var g = hint.group || {};
    var n = (g.at || 0) + 1;

    var hint = MineEngine.clueNext(S.board, {

          S.done = false;

      t('restart'), function () { wsOnLose(); startLevel(S.lv); },
