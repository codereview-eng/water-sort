name: CI

# 纪律（2026-08-21 定案）：每次改动都要跑 CI，全绿才算改完。
# 本地入口与这里跑的是同一份脚本：./scripts/ci.sh
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 单元/契约测试 + 多语言静态 gate（字典对等 / en 无中文 / 占位符一致 / 内嵌副本同步）
      - name: 单元与契约测试
        run: node --test ./*.test.js ./core/*.test.js

      - name: 多语言静态 gate
        run: node --test i18n-parity.test.js i18n-no-cjk-leak.test.js

      # 运行时 gate：把游戏切英文逐屏扫残留中文。CI 里用 headless Chrome 开一个调试端口；
      # 端口起不来时脚本退 2（SKIP），这里显式当失败处理，避免「没跑却看着是绿的」。
      - name: 启动 headless Chrome（调试端口 19301）
        run: |
          google-chrome --version || chromium --version
          (google-chrome --headless=new --remote-debugging-port=19301 \
             --no-sandbox --disable-gpu --user-data-dir=/tmp/cdp-profile about:blank &) || \
          (chromium --headless=new --remote-debugging-port=19301 \
             --no-sandbox --disable-gpu --user-data-dir=/tmp/cdp-profile about:blank &)
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:19301/json/version >/dev/null; do sleep 1; done'

      - name: 多语言运行时 gate（英文模式逐屏扫中文）
        run: node scripts/i18n-cjk-scan.mjs

      - name: 汇总
        run: ./scripts/ci.sh --require-runtime
