<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>倒水排序 · Water Sort</title>
<style>
/* 主题变量与 sudoku.html 同源（墨绿深色），液体色取自 water-levels.js 的 PALETTE */
:root{
  --canvas:#141A16; --surface:#1B231D; --ink:#F7EDE8; --ink-2:#B2C0B6; --ink-3:#7C8B81;
  --accent:#7FC29B; --podium:#D4B36A; --bad:#DE7A70; --warn:#D2A05C;
  --edge:#25312A; --edge-strong:#3E5145; --overlay:rgba(10,14,11,.72);
  --mono:ui-monospace,"SF Mono",Consolas,"Noto Sans Mono CJK SC",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--canvas); color:var(--ink); overflow:hidden;
  font-family:-apple-system,system-ui,"PingFang SC","Noto Sans CJK SC",sans-serif;
  display:flex; flex-direction:column; align-items:center;
}
.wrap{width:100%; max-width:480px; height:100%; display:flex; flex-direction:column; padding:10px 16px 18px}

/* ---- 顶栏 ---- */
.top{display:flex; align-items:center; gap:10px; height:44px; flex:none}
.icobtn{
  width:36px;height:36px;flex:none;border:1px solid var(--edge);border-radius:50%;
  background:var(--surface);color:var(--ink-2);font-size:18px;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer
}
.icobtn:active{background:var(--edge)}
.title{flex:1;text-align:center;font-size:19px;font-weight:700;letter-spacing:.04em}
.steps{
  flex:none;min-width:66px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--ink-3);
  font-variant-numeric:tabular-nums
}
.steps b{color:var(--accent);font-size:15px}
.sub{flex:none;text-align:center;font-size:12.5px;color:var(--ink-3);margin:2px 0 0}
.par{
  display:inline-block;margin-top:8px;padding:3px 10px;border-radius:999px;
  background:rgba(127,194,155,.12); border:1px solid rgba(127,194,155,.35);
  color:var(--accent); font-family:var(--mono); font-size:11.5px
}

/* ---- 试管区 ---- */
.board{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;padding:6px 0}
.row{display:flex;justify-content:center;align-items:flex-start;gap:18px}
.slot{display:flex;flex-direction:column;align-items:center;gap:7px}
.tube{
  width:58px;height:172px;flex:none;position:relative;cursor:pointer;
  border:2px solid var(--edge-strong); border-top:2px solid rgba(255,255,255,.10);
  border-radius:6px 6px 28px 28px;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  display:flex; flex-direction:column-reverse; overflow:hidden;
  transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}
.tube::after{ /* 玻璃高光 */
  content:"";position:absolute;left:7px;top:8px;bottom:14px;width:6px;border-radius:6px;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0));pointer-events:none
}
.tube.sel{transform:translateY(-14px);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 8px 20px rgba(127,194,155,.18)}
.tube.done{border-color:rgba(127,194,155,.55)}
.tube.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.tube.hintsrc,.tube.hintdst{border-color:var(--podium);box-shadow:0 0 0 1px var(--podium)}
.liq{
  width:100%;height:25%;flex:none;position:relative;
  transition:height .22s ease, opacity .22s ease;
}
.liq.surface::before{ /* 只有最上层液面画弧线，中间层保持平整 */
  content:"";position:absolute;left:0;right:0;top:-3px;height:6px;border-radius:50%;
  background:inherit;filter:brightness(1.18)
}
.liq.top-seg::after{
  content:"";position:absolute;left:0;right:0;top:0;bottom:0;
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 60%)
}
.tube.empty{border-color:#4B5F53;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.008))}
.tag{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);line-height:1}
.slot.done .tag{color:var(--accent)}

/* ---- 底栏 ---- */
.bar{flex:none;display:flex;justify-content:center;gap:26px;padding-top:6px}
.act{
  width:60px;background:none;border:none;color:var(--ink-2);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;padding:0
}
.act .ring{
  width:50px;height:50px;border-radius:50%;border:1px solid var(--edge);
  background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:21px
}
.act:disabled{opacity:.38;cursor:default}
.act:not(:disabled):active .ring{background:var(--edge)}

/* ---- 胜利遮罩 ---- */
.win{
  position:fixed;inset:0;background:var(--overlay);display:none;
  align-items:center;justify-content:center;backdrop-filter:blur(3px)
}
.win.show{display:flex}
.card{
  width:280px;background:var(--surface);border:1px solid var(--edge);border-radius:16px;
  padding:22px 20px;text-align:center
}
.card h2{margin:0 0 6px;font-size:22px;color:var(--accent)}
.card p{margin:0 0 16px;font-size:13px;color:var(--ink-2);font-family:var(--mono)}
.card button{
  width:100%;padding:11px;border-radius:10px;border:none;background:var(--accent);
  color:#10201A;font-size:15px;font-weight:700;cursor:pointer
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="icobtn" id="btnBack" aria-label="返回">‹</button>
    <div class="title" id="lvTitle">第 1 关</div>
    <div class="steps">步数 <b id="stepCount">0</b></div>
  </div>
  <div class="sub">
    把同色液体倒到一起，每根试管只剩一种颜色<br>
    <span class="par" id="parTag">最少 4 步可过</span>
  </div>

  <div class="board" id="board"></div>

  <div class="bar">
    <button class="act" id="btnUndo" disabled><span class="ring">↺</span><span>撤销</span></button>
    <button class="act" id="btnReset"><span class="ring">⟳</span><span>重开</span></button>
    <button class="act" id="btnHint"><span class="ring">💡</span><span>提示</span></button>
  </div>
</div>

<div class="win" id="winMask">
  <div class="card">
    <h2>过关！</h2>
    <p id="winInfo"></p>
    <button id="btnAgain">再玩一次</button>
  </div>
</div>

<script src="./water-engine.js"></script>
<script src="./water-levels.js"></script>
<script>
(function(){
  'use strict';
  var E = window.WaterEngine, L = window.WaterLevels;
  var LEVEL_ID = 1;
  var lv = L.getLevel(LEVEL_ID);
  var state, undoStack, moves, selected, locked;

  var board = document.getElementById('board');
  var elSteps = document.getElementById('stepCount');
  var elUndo = document.getElementById('btnUndo');
  var winMask = document.getElementById('winMask');

  function reset(){
    state = L.initialState(LEVEL_ID);
    undoStack = []; moves = 0; selected = -1; locked = false;
    winMask.classList.remove('show');
    render();
  }

  function tubeEl(i){ return board.querySelector('[data-tube="'+i+'"]'); }

  function render(){
    // 上排 3 管 + 下排 2 管（试管数变化时按每行最多 4 管自动排布）
    var perRow = state.length <= 4 ? state.length : Math.ceil(state.length/2);
    var html = '', idx = 0;
    while (idx < state.length){
      html += '<div class="row">';
      for (var k=0; k<perRow && idx<state.length; k++, idx++){
        html += renderTube(idx);
      }
      html += '</div>';
    }
    board.innerHTML = html;
    elSteps.textContent = moves;
    elUndo.disabled = undoStack.length === 0;
  }

  function renderTube(i){
    var t = state[i];
    var full = t.length > 0 && E.isDone(t, lv.capacity);
    var cls = 'tube' + (i===selected ? ' sel' : '') + (full ? ' done' : '') + (t.length===0 ? ' empty' : '');
    var run = E.topRun(t);
    var layers = '';
    for (var k=0; k<t.length; k++){
      var isTopSeg = k >= t.length - run;       // 顶部同色段：选中时整段一起走
      var isSurface = k === t.length - 1;       // 最上层：画液面弧线
      layers += '<div class="liq'+(isTopSeg?' top-seg':'')+(isSurface?' surface':'')+
                '" style="height:'+(100/lv.capacity)+'%;background:'+L.PALETTE[t[k]]+
                '" data-color="'+t[k]+'"></div>';
    }
    // 标签给的是「还差多少」的判断依据：空管 / 完成 / 这管混了几种颜色
    var kinds = t.filter(function(c,k){ return t.indexOf(c) === k; }).length;
    var tag = t.length===0 ? '空管' : (full ? '完成' : kinds + ' 色');
    return '<div class="slot'+(full?' done':'')+'">'+
             '<div class="'+cls+'" data-tube="'+i+'">'+layers+'</div>'+
             '<span class="tag">'+tag+'</span>'+
           '</div>';
  }

  function shake(i){
    var el = tubeEl(i); if(!el) return;
    el.classList.add('shake');
    setTimeout(function(){ el.classList.remove('shake'); }, 340);
  }

  function onTube(i){
    if (locked) return;
    if (selected === -1){
      if (!state[i].length){ shake(i); return; }   // 空管不能当源
      selected = i; render(); return;
    }
    if (selected === i){ selected = -1; render(); return; }  // 再点一次取消

    var res = E.pour(state, selected, i, lv.capacity);
    if (!res){ shake(i); return; }                 // 非法：抖动，不消耗步数

    undoStack.push(JSON.stringify(state));
    state = res.state; moves += 1;
    var from = selected; selected = -1;
    locked = true;
    render();
    // 倒水过渡结束后再解锁 / 判胜（动画期间锁输入）
    setTimeout(function(){
      locked = false;
      if (E.isSolved(state, lv.capacity)) showWin();
    }, 240);
    void from;
  }

  function showWin(){
    document.getElementById('winInfo').textContent =
      '用了 ' + moves + ' 步 · 最少 ' + lv.minMoves + ' 步' + (moves === lv.minMoves ? ' · 最优解' : '');
    winMask.classList.add('show');
  }

  board.addEventListener('click', function(ev){
    var el = ev.target.closest ? ev.target.closest('[data-tube]') : null;
    if (el) onTube(Number(el.getAttribute('data-tube')));
  });

  elUndo.addEventListener('click', function(){
    if (!undoStack.length || locked) return;
    state = JSON.parse(undoStack.pop());
    moves = Math.max(0, moves-1); selected = -1;
    render();
  });
  document.getElementById('btnReset').addEventListener('click', reset);
  document.getElementById('btnAgain').addEventListener('click', reset);
  document.getElementById('btnBack').addEventListener('click', function(){ history.length>1 ? history.back() : reset(); });

  document.getElementById('btnHint').addEventListener('click', function(){
    if (locked) return;
    var mv = E.hint(state, { capacity: lv.capacity });
    if (!mv) return;
    var a = tubeEl(mv[0]), b = tubeEl(mv[1]);
    if (a) a.classList.add('hintsrc');
    if (b) b.classList.add('hintdst');
    setTimeout(function(){
      if (a) a.classList.remove('hintsrc');
      if (b) b.classList.remove('hintdst');
    }, 1100);
  });

  document.getElementById('lvTitle').textContent = '第 ' + lv.id + ' 关';
  document.getElementById('parTag').textContent = '最少 ' + lv.minMoves + ' 步可过';

  // 截图用：?zoom=2 放大整页（headless 下按物理像素出 2x 图，不动布局逻辑）
  var zoomParam = Number(new URLSearchParams(location.search).get('zoom'));
  if (zoomParam > 0) document.documentElement.style.zoom = String(zoomParam);

  // ?play=solve：按求解器最优解自动走完（截图/回归验证用，正常玩法不受影响）
  function autoSolve(){
    var r = E.solve(state, { capacity: lv.capacity });
    if (!r.solvable) return;
    var seq = [], k;
    for (k=0; k<r.moves.length; k++) seq.push(r.moves[k][0], r.moves[k][1]);
    (function step(n){
      if (n >= seq.length) return;
      onTube(seq[n]);
      setTimeout(function(){ step(n+1); }, 320);
    })(0);
  }

  // 截图/自动化用的 ground-truth 钩子：先断言状态，再截图
  window.__water = {
    get state(){ return state; },
    get moves(){ return moves; },
    get selected(){ return selected; },
    get solved(){ return E.isSolved(state, lv.capacity); },
    level: lv,
    tap: onTube,
    reset: reset,
  };

  reset();
  if (new URLSearchParams(location.search).get('play') === 'solve') setTimeout(autoSolve, 400);
})();
</script>
</body>
</html>
