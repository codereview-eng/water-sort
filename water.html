<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>倒水排序 · Water Sort</title>
<!-- Telegram Mini App SDK(仅在 Telegram 内生效;浏览器打开自动降级)。
     issue #20:自托管同源副本(telegram.org 在部分网络被墙导致身份丢失),
     onerror 动态注入官方 URL 作后备。 -->
<script src="./tg-web-app.js" onerror="(function(){var s=document.createElement('script');s.src='https://telegram.org/js/telegram-web-app.js';document.head.appendChild(s);})()"></script>
<!-- Monetag SDK(Rewarded Interstitial zone 11440777) -->
<style>
:root{
  --canvas:#141A16; --surface:#1B231D; --elevated:#232E26;
  --ink:#E7EDE8; --ink-2:#B2C0B6; --ink-3:#8CA093; --ink-4:#57685D;
  --accent:#7FC29B; --podium:#D4B36A;
  --ok:#58B98C; --warn:#D2A05C; --bad:#DE7A70;
  --edge:#25312A; --edge-strong:#5F7568;
  --cell-same:#20362A; --cell-sel:#2B4636; --cell-peer:#1E2921;
  --chip-bad:#301F1D; --overlay:rgba(10,14,11,.72);
}
:root[data-theme=light]{
  --canvas:#F1F4F0; --surface:#FFFFFF; --elevated:#E7EDE8;
  --ink:#1E2922; --ink-2:#43554A; --ink-3:#5F7568; --ink-4:#9AABA0;
  --accent:#2E7D57; --podium:#8A6D2B;
  --ok:#247A54; --warn:#8A6414; --bad:#B44438;
  --edge:#DCE3DD; --edge-strong:#8CA093;
  --cell-same:#D8EAE0; --cell-sel:#C2E0D0; --cell-peer:#E9F0EA;
  --chip-bad:#F6E3E0; --overlay:rgba(30,41,34,.45);
}
/* ---------- 卡通瓶架（倒水玩法） ---------- */
.tubes{
  width:100%; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:18px; padding:10px 0 4px;
}
.tubes{position:relative}   /* 水流/水花按这里的坐标系绝对定位 */
.tubes .row{display:flex; justify-content:center; align-items:flex-start; gap:14px}
/* 倾倒:源管抬到目标管口上方并侧倾,倾斜轴放在管底,像真的用手拿着倒 */
.tube.pouring{z-index:6; transition:transform .22s cubic-bezier(.34,1.15,.64,1)}
.tube{transform-origin:50% 88%}
/* 水柱:Blender 渲的白色液柱做遮罩,颜色由倒出的液体决定 */
.stream{
  position:absolute; width:22px; z-index:5; pointer-events:none;
  -webkit-mask-image:url(./assets/tubes/pour-stream.png); mask-image:url(./assets/tubes/pour-stream.png);
  -webkit-mask-size:100% 100%; mask-size:100% 100%;
  -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
  transform-origin:top center; animation:streamIn .16s ease-out;
}
@keyframes streamIn{from{transform:scaleY(.08);opacity:.35}to{transform:scaleY(1);opacity:1}}
.splash{
  position:absolute; width:30px; height:19px; z-index:5; pointer-events:none;
  -webkit-mask-image:url(./assets/tubes/pour-splash.png); mask-image:url(./assets/tubes/pour-splash.png);
  -webkit-mask-size:100% 100%; mask-size:100% 100%;
  -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
  animation:splashPop .36s ease-out forwards;
}
@keyframes splashPop{0%{transform:translateY(4px) scale(.45);opacity:0}
  38%{transform:translateY(0) scale(1);opacity:.95}
  100%{transform:translateY(-3px) scale(1.18);opacity:0}}
.slot{display:flex; flex-direction:column; align-items:center; gap:6px}
/* 瓶身由 Blender 渲染的素材承担（白瓶口环/透明塑料/圆角底都是真渲染出来的，
   不再用 CSS 描边模拟）；液体 = 纯色块 + 该层遮罩，因此任意配色都能复用同一套素材。 */
.tube{
  width:58px; aspect-ratio:250/400; position:relative; cursor:pointer;   /* Q版矮胖瓶:画幅同步 blender-bottles.py 的 RES */
  transition:transform .16s ease, filter .16s ease;
}
.tube .layer{
  position:absolute; inset:0; z-index:1;
  -webkit-mask-size:100% 100%; mask-size:100% 100%;
  -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
  transition:opacity .2s ease;
}
/* 明暗底图叠在色块上（被同一遮罩裁到该层形状内），让纯色块有玻璃里的立体感 */
.tube .layer::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:url(./assets/bottles/bottle-shade.png) center/100% 100% no-repeat;
  mix-blend-mode:multiply; opacity:.48;
}
.tube .glass{
  position:absolute; inset:0; z-index:2; pointer-events:none;
  background:url(./assets/bottles/bottle-empty.png) center/100% 100% no-repeat;
  filter:drop-shadow(0 5px 4px rgba(0,0,0,.28));
}
.tube.locked .glass{opacity:.62;filter:grayscale(.35) drop-shadow(0 5px 4px rgba(0,0,0,.18))}
.bottle-unlock{
  position:absolute; left:50%; top:48%; transform:translate(-50%,-50%); z-index:4;
  width:46px; min-height:48px; padding:5px 3px; border-radius:14px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  color:var(--canvas); background:rgba(138,109,43,.93);
  border:2px solid rgba(255,255,255,.9); box-shadow:0 4px 10px rgba(30,41,34,.24);
}
.bottle-unlock .play{
  width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  padding-left:2px; color:var(--podium); background:var(--canvas); font-size:12px; line-height:1;
}
.bottle-unlock small{font-size:8px;line-height:1.1;white-space:nowrap}
.bottle-unlock.busy .play{padding-left:0}
.tube.sel{transform:translateY(-12px);filter:drop-shadow(0 8px 14px rgba(127,194,155,.45))}
.tube.done{filter:drop-shadow(0 0 6px rgba(127,194,155,.55))}
.tube.hint{filter:drop-shadow(0 0 7px rgba(212,179,106,.85))}
.tube.shake{animation:tubeshake .32s}
@keyframes tubeshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.slot .tag{font-family:ui-monospace,"SF Mono",monospace;font-size:10px;color:var(--ink-4);line-height:1}
.slot.done .tag{color:var(--accent)}
.parhint{width:100%;text-align:center;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.sfxbtn{min-width:64px;padding:7px 14px;border-radius:9px;border:1px solid var(--edge);
  background:var(--surface);color:var(--accent);font-size:14px;font-weight:600;cursor:pointer}
.sfxbtn.off{color:var(--ink-3)}
.parline{margin:-4px 0 12px;font-size:12px;color:var(--accent);text-align:center}
.tool.dim{opacity:.35}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none}
[hidden]{display:none!important}
html,body{margin:0; height:100%}
body{
  background:var(--canvas); color:var(--ink);
  font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;
  display:flex; flex-direction:column; align-items:center;
  padding:10px 12px calc(16px + env(safe-area-inset-bottom)); gap:10px;
  width:100%; max-width:480px; margin:0 auto; overflow-x:hidden;
}
button{font:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer}
.mono{font-family:ui-monospace,"SF Mono",Consolas,"Noto Sans Mono CJK SC",monospace; font-variant-numeric:tabular-nums}
/* ---------- 首页 ---------- */
.home{width:100%; display:flex; flex-direction:column; gap:14px; padding-top:26px}
.home .logo{text-align:center; font-size:30px; font-weight:700; letter-spacing:.08em}
.home .logo em{font-style:normal; color:var(--accent); display:block; font-size:13px; letter-spacing:.3em; margin-top:4px; color:var(--ink-3)}
.energy{
  background:var(--surface); border:1px solid var(--edge); border-radius:10px;
  padding:12px 16px; display:flex; align-items:center; gap:12px;
}
.energy .icon{font-size:20px}
.energy .info{flex:1}
.energy .val{font-weight:700; font-size:16px}
.energy .val .max{color:var(--ink-4); font-weight:400}
.energy .sub{font-size:11px; color:var(--ink-3)}
.energy .bar{height:5px; background:var(--elevated); border-radius:3px; margin-top:6px; overflow:hidden}
.energy .bar i{display:block; height:100%; background:var(--accent); border-radius:3px; transition:width .3s}
.bigbtn{
  width:100%; background:var(--accent); color:var(--canvas); border-radius:12px;
  padding:16px; font-size:18px; font-weight:700; text-align:center;
}
.bigbtn small{display:block; font-size:11px; font-weight:400; opacity:.75; margin-top:2px}
.homebtn{
  width:100%; background:var(--surface); border:1px solid var(--edge); border-radius:10px;
  padding:12px 16px; font-size:14px; color:var(--ink-2); display:flex; justify-content:space-between; align-items:center;
}
.homebtn b{color:var(--podium)}
/* ---------- 双连胜卡(2026-08-24 · core/winstreak.js) ---------- */
.streakcard{
  background:var(--surface); border:1px solid var(--edge); border-radius:10px;
  padding:12px 16px; display:flex; align-items:center; gap:12px;
}
.streakcard .ic{font-size:20px}
.streakcard .info{flex:1; min-width:0}
.streakcard .val{font-weight:700; font-size:16px}
.streakcard .val span{color:var(--ink-3); font-weight:400; font-size:12px}
.streakcard .sub{font-size:11px; color:var(--ink-3); display:flex; justify-content:space-between; gap:8px; margin-top:2px}
.streakcard .bar{height:5px; background:var(--elevated); border-radius:3px; margin-top:6px; overflow:hidden}
.streakcard .bar i{display:block; height:100%; background:var(--podium); border-radius:3px; transition:width .3s}
.streakcard .wsclaim{background:var(--accent); color:var(--canvas); border-radius:8px; padding:9px 12px; font-size:12px; font-weight:700; white-space:nowrap}
/* ---------- 每周活动(issue #30) ---------- */
.eventbtn{
  position:relative; width:100%; background:linear-gradient(135deg,var(--surface),var(--cell-same));
  border:1px solid var(--accent); border-radius:10px; padding:13px 16px; font-size:14px; color:var(--ink);
  display:flex; justify-content:space-between; align-items:center; gap:10px;
}
.eventbtn .left{display:flex; align-items:center; gap:10px; text-align:left}
.eventbtn .ic{font-size:20px}
.eventbtn .t b{display:block; font-size:15px; color:var(--accent)}
.eventbtn .t span{font-size:11px; color:var(--ink-3)}
.eventbtn .frag{font-size:12px; color:var(--podium); font-weight:700; white-space:nowrap}
.eventbtn .badge{position:absolute; top:-7px; right:-4px; background:var(--bad); color:#fff; font-size:10px; font-weight:700; border-radius:8px; padding:2px 7px; letter-spacing:.05em}
.weekly{width:100%; display:flex; flex-direction:column; gap:12px; padding-top:4px}
.weekly .topbar2{display:flex; align-items:center; justify-content:space-between; font-size:13px; color:var(--ink-3)}
.weekly .topbar2 .wtitle{font-weight:700; font-size:15px; color:var(--ink); letter-spacing:.06em}
.weekly .topbar2 .wtitle em{font-style:normal; color:var(--accent)}
.weekly .topbar2 button{color:var(--accent); font-weight:600; font-size:13px; padding:4px 2px}
.themecard{
  background:linear-gradient(160deg,#18241D 0%,#12281E 60%,#1B231D 100%);
  border:1px solid var(--edge-strong); border-radius:12px; padding:14px 16px;
  display:flex; align-items:center; gap:12px; position:relative; overflow:hidden;
}
.themecard .deco{position:absolute; right:-12px; top:-16px; opacity:.18; font-size:90px; line-height:1}
.themecard .t{flex:1}
/* 背景写死深色渐变,文字用固定浅色(不随明暗主题),否则浅色主题下不可读 */
.themecard .t b{font-size:19px; letter-spacing:.04em; color:#E7EDE8}
.themecard .t .sub{font-size:11px; color:#8CA093; margin-top:3px}
.themecard .cd{text-align:right}
.themecard .cd b{display:block; font-size:15px; color:#D2A05C}
.themecard .cd span{font-size:10px; color:#8CA093}
.themecard .deco{color:#E7EDE8}
.fragrow{background:var(--surface); border:1px solid var(--edge); border-radius:10px; padding:12px 16px}
.fragrow .line1{display:flex; justify-content:space-between; align-items:baseline}
.fragrow .line1 .lab{font-size:12px; color:var(--ink-3)}
.fragrow .line1 .num{font-size:22px; font-weight:700; color:var(--podium)}
.fragrow .line1 .num small{font-size:11px; color:var(--ink-3); font-weight:400}
.fragrow .carry{font-size:11px; color:var(--ok); margin-top:2px}
.track{margin-top:10px}
.track .bar{position:relative; height:8px; background:var(--elevated); border-radius:4px}
.track .bar i{position:absolute; left:0; top:0; height:100%; background:linear-gradient(90deg,var(--accent),var(--podium)); border-radius:4px}
.track .ticks{display:flex; justify-content:space-between; font-size:10px; color:var(--ink-4); margin-top:5px}
.track .ticks b{color:var(--ink-2)}
.wkgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
.pic{background:var(--surface); border:1px solid var(--edge); border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:8px; position:relative}
.pic svg{width:100%; height:88px; border-radius:6px; background:var(--elevated); display:block}
.pic .cap{display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--ink-3); gap:6px}
.pic .cap b{color:var(--ink-2); font-size:12px; white-space:nowrap}
.pic .tag{font-size:10px; font-weight:700; border-radius:4px; padding:2px 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pic.open{border-color:var(--accent)}
.pic.open .tag{background:var(--cell-same); color:var(--ok)}
.pic.cur{border-color:var(--podium)}
.pic.cur .tag{background:#2F281C; color:var(--warn)}
.pic.lock svg{filter:grayscale(1) brightness(.55)}
.pic.lock .tag{background:var(--elevated); color:var(--ink-4)}
.pic.lock .lockov{position:absolute; inset:10px 10px auto 10px; height:88px; border-radius:6px; background:var(--overlay); display:flex; align-items:center; justify-content:center; font-size:22px}
.pic .prog{height:4px; background:var(--elevated); border-radius:2px; overflow:hidden}
.pic .prog i{display:block; height:100%; background:var(--warn)}
.claimbtn{border:0; border-radius:6px; padding:6px 12px; font-size:12px; font-weight:700; background:var(--accent); color:#0B1410; cursor:pointer}
.pic .claimbtn{width:100%; padding:6px 0}
.pic.claimable{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset}
.pic.claimable .tag{background:var(--cell-same); color:var(--ok)}
.grand .st.ready{border:0; padding:0}
.grand .st.ready .claimbtn{background:var(--podium)}
.themecard .banner{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.26; pointer-events:none}
.themecard .t,.themecard .cd{position:relative}
.grand{border:1px dashed var(--podium); border-radius:12px; background:var(--surface); padding:13px 16px; display:flex; align-items:center; gap:12px}
.grand .ic{font-size:26px}
.grand .t{flex:1}
.grand .t b{font-size:14px; color:var(--podium)}
.grand .t div{font-size:11px; color:var(--ink-3); margin-top:2px}
.grand .st{font-size:11px; color:var(--ink-4); border:1px solid var(--edge); border-radius:6px; padding:4px 8px; white-space:nowrap}
.grand.done .st{color:var(--ok); border-color:var(--accent)}
.wkadbar{width:100%; border:1px dashed var(--edge-strong); border-radius:10px; padding:11px 14px; display:flex; align-items:center; gap:10px; background:var(--surface); font-size:13px; color:var(--ink-2)}
.wkadbar .adtag{background:var(--podium); color:var(--canvas); font-size:10px; font-weight:700; border-radius:4px; padding:2px 6px; letter-spacing:.04em; white-space:nowrap}
.wkadbar b{color:var(--accent)}
.wknote{font-size:11px; color:var(--ink-4); display:flex; gap:8px; align-items:center; padding:0 4px}
.wknote .dot{color:var(--ink-3)}
.homestats{display:flex; gap:10px}
.homestats .st{flex:1; background:var(--surface); border:1px solid var(--edge); border-radius:10px; padding:10px 12px; text-align:center}
.homestats .st b{display:block; font-size:20px; color:var(--accent)}
.homestats .st span{font-size:11px; color:var(--ink-3)}
.langrow{display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--edge); border-radius:10px; padding:10px 12px}
.langrow label{font-size:13px; color:var(--ink-3)}
.langrow select{background:var(--elevated); color:var(--ink); border:1px solid var(--edge); border-radius:6px; padding:6px 10px; font-size:14px}
.profilerow{width:100%; display:flex; align-items:center; gap:12px; text-align:left; background:var(--surface); border:1px solid var(--edge); border-radius:10px; padding:10px 12px}
.profilerow .avatar{width:34px; height:34px; flex:0 0 34px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:var(--elevated); color:var(--accent); font-size:15px; font-weight:700}
.profilerow .profileinfo{min-width:0; flex:1}
.profilerow .profilelabel{display:block; font-size:11px; color:var(--ink-3)}
.profilerow .profilename{display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink); font-size:14px; font-weight:600}
.profilerow .profilesource{color:var(--ink-4); font-size:11px; white-space:nowrap}
/* 单栏身份行（core/identity.js + home.js 的 identity-row）：一行内只有一个名字。
   副标题刻意不用 nowrap+ellipsis——「进度存哪 / 去哪改名」是关键语义，截断了等于没说。 */
.idrow .idnameline{display:flex; align-items:baseline; gap:6px; min-width:0}
.idrow .idnameline .profilename{flex:0 1 auto}
.idrow .idsource{flex:0 0 auto; font-style:normal; font-size:10px; color:var(--ink-4); border:1px solid var(--edge); border-radius:4px; padding:0 5px; line-height:1.5}
.idrow .idsub{display:block; margin-top:2px; font-size:11px; line-height:1.35; color:var(--ink-3); overflow-wrap:break-word}
.idrow[data-state="cloud"] .idsub, .idrow[data-state="cloudTemp"] .idsub{color:var(--ok)}
.idrow[data-state="expired"] .idsub{color:var(--warn)}
.idrow .avatar{position:relative}
.idrow .idbadge{position:absolute; right:-2px; bottom:-2px; width:13px; height:13px; border-radius:50%; border:2px solid var(--surface); background:var(--ink-4); font-style:normal; font-size:8px; line-height:9px; text-align:center; color:var(--surface)}
.idrow[data-badge="ok"] .idbadge{background:var(--ok)}
.idrow[data-badge="warn"] .idbadge{background:var(--warn)}
.idrow[data-action="login"] .profilesource, .idrow[data-action="rename"] .profilesource{color:var(--accent)}
.idrow[data-action="relogin"] .profilesource{color:var(--warn)}
/* ---------- 排行榜 ---------- */
.lb{width:100%; display:flex; flex-direction:column; gap:10px; padding-top:8px}
.lb h2{margin:0; font-size:18px; display:flex; justify-content:space-between; align-items:center}
.lb h2 button{color:var(--accent); font-size:13px; font-weight:600}
.lbrow{
  display:flex; align-items:center; gap:12px; background:var(--surface);
  border:1px solid var(--edge); border-radius:8px; padding:9px 14px; font-size:14px;
}
.lbrow.me{border-color:var(--accent); background:var(--cell-same)}
.lbrow .rank{width:26px; color:var(--ink-3); font-weight:700}
.lbrow .rank.top{color:var(--podium)}
.lbrow .name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.lbrow .lv{color:var(--accent); font-weight:700}
.lbnote{font-size:11px; color:var(--ink-4); text-align:center}
/* issue #24:本国/全球 Tab */
.lbtabs{display:flex; gap:8px}
.lbtab{
  flex:1; padding:7px 0; font-size:13px; font-weight:600; border-radius:8px;
  border:1px solid var(--edge); background:var(--surface); color:var(--ink-3);
}
.lbtab.on{border-color:var(--accent); color:var(--accent); background:var(--cell-same)}
/* issue #25:分享按钮 */
.lbshare{
  padding:9px 0; font-size:14px; font-weight:600; border-radius:8px;
  border:1px solid var(--accent); color:var(--accent); background:transparent;
}
/* ---------- 游戏 ---------- */
.gamewrap{width:100%; flex:1; display:flex; flex-direction:column; gap:10px; align-items:center}
.topbar{width:100%; display:flex; align-items:center; justify-content:space-between; font-size:13px; color:var(--ink-3)}
.topbar .title{font-weight:700; font-size:15px; color:var(--ink); letter-spacing:.06em}
.topbar .title em{font-style:normal; color:var(--accent)}
.topbar .backbtn{color:var(--accent); font-weight:600; font-size:13px; padding:4px 2px}
.hud{width:100%; display:flex; justify-content:space-between; align-items:baseline; font-size:12px; color:var(--ink-3)}
.hud b{color:var(--ink-2); font-weight:600; font-size:13px}

// 运行时错误必须留痕:JS 一抛错整页就是白板/空试管,不能只能靠猜。
// 平时静默收集,带 #jserr / #sfxlog 时直接显示在页面底部(headless dump-dom 也能取到)。
window.__jsErrors = [];
window.addEventListener('error', function (e) {
  window.__jsErrors.push(String(e.message) + ' @' + String(e.filename || '').split('/').pop() + ':' + e.lineno);
  if (!/[#&](jserr|sfxlog)/.test(location.hash)) return;
  var el = document.getElementById('jserr');
  if (!el) {
    el = document.createElement('pre');
    el.id = 'jserr';
    el.style.cssText = 'position:fixed;left:0;right:0;bottom:0;margin:0;background:#3a1112;color:#ffb4b4;' +
      'font-size:10px;z-index:99;white-space:pre-wrap;padding:4px';
    document.body.appendChild(el);
  }
  el.textContent = window.__jsErrors.join('\n');
});

/* ====================== 数独引擎(与 engine.js 同源,内联;倒水版已不再调用,保留以免动到旧测试) ====================== */
var SudokuEngine=(function(){
  'use strict';
  const DIFFICULTY={
    beginner:{givens:[40,47],label:'新手'},
    easy:{givens:[34,39],label:'简单'},
    medium:{givens:[28,33],label:'中等'},
    hard:{givens:[23,27],label:'困难'},
  };
  function rng(seed){let a=seed>>>0;return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
  function shuffled(arr,rand){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  function conflicts(g,idx,v){const r=Math.floor(idx/9),c=idx%9,br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;
    for(let i=0;i<9;i++){
      if(g[r*9+i]===v&&r*9+i!==idx)return true;
      if(g[i*9+c]===v&&i*9+c!==idx)return true;
      const bi=(br+Math.floor(i/3))*9+bc+(i%3);
      if(g[bi]===v&&bi!==idx)return true;
    }return false;}
  function search(g,digits,count,limit){
    let best=-1,bestCands=null;
    for(let i=0;i<81;i++){
      if(g[i]!==0)continue;
      const cands=[];
      for(const v of digits)if(!conflicts(g,i,v))cands.push(v);
      if(best===-1||cands.length<bestCands.length){best=i;bestCands=cands;}
      if(bestCands.length===0)return count.n;
      if(bestCands.length===1)break;
    }
    if(best===-1){count.n++;if(!count.first)count.first=g.slice();return count.n;}
    for(const v of bestCands){g[best]=v;search(g,digits,count,limit);g[best]=0;if(count.n>=limit)return count.n;}
    return count.n;}
  const D19=[1,2,3,4,5,6,7,8,9];
  function validGivens(grid){for(let i=0;i<81;i++)if(grid[i]!==0&&conflicts(grid,i,grid[i]))return false;return true;}
  function solve(grid){const g=grid.slice();if(!validGivens(g))return null;const count={n:0,first:null};search(g,D19,count,1);return count.first;}
  function countSolutions(grid,limit){const g=grid.slice();if(!validGivens(g))return 0;const count={n:0,first:null};return search(g,D19,count,limit||2);}
  function generate(diff,seed){
    const spec=DIFFICULTY[diff];if(!spec)throw new Error('unknown difficulty: '+diff);
    const rand=rng(seed===undefined?(Date.now()&0x7fffffff):seed);
    const full=new Array(81).fill(0);
    const digits=shuffled(D19,rand);
    const count={n:0,first:null};
    search(full,digits,count,1);
    const solution=count.first;
    const lo=spec.givens[0],hi=spec.givens[1];
    const target=lo+Math.floor(rand()*(hi-lo+1));
    const puzzle=solution.slice();
    let givens=81;
    const order=shuffled(Array.from({length:41},(_,i)=>i),rand);
    for(const i of order){
      if(givens<=target)break;
      const j=80-i;
      const holes=i===j?[i]:[i,j];
      const saved=holes.map(h=>puzzle[h]);
      if(saved.every(v=>v===0))continue;
      if(givens-holes.length<lo)continue;
      holes.forEach(h=>{puzzle[h]=0;});
      if(countSolutions(puzzle,2)!==1){holes.forEach((h,k)=>{puzzle[h]=saved[k];});}
      else{givens-=holes.filter((_,k)=>saved[k]!==0).length;}
    }
    if(givens>hi){
      const singles=shuffled(Array.from({length:81},(_,i)=>i),rand);
      for(const i of singles){
        if(givens<=target)break;
        if(puzzle[i]===0)continue;
        const v=puzzle[i];puzzle[i]=0;
        if(countSolutions(puzzle,2)!==1)puzzle[i]=v;else givens--;
      }
    }
    return{puzzle,solution,givens,difficulty:diff};
  }
  return{solve,countSolutions,generate,DIFFICULTY};
})();

/* ====================== 兜底身份解析(与 tgid.js 同源,内联;issue #20) ====================== */
const TgId = (function () {
  'use strict';
  function parseTgWebAppData(hashOrSearch) {
    if (!hashOrSearch || typeof hashOrSearch !== 'string') return null;
    const s = hashOrSearch.replace(/^[#?]/, '');
    let raw = null;
    const parts = s.split('&');
    for (let i = 0; i < parts.length; i++) {
      if (parts[i].indexOf('tgWebAppData=') === 0) { raw = parts[i].slice(13); break; }
    }
    if (!raw) return null;
    let inner;
    try { inner = decodeURIComponent(raw); } catch (e) { return null; }
    let userStr = null;
    const kv = inner.split('&');
    for (let i = 0; i < kv.length; i++) {
      if (kv[i].indexOf('user=') === 0) { userStr = kv[i].slice(5); break; }
    }
    if (!userStr) return null;
    let u;
    try { u = JSON.parse(decodeURIComponent(userStr)); } catch (e) { return null; }
    if (!u || typeof u !== 'object' || u.id == null) return null;
    return {
      id: String(u.id),
      first_name: u.first_name || '',
      last_name: u.last_name || '',
      username: u.username || '',
      language_code: u.language_code || '',
    };
  }
  function displayName(u) {
    if (!u) return '';
    return ((u.first_name || '') + ' ' + (u.last_name || '')).trim() || u.username || '';
  }
  return { parseTgWebAppData, displayName };
})();

/* 语言选择走 core/locale.js（与彩雷同一份实现，不再各写一套 detectLang/resolveLang）：
   优先级 ?lang=(调试,不持久化) → saved(手动选择,持久化) → Telegram language_code
   → navigator.language → 默认。匹配按 RFC 4647 lookup，所以 zh-CN/zh-TW 都落到 zh。 */
const LANG_AVAILABLE = Object.keys(I18N);
const LANG_DEFAULT = 'en';
function resolveLang(search, saved, tgCode, navLang, hash) {
  return LocaleCore.resolveLang({
    search: search, saved: saved, hash: hash, tgLanguageCode: tgCode, navigatorLanguage: navLang
  }, LANG_AVAILABLE, LANG_DEFAULT);
}
const LANG_KEY = 'sudoku_lang';
/* 首屏同步读已保存语言,避免 CloudStorage 异步导致语言闪切;
   CloudStorage 权威值在 boot() 里异步对账(跨设备迁移场景)。
   两条通道:URL hash(#lang=xx,内嵌 webview 里唯一跨刷新可靠的一份) + localStorage 镜像。 */
const savedLangRead = LocaleCore.readSavedLang(window, LANG_KEY);
let savedLangMirror = savedLangRead.local;
let LANG = resolveLang(location.search, savedLangMirror,
  (tgUser() && tgUser().language_code) || null,
  navigator.language, location.hash);
function t(key, vars) {
  let s = (I18N[LANG] && I18N[LANG][key] != null) ? I18N[LANG][key] : I18N.en[key];
  if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
  return s;
}

  /* 身份行文案不在这里刷:本函数在顶层被同步调用一次(见文件下方 applyStaticI18n() 调用点),
     那时 Profile / Plat 这些 let 还在 TDZ,renderIdentity() 会抛 ReferenceError 并中断整段脚本
     (实测崩过:boot、平台连接、事件监听全不执行)。首屏由 renderHome() 渲染,切语言由 applyLang() 补刷。 */

/* issue #18:语言下拉框(选项从 I18N 字典键自动生成,原生名取各语言字典 langName;加语言只补字典) */
function populateLangSel() {
  const sel = document.getElementById('langSel');
  sel.innerHTML = '';
  for (const code in I18N) {
    const o = document.createElement('option');
    o.value = code;
    o.textContent = I18N[code].langName || code;
    if (code === LANG) o.selected = true;
    sel.appendChild(o);
  }
  document.getElementById('langLabel').textContent = t('langLabel');
  sel.setAttribute('aria-label', t('langLabel'));
}
/* 即时整页切换:重刷静态文案 + html lang + document.title + 动态页重渲染 */
function applyLang(lang) {
  LANG = I18N[lang] ? lang : 'en';
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.title = t('title');

    renderIdentity();   // pages 存在 ⇒ 已 boot 完,此处刷身份行文案是安全的
    if (!pages.home.hidden) renderHome();
    if (!pages.lb.hidden) renderLb();
  }
}

   必须先于 applyStaticI18n()——静态文案回填的目标节点（#home .logo 等）由本装配产出 ====================== */

/* 道具库存走单调账本（core/stock.js）：只存 granted/spent 两个只增计数，库存 = granted - spent。
   旧做法存「库存数」+ 按 updatedMs 取新合并，而 updatedMs 会被体力恢复/昵称/音效等无关写入刷新，
   任一端拿着默认库存做一次无关保存就把已消耗的道具复活 —— 这正是「用了道具，重新登录又变回默认」的根因。
   Profile.state.bottles / .undos 从此只是派生镜像（每次 mutate 由 legacyPatch 回填），读的地方无需改动。 */
const Stock = StockCore.create(GAME_CFG.stock);
/* 金币：通关攒、可直接买道具（不用看广告）。倒水这边显式配了自己的数值
   （通关 +2、加瓶 200 换 1、撤销 150 换 2，见 game.config.json 的 coins 段）；
   彩雷那边整段省略、走 core/coins.js 默认（通关 +1、200 换 1）——每个游戏都能自定。 */
const Coins = CoinsCore.create(GAME_CFG.coins, Stock);
function spendItem(key) {                       // 用掉一个：spent+1（只增），不足返回 false
  const patch = Stock.spend(Profile.state, key);
  if (!patch) return false;
  Profile.mutate((s) => Object.assign(s, patch));
  return true;
}
function grantItem(key, n) {                    // 发放（看广告/周活动奖励）：granted+n（只增）
  const patch = Stock.grant(Profile.state, key, n);
  if (!patch) return false;
  Profile.mutate((s) => Object.assign(s, patch));
  return true;
}

const Store = (function () {
  const mem = {};
  let ls = null;
  try { ls = window.localStorage; ls.setItem('__t', '1'); ls.removeItem('__t'); } catch (e) { ls = null; }
  const cloud = IN_TG && TG.CloudStorage && TG.isVersionAtLeast && TG.isVersionAtLeast('6.9') ? TG.CloudStorage : null;
  return {
    get(key, cb) {
      if (cloud) cloud.getItem(key, (err, v) => cb(err ? null : (v || null)));
      else cb(ls ? ls.getItem(key) : (mem[key] || null));
    },
    set(key, val) {
      if (cloud) cloud.setItem(key, val, () => {});
      if (ls) { try { ls.setItem(key, val); } catch (e) {} }
      mem[key] = val;
    },
    del(key) {
      if (cloud) cloud.removeItem(key, () => {});
      if (ls) { try { ls.removeItem(key); } catch (e) {} }
      delete mem[key];
    }
  };
})();

/* 按需加载某个 Monetag zone 的 SDK。
 为什么不写死在 head：TMA zone 与 Website zone 是两条独立通道，
 一个页面可能同时配了两个 —— 只加载当前环境真要用的那个，
 避免把 Telegram Mini App 的 zone 用在网页流量上（那是无效流量）。 */
function loadMonetagSdk(zone) {
var flag = 'show_' + zone;
if (typeof window[flag] === 'function') return Promise.resolve();
var existing = document.querySelector('script[data-zone="' + zone + '"]');
return new Promise(function (resolve, reject) {
var el = existing;
if (!el) {
el = document.createElement('script');
el.src = 'https://libtl.com/sdk.js';
el.setAttribute('data-zone', zone);
el.setAttribute('data-sdk', flag);
document.head.appendChild(el);
}
var tries = 0;
var tick = setInterval(function () {
if (typeof window[flag] === 'function') { clearInterval(tick); resolve(); return; }
if (++tries > 60) { clearInterval(tick); reject(new Error('sdk-timeout')); } // 最多等 6 秒
}, 100);
el.addEventListener('error', function () { clearInterval(tick); reject(new Error('sdk-error')); });
});
}

/* 打开外部链接，返回是否真的开成了（被拦弹窗 → false，上层判失败不发奖）。
   坑：window.open(url,'_blank','noopener') 按规范**返回 null**，会把成功误判成被拦；
   所以不能在 features 里写 noopener，改为开完手动断 opener。 */
function openExternal(url) {
  var w = null;
  try { w = window.open(url, '_blank'); } catch (e) { return false; }
  if (!w) return false;
  try { w.opener = null; } catch (e) { /* 跨源时不可写，无妨 */ }
  return true;
}

/* Multitag（被动收入）：只在浏览器、只在首页注入一次。
   为什么不放 head：① Telegram 内不该加载（会和 TMA 激励广告抢焦点）；
   ② 它含 Onclick popunder，而对局中每点一格都是一次 click，注入进对局界面会毁体验。
   注意：脚本一旦注入就无法卸载，所以对局中的频次控制要在 Monetag 后台设 capping。 */
function loadMultitag() {
  var m = (GAME_CFG.ads && GAME_CFG.ads.passive && GAME_CFG.ads.passive.multitag) || null;
  if (!m || !m.src) return false;                       // 没配 = 不启用
  if (m.env === 'web' && AdPlay.inTelegram()) return false;
  if (document.querySelector('script[data-multitag="1"]')) return false;  // 已注入
  var el = document.createElement('script');
  el.src = m.src;
  el.async = true;
  if (m.zone) el.setAttribute('data-zone', String(m.zone));
  el.setAttribute('data-cfasync', 'false');
  el.setAttribute('data-multitag', '1');
  document.head.appendChild(el);
  return true;
}

/* 兼容旧调用点：仍叫 showRewardedAd()，返回 Promise（resolve=看完，reject=未看完）。
   这样原有 .then(发奖).catch(提示) 的写法全部不用改，但语义变成了「真看完才 resolve」。 */
/* ====================== 广告期间暂停游戏（Google H5 Games Ad Placement API 的 beforeAd/afterAd 契约）
   官方 adBreak() 契约把这两件事写在函数签名的注释里：beforeAd = "Mute and pause the game flow"、
   afterAd = "Resume the game and un-mute the sound"，奖励只在 adViewed（广告真的看完）之后发。
   为什么必须在这一层做：看广告本身要花 15~30 秒（AdMob 激励广告倒计时 5~30s），若关卡倒计时
   继续走，玩家看完 60 秒奖励回来只剩 30 秒——广告的代价被算进了关卡时长。
   此前是三个调用点各自 stopTimer/startTimer（手写、易漏、新广告位默认不受保护），
   现在收进 showRewardedAd()：任何广告位自动暂停倒计时 + 静音，广告关掉再恢复。
   另加一道兜底：记下暂停瞬间的剩余秒数，恢复时若发现变少（某个源在同页 iframe 里播、
   页面没 hidden、别处又把 tick 打开了），一律补回快照——广告花掉的时间绝不算进关卡。 */
let adPauseDepth = 0, adPauseWasTicking = false, adPauseRemain = -1, adPauseSfx = null;
function adPauseGame() {
  if (adPauseDepth++ > 0) return;
  adPauseWasTicking = !!S.timerId;
  adPauseRemain = typeof S.remain === 'number' ? S.remain : -1;
  stopTimer();
  adPauseSfx = WaterAudio.isEnabled();
  WaterAudio.setEnabled(false);   // 契约要求 mute：广告有自己的声音，别和游戏音效叠在一起
}
function adResumeGame() {
  if (adPauseDepth <= 0) return;
  if (--adPauseDepth > 0) return;
  if (adPauseSfx !== null) { WaterAudio.setEnabled(adPauseSfx); adPauseSfx = null; }
  // 兜底：广告期间不该流失一秒。少了就补回去（多了不动——奖励是在这之后才发的）
  if (adPauseRemain >= 0 && typeof S.remain === 'number' && S.remain < adPauseRemain) {
    console.warn('[water ads] 广告期间倒计时被扣掉了 ' + (adPauseRemain - S.remain) +
      's，已按暂停快照补回（不该发生，说明有路径绕过了 adPauseGame）');
    S.remain = adPauseRemain;
    renderTimer();
  }
  adPauseRemain = -1;
  if (adPauseWasTicking && !S.finished) startTimer();
  adPauseWasTicking = false;
}

function showRewardedAd(placementId) {
  const id = placementId || 'weekly-frags';
  if (/[#&]demoads/.test(location.hash)) return Promise.resolve();   // 发布 gate/截图专用
  adPauseGame();
  const resume = (v) => { adResumeGame(); return v; };
  const resumeThrow = (e) => { adResumeGame(); throw e; };
  return AdPlay.playPlacement(AdPlacements, id, adState[id] || {}).then(resume, resumeThrow).then((res) => {
    adState[id] = res.state || {}; saveAdState();
    if (res.granted) return;
    const st = AdPlay.stats();
    console.warn('[water ads] ad-not-completed placement=' + id +
      ' source=' + (res.ad && res.ad.source) + ' reason=' + (res.ad && res.ad.reason) +
      ' totals ok/fail=' + st.ok + '/' + st.failed + ' bySource=' + JSON.stringify(st.bySource));
    throw new Error(res.shown === false ? 'capped' : 'not-completed');
  });
}

/* ====================== 局间插屏纯函数(与 idlead.js 同源,内联;issue #22) ====================== */
const IdleAd = (function () {
  'use strict';
  const DELAYS = [null, 5000, 10000, 20000];
  // rand ∈ [0,1);非法输入一律安全回退 null(不弹)
  function pickInterstitialDelay(rand) {
    if (typeof rand !== 'number' || !isFinite(rand) || rand < 0 || rand >= 1) return null;
    return DELAYS[Math.floor(rand * DELAYS.length)];
  }
  return { DELAYS, pickInterstitialDelay };
})();

/* 局间插屏控制器(issue #22):进入结算态随机四态(不弹/空闲5s/10s/20s后弹);
   期间任何交互(pointerdown/keydown,捕获层)立即取消并清计时器;
   弹出走现有 Monetag 展示路径,纯曝光不发奖励;同一局最多一次(含抽中"不弹"),重进页面不补弹。 */
const InterAd = {
  timer: null, onAct: null, done: false,
  arm() {
    this.cancel();
    if (this.done) return;
    this.done = true; // 每局只抽一次签
    const dbg = location.hash.match(/adtest=(\d+)/); // 调试入口:#adtest=毫秒 强制定时弹(截图/验链路用)
    const delay = dbg ? +dbg[1] : IdleAd.pickInterstitialDelay(Math.random());
    if (delay == null) return; // 本局不弹
    this.onAct = () => this.cancel();
    document.addEventListener('pointerdown', this.onAct, true);
    document.addEventListener('keydown', this.onAct, true);
    this.timer = setTimeout(() => {
      this.cancel();
      showRewardedAd().catch(() => {}); // 纯曝光:无奖励回调,广告关后结算按钮原位可用
    }, delay);
  },
  cancel() {
    if (this.timer) { clearTimeout(this.timer); this.timer = null; }
    if (this.onAct) {
      document.removeEventListener('pointerdown', this.onAct, true);
      document.removeEventListener('keydown', this.onAct, true);
      this.onAct = null;
    }
  },
  reset() { this.cancel(); this.done = false; }
};

/* ====================== 每周活动（唯一实现在 core/weekly.js） ======================
   原来这里内联了两份副本（Weekly：周界/主题/结转；WeeklyCore：领取状态机），与 core 各自维护。

const Weekly = WeeklyCore.create(GAME_CFG.weekly);

/* 周图配置加载(assets/weekly/weekly-config.json,issue #2 每周专属 webp 横幅):

/* 每周活动控制器(issue #30):状态持久化 sudoku_weekly(CloudStorage 优先 + localStorage 镜像,
   走 Store 同一通道);内存权威副本 + 快照串行 flush,与 Profile 同模式。
   奖励发放:体力走 Profile(可超 120 持久保留,issue #7),道具走 Profile.bottles。 */
const WeeklyCtl = {
  key: 'sudoku_weekly',
  state: null,
  flushChain: Promise.resolve(),
  load(cb) {
    Store.get(this.key, (v) => {
      let s = null;
      if (v) { try { s = JSON.parse(v); } catch (e) {} }
      this.state = Weekly.normalize(s, Weekly.weekKey(Date.now()));
      if (this.state !== s) this.flush();
      cb && cb();
    });
  },
  flush() {
    const snapshot = JSON.stringify(this.state);
    this.flushChain = this.flushChain.then(() => { Store.set(this.key, snapshot); });
  },
  // 周对账:跨周则重置+结转(渲染/加碎片前都先走这里)
  settle() {
    const wk = Weekly.weekKey(Date.now());
    const n = Weekly.normalize(this.state, wk);
    if (n !== this.state) { this.state = n; this.flush(); }
  },
  // 加碎片(issue #1 手动领取):解锁只进「可领取」,不自动发奖;返回 toast 文案数组
  addFrags(n) {
    this.settle();
    const st = this.state;
    const before = st.frags;
    st.frags += n;
    const msgs = [];
    for (const i of Weekly.newlyUnlocked(before, st.frags)) {
      if (st.claimed[i]) continue;
      msgs.push(t('wkUnlockToast', { pic: themePics()[i] }));
    }
    if (before < Weekly.goal && st.frags >= Weekly.goal && !st.grand) msgs.push(t('wkGrandToast'));
    this.flush();
    return msgs;
  },
  // 领取第 i 张图奖励:core 状态机把关(仅 claimable 可领),奖励入账后落盘
  claim(i, randFn) {
    this.settle();
    const rnd = randFn || Math.random;
    const res = Weekly.claim(this.state, i, () => Weekly.rollReward(rnd(), rnd()));
    this.state = res.state;
    const r = res.reward;
    if (r.type === 'energy') Profile.mutate((s) => { s.energy += r.n; });
    else grantItem('bottles', r.n);
    this.flush();
    return r;
  },
  // 领取大奖(固定内容),同样必须用户点击
  claimGrand() {
    this.settle();
    const res = Weekly.claimGrand(this.state);
    this.state = res.state;
    Profile.mutate((s) => { s.energy += res.reward.energy; });
    grantItem('bottles', res.reward.hints);
    this.flush();
    return res.reward;
  },
};
function themePics() {
  const th = Weekly.themeFor(Date.now());
  return (th[LANG] || th.en).pics;
}

/* ====================== 终身档案:内存权威副本 + 串行 flush(Spike S1 验证模式) ====================== */
const Profile = {
  key: 'sudoku_profile',
  state: null,            // { energy, lastTs, wins, bottles, alias, localId }
  flushChain: Promise.resolve(),
  load(cb) {
    Store.get(this.key, (v) => {
      let s = null;
      if (v) { try { s = JSON.parse(v); } catch (e) {} }
      this.state = Object.assign({ energy: Reward.E_MAX, lastTs: Date.now(), wins: 0, alias: '', localId: '', sfx: true }, s || {});
      // 道具账本初始化/旧档迁移（幂等）：新档发初始量，老档按剩余库存推导 granted，一个都不多发不少发
      Object.assign(this.state, Stock.migrate(this.state));
      Object.assign(this.state, Stock.legacyPatch(this.state));
      // 非 Telegram 环境:稳定化名 + 每浏览器唯一 ID,生成一次后持久保留。
      if (!this.state.alias || !this.state.localId) this.mutate((st) => {
        if (!st.alias) st.alias = t('alias') + Math.floor(1000 + Math.random() * 9000);
        if (!st.localId) st.localId = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12);
      });
      this.settle();
      cb();
    });
  },
  // 所有修改同步走内存副本,快照串行异步落盘 — 不存在读改写竞态窗口
  mutate(fn) {
    fn(this.state);
    /* 多标签页保护：写盘前先跟磁盘现值把「只增账本」取大。
       同一浏览器开两个标签页时，另一个标签页手里是过期快照，它下一次写盘会把
       已花掉的金币/道具覆盖回去（彩雷侧线上实测复现过）。granted/spent 单调只增，
       取大不会丢任何一侧的消耗，与云端 merge:"max" 同一语义。 */
    try {
      const onDisk = JSON.parse(window.localStorage.getItem(this.key) || 'null');
      if (onDisk) Object.assign(this.state, Stock.reconcile(this.state, onDisk));
    } catch (e) {}
    Object.assign(this.state, Stock.legacyPatch(this.state));  // 派生库存回填旧字段，UI/旧客户端照常读
    this.state.updatedMs = Date.now();  // 云档合并判新用（core/platform.js mergeSave）
    const snapshot = JSON.stringify(this.state);
    this.flushChain = this.flushChain.then(() => { Store.set(this.key, snapshot); });
    platformSync();
  },
  // 体力离线/在线结算
  settle() {
    const r = Reward.restore(this.state.energy, this.state.lastTs, Date.now());
    if (r.energy !== this.state.energy || r.lastTs !== this.state.lastTs) {
      this.mutate((s) => { s.energy = r.energy; s.lastTs = r.lastTs; });
    }
  },
};

/* 每日快照纯函数(与 lb.js 同源,内联;issue #11/#24/#25):UTC 日期;Top50 competition ranking;提交池随重算裁剪;
   country 字段与本国过滤(#24);分享文本组装(#25,模板走 I18N.shareTpl) */
const Lb = (function () {
  const TOP_N = 50;
  function todayUTC(now) { return new Date(now).toISOString().slice(0, 10); }
  function needsRebuild(board, today) {
    return !board || !Array.isArray(board.top) || board.date !== today;
  }
  function assignRanks(rows) {
    let rank = 0, prev = null;
    rows.forEach((p, i) => {
      if (p.level !== prev) { rank = i + 1; prev = p.level; }
      p.rank = rank;
    });
    return rows;
  }
  function normCountry(c) {
    const s = String(c || '').toUpperCase();
    return /^[A-Z]{2}$/.test(s) ? s : 'UN';
  }
  function detectCountry(tgCode, navLang) { // issue #27 起退役:不再参与决策,仅保留与 lb.js 同源
    for (const cand of [tgCode, navLang]) {
      const m = /^[A-Za-z]{2,3}[-_]([A-Za-z]{2})(?:[-_]|$)/.exec(String(cand || ''));
      if (m) return m[1].toUpperCase();
    }
    return 'UN';
  }
  function filterCountry(top, country) {
    const c = normCountry(country);
    const rows = (top || []).filter((p) => normCountry(p && p.country) === c)
      .map((p) => ({ id: p.id, name: p.name, level: p.level, country: normCountry(p.country) }));
    return assignRanks(rows);
  }
  function buildTop(players, today) {
    const rows = Object.entries(players || {})
      .map(([id, p]) => p && { id, name: String(p.name == null ? '' : p.name).slice(0, 16), level: Number(p.level), country: normCountry(p.country) })
      .filter((p) => p && p.name && Number.isFinite(p.level) && p.level > 0)
      .sort((a, b) => b.level - a.level || a.name.localeCompare(b.name))
      .slice(0, TOP_N);
    assignRanks(rows);
    return { date: today, top: rows };
  }
  function trimPlayers(players, top) {
    const keep = new Set(top.map((p) => p.id));
    const out = {};
    for (const id in players) if (keep.has(id)) out[id] = players[id];
    return out;
  }
  const SHARE_TPL = {
    zh: {
      head: '🧩 数独{scope}排行榜 · {date}',
      scopeLocal: '本国', scopeGlobal: '全球',
      row: '{medal} {name} · 第 {level} 关',
      mineRanked: '我的名次:第 {rank} 名(第 {level} 关)',
      mineUnranked: '我的成绩:第 {level} 关(尚未上榜)',
      empty: '榜单虚位以待,快来抢头名!',
      call: '来挑战我 👉 {url}',
    },
    en: {
      head: '🧩 Sudoku {scope} leaderboard · {date}',
      scopeLocal: 'national', scopeGlobal: 'global',
      row: '{medal} {name} · Lv {level}',
      mineRanked: 'My rank: #{rank} (Lv {level})',
      mineUnranked: 'My score: Lv {level} (not on board yet)',
      empty: 'The board is wide open — claim the top spot!',
      call: 'Beat me 👉 {url}',
    },
  };
  function fmtTpl(s, vars) { return s.replace(/\{(\w+)\}/g, (_, k) => (vars[k] != null ? vars[k] : '')); }
  function buildShareText(rows, my, lang, opts) {
    // opts.tpl 可传入 I18N 字典里的模板(sudoku.html 内联走字典;node 直测用内置同源模板)
    const T = (opts && opts.tpl) || SHARE_TPL[lang] || SHARE_TPL.en;
    const o = opts || {};
    const medals = ['🥇', '🥈', '🥉'];
    const lines = [fmtTpl(T.head, { scope: o.scope === 'global' ? T.scopeGlobal : T.scopeLocal, date: o.date || '' })];
    const top3 = (rows || []).slice(0, 3);
    if (top3.length === 0) lines.push(T.empty);
    else top3.forEach((p, i) => lines.push(fmtTpl(T.row, { medal: medals[i], name: p.name, level: p.level })));
    if (my && my.level > 0) {
      lines.push(my.rank ? fmtTpl(T.mineRanked, { rank: my.rank, level: my.level }) : fmtTpl(T.mineUnranked, { level: my.level }));
    }

})();
/* 国家判定决策链纯函数(与 geo.js 同源,内联;issue #27):
   首次启动 IP 归属地判定,判不出记 'other';一经确认永久锁定,后续零 IP 请求。
   旧 language 推断(Lb.detectCountry,#24)退役,不再参与决策。 */
const Geo = (function () {
  const OTHER = 'other';
  const TIMEOUT_MS = 4000;
  const PROVIDERS = [
    { name: 'country.is', url: 'https://api.country.is/' },
    { name: 'ipwho.is', url: 'https://ipwho.is/' },
  ];
  function normCountry(c) {
    const s = String(c == null ? '' : c).trim().toUpperCase();
    return /^[A-Z]{2}$/.test(s) ? s : null;
  }
  function normSaved(v) {
    if (v == null) return null;
    const s = String(v).trim();
    if (s.toLowerCase() === OTHER) return OTHER;
    const c = normCountry(s);
    if (c === 'UN') return OTHER; // 旧 'UN' 桶合并为 other
    return c;
  }
  function parseCountryResponse(provider, json) {
    if (!json || typeof json !== 'object') return null;
    if (provider === 'country.is') return normCountry(json.country);
    if (provider === 'ipwho.is') {
      if (json.success === false) return null;
      return normCountry(json.country_code);
    }
    return null;
  }
  function resolveCountry(saved, fetchers) {
    const s = normSaved(saved);
    if (s) return Promise.resolve({ country: s, source: 'saved', requests: 0 });
    const list = (fetchers || []).slice();
    let requests = 0;
    function next(i) {
      if (i >= list.length) return Promise.resolve({ country: OTHER, source: 'fallback', requests });
      requests += 1;
      return Promise.resolve().then(() => list[i]()).then(
        (c) => {
          const n = normCountry(c);
          return n ? { country: n, source: 'ip', requests } : next(i + 1);
        },
        () => next(i + 1)
      );
    }
    return next(0);
  }
  return { OTHER, TIMEOUT_MS, PROVIDERS, normCountry, normSaved, parseCountryResponse, resolveCountry };
})();

/* issue #27:当前用户国家 = 已存值(永久锁定)|| 'other'(未确认期间按 other/全球 Tab 处理)。
   首屏同步读 localStorage 镜像(与 sudoku_lang 同模式),CloudStorage 权威值与首个 IP 判定在 boot() 里异步走。 */
const COUNTRY_KEY = 'sudoku_country';
let MY_COUNTRY = null;
try { MY_COUNTRY = Geo.normSaved(window.localStorage.getItem(COUNTRY_KEY)); } catch (e) {}
function myCountry() { return MY_COUNTRY || Geo.OTHER; }
// 单个提供方请求:HTTPS+CORS、4s 超时(AbortController)、静默失败(返回 null 走降级)
function geoFetchProvider(p) {
  return function () {
    const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = ctrl ? setTimeout(() => ctrl.abort(), Geo.TIMEOUT_MS) : null;
    return fetch(p.url, { signal: ctrl && ctrl.signal, headers: { Accept: 'application/json' } })
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then((j) => Geo.parseCountryResponse(p.name, j))
      .finally(() => { if (timer) clearTimeout(timer); });
  };
}
// 首次确认国家(boot 异步调用,绝不阻塞开局/渲染):已存值短路零请求;否则 IP 决策链,
// 结果(含 other)立即持久化并永久锁定,此后换网/换语言不再变。
function confirmCountryOnce(saved) {
  return Geo.resolveCountry(saved != null ? saved : MY_COUNTRY, Geo.PROVIDERS.map(geoFetchProvider))
    .then((r) => {
      MY_COUNTRY = r.country;
      if (r.source !== 'saved') Store.set(COUNTRY_KEY, r.country); // 首次确认落盘
      else { try { window.localStorage.setItem(COUNTRY_KEY, r.country); } catch (e) {} } // 云端已有:回写镜像(含 UN→other 迁移)
      return r.country;
    });
}
function lbFetch() {
  return fetch(LB_URL, { headers: { Accept: 'application/json' } })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((d) => (d && typeof d === 'object' && d.players) ? d : { players: {} });
}
function lbSubmit(level) {
  return lbFetch().then((d) => {
    const me = d.players[myId()];
    if (me && me.level >= level) return;
    // issue #24:提交带 country;读-改-写只覆盖自己一条,他人记录的 country 原样保留
    d.players[myId()] = { name: myName(), level, country: myCountry() };
    return fetch(LB_URL, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(d),
    });
  }).catch(() => {}); // 静默:榜不可用不阻塞游戏
}

   A 首页大连胜:只增不封顶;断链不立刻清零,挂 pend,下次点「开始」时弹「看广告保持」
   (拒绝/关窗即清零,连胜 <keepMinPrompt 静默清零不打扰——用户拍板)。

const WinStreak = WinStreakCore.create(GAME_CFG.winstreak || null);
function wsGet() {

function wsSet(st) {
  Profile.mutate((s) => { s.wsCur = st.cur; s.wsPend = st.pend ? 1 : 0; s.wsCyc = st.cyc; s.wsEarned = st.earned; s.wsClaimed = st.claimed; });

function wsRewardText(rw) {
  const parts = [];

  if (rw.coins) parts.push('🪙+' + rw.coins);

}
function wsOnWin() {

  if (r.ticket) setTimeout(() => toast(t('wsTicketToast', { n: WinStreak.every })), 1400);

function wsOnLose() {

function wsClaimTicket(btn) {

  showRewardedAd('streak-claim').then(() => {
    const r = WinStreak.claim(wsGet());

    if (rw.energy) Profile.mutate((s) => { s.energy += rw.energy; if (s.energy >= Reward.E_MAX) s.lastTs = Date.now(); });
    if (rw.coins) grantItem('coins', rw.coins);
    const wkMsgs = (rw.frags && Weekly.enabled) ? WeeklyCtl.addFrags(rw.frags) : [];
    haptic('success');
    toast(t('wsClaimGot', { r: wsRewardText(rw) }));
    wkMsgs.forEach((m, i) => setTimeout(() => toast(m), 1400 * (i + 1)));
    if (btn && btn.isConnected) btn.hidden = true;

    console.warn('[water] streak-claim ad failed', err && (err.name || err.message || err));

  }).then(() => { if (btn && btn.isConnected) btn.disabled = false; });

let LB_TAB = null; // 'local' | 'global'
let LB_VIEW = { rows: [], date: '', offline: false }; // issue #25:分享取当前 Tab 渲染快照
function lbCurrentTab() {

function renderLb() {
  const list = document.getElementById('lbList');

  const tab = lbCurrentTab();
  document.getElementById('lbTabLocal').className = 'lbtab' + (tab === 'local' ? ' on' : '');

  list.innerHTML = '<div class="lbnote">' + t('lbLoading') + '</div>';
  note.textContent = '';

  const row = (p, me, mineTag) => {
    const d = document.createElement('div');
    d.className = 'lbrow' + (me ? ' me' : '');
    d.innerHTML = '<span class="rank mono' + (p.rank && p.rank <= 3 ? ' top' : '') + '">' + (p.rank || '–') + '</span>' +

    d.querySelector('.name').textContent = p.name + (me ? (mineTag || t('lbMe')) : '');

  };
  const finish = (board, offline) => {
    // issue #24:本国 Tab 按 country 过滤当日快照并国内重排名次;全球 Tab 用全量快照
    const rows = tab === 'local' ? Lb.filterCountry(board.top, myCountry()) : board.top;
    list.innerHTML = '';

    if (rows.length === 0) list.innerHTML = '<div class="lbnote">' + t('lbEmpty') + '</div>';
    // 自己不在当前榜内:底部附一行自己的成绩(无名次,次日进榜)
    if (my.level > 0 && !rows.some((p) => p.id === my.id)) {
      list.appendChild(row({ rank: 0, name: my.name, level: my.level }, true, ' · ' + t('lbMine')));
    }

    LB_VIEW = { rows, date: board.date, offline, myRank: mine ? mine.rank : 0, myLevel: my.level };
  };
  lbFetch().then((d) => {
    const today = Lb.todayUTC(Date.now());
    if (Lb.needsRebuild(d.board, today)) {

      d.board = Lb.buildTop(d.players, today);

      fetch(LB_URL, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(d),
      }).catch(() => {});
    }
    finish(d.board, false);
  }).catch(() => finish(Lb.buildTop(
    FAKE_BOARD.reduce((m, p) => (m[p.id] = p, m), {}), Lb.todayUTC(Date.now())), true));
}

// Blender 渲出来的分层遮罩（单文件预览版会把这几行替换成内联 data URI）
var MASK_URLS = [
  './assets/bottles/mask-l1.png',
  './assets/bottles/mask-l2.png',
  './assets/bottles/mask-l3.png',
  './assets/bottles/mask-l4.png',
];
const tubesEl = document.getElementById('tubes');

// 点击委托:点一根管选中 → 再点另一根倒水(与数独的 selectCell/inputDigit 同位)
tubesEl.addEventListener('click', (ev) => {
  const unlock = ev.target.closest && ev.target.closest('[data-unlock-bottle]');
  if (unlock) {
    unlockBottleWithAd(Number(unlock.getAttribute('data-unlock-bottle')));
    return;
  }
  const el = ev.target.closest && ev.target.closest('[data-tube]');
  if (el) tapTube(Number(el.getAttribute('data-tube')));
});
function tubeEl(i) { return tubesEl.querySelector('[data-tube="' + i + '"]'); }
function lockedBottleIndexes() {
  return WaterPowerups.lockedBottleIndexes(
    S.tubes,
    S.lockedBottleSlots,
    S.unlockedBottles,
  );
}
function isBottleLocked(i) { return lockedBottleIndexes().includes(i); }

function tubeHtml(i) {
  const tube = S.tubes[i], cap = S.capacity;
  const full = tube.length > 0 && WaterEngine.isDone(tube, cap);
  const bottleLocked = isBottleLocked(i);
  const cls = 'tube' + (i === S.sel ? ' sel' : '') + (full ? ' done' : '') +
    (tube.length === 0 ? ' empty' : '') + (bottleLocked ? ' locked' : '');
  let layers = '';
  for (let k = 0; k < tube.length; k++) {
    // 第 k+1 层用 Blender 渲的同名遮罩定位形状,颜色由关卡调色板给
    const m = MASK_URLS[Math.min(k, MASK_URLS.length - 1)];
    layers += '<div class="layer" style="background:' + WaterLevels.PALETTE[tube[k]] +
      ';-webkit-mask-image:url(' + m + ');mask-image:url(' + m + ')" data-color="' + tube[k] + '"></div>';
  }
  layers += '<div class="glass"></div><div class="mouth"><div class="neck"></div><div class="rim"></div></div>';   // 真实瓶口:玻璃口沿+内孔
  if (bottleLocked) {
    const busy = S.unlockingBottle === i;
    layers += '<button class="bottle-unlock' + (busy ? ' busy' : '') +
      '" type="button" data-unlock-bottle="' + i + '" aria-label="' +
      t('bottleUnlockAria', { n: i + 1 }) + '"><span class="play">' +
      (busy ? '…' : '▶') + '</span><small>' +
      (busy ? t('bottleUnlocking') : t('bottleUnlockAd')) + '</small></button>';
  }
  const kinds = tube.filter((c, k) => tube.indexOf(c) === k).length;
  const tag = bottleLocked ? t('bottleTagLocked') : (tube.length === 0 ? t('bottleTagEmpty') :
    (full ? t('bottleTagDone') : t('bottleTagColors', { n: kinds })));
  return '<div class="slot' + (full ? ' done' : '') + '">' +
    '<div class="' + cls + '" data-tube="' + i + '">' + layers + '</div>' +
    '<span class="tag">' + tag + '</span></div>';
}

function render() {
  if (!S.tubes) return;
  // 试管排布:≤5 根一行放下,再多就两行(每行最多 ceil(n/2) 根)
  // 5 瓶固定采用 3+2 紧凑阵列；解锁只切状态，不新增或重排瓶位。
  const perRow = S.tubes.length === 5 ? 3
    : (S.tubes.length < 5 ? S.tubes.length : Math.ceil(S.tubes.length / 2));
  let html = '', idx = 0;
  while (idx < S.tubes.length) {
    html += '<div class="row">';
    for (let k = 0; k < perRow && idx < S.tubes.length; k++, idx++) html += tubeHtml(idx);
    html += '</div>';
  }
  if (S.par) html += '<div class="parhint">' + t('par', { n: S.par }) + '</div>';
  if (/[#&]sfxlog/.test(location.hash)) {
    html += '<pre id="sfxlog" style="font-size:9px;color:#888;white-space:pre-wrap">' +
      JSON.stringify(WaterAudio.stats()) + '</pre>';
  }
  tubesEl.innerHTML = html;
  document.getElementById('hudLv').textContent = S.level;
  document.getElementById('hudMoves').textContent = S.moves;
  renderUndoBtn();
  renderTimer();
  renderBottleBtn();
}

/* ====================== 交互 ====================== */
function shakeTube(i) {
  const el = tubeEl(i);
  if (!el) return;
  el.classList.add('shake');
  setTimeout(() => el.classList.remove('shake'), 340);
}

// 交互规则:点非空管选中 → 点目标管倒水;非法只抖动不计步;倒完判胜;无路可走给出口
function tapTube(i) {
  if (S.finished || S.locked) return;
  if (isBottleLocked(i)) { haptic('error'); shakeTube(i); toast(t('bottleLocked')); return; }
  if (S.sel === -1) {
    if (!S.tubes[i].length) { shakeTube(i); return; }   // 空管不能当源
    S.sel = i; haptic('light'); WaterAudio.play('pick'); render(); return;
  }
  if (S.sel === i) { S.sel = -1; render(); return; }    // 再点一次取消选中

  const res = WaterEngine.pour(S.tubes, S.sel, i, S.capacity); // 整段倒入: 源顶连续同色段一次全部倒入
  if (!res) { const _s = S.tubes[S.sel], _d = S.tubes[i]; if (_d.length > 0 && _d.length < S.capacity && WaterEngine.top(_d) === WaterEngine.top(_s) && S.capacity - _d.length < WaterEngine.topRun(_s)) toast(t('noRoom')); haptic('error'); WaterAudio.play('illegal'); shakeTube(i); return; }

  const from = S.sel;
  S.undo.push(JSON.stringify(S.tubes));
  S.locked = true; haptic('light');
  // 先播倒水动画(期间不重绘,否则动画节点会被 innerHTML 冲掉),播完再落盘新局面
  animatePour(from, i, res.color, res.amount, () => {
    S.tubes = res.state; S.moves++; S.sel = -1; S.locked = false;
    render();
    // 这一管刚好归位 → 给个上行三音（正反馈落在“完成”而不是每次倒水）
    if (WaterEngine.isDone(S.tubes[i], S.capacity) && S.tubes[i].length) WaterAudio.play('tubeDone');
    if (WaterEngine.isSolved(S.tubes, S.capacity)) return win();
    const playable = WaterEngine.legalMoves(S.tubes, S.capacity)
      .filter((mv) => !isBottleLocked(mv[0]) && !isBottleLocked(mv[1]));
    if (!playable.length) stuck();
  });
}

// 倾倒动画(#3):源管飞到目标管口上方侧倾、水柱垂直落进目标管、落点水花、源管回位
function animatePour(from, to, color, amount, done) {
  const src = tubeEl(from), dst = tubeEl(to);
  if (!src || !dst) { done(); return; }
  // 坐标统一用「相对 .tubes 的视觉坐标」:getBoundingClientRect 差值再除以缩放系数。
  // 不能用 offsetLeft/Top:#gamePage 的 .row 有 position:relative,offsetParent 是行而不是 .tubes,
  // 跨行倒水时 dx/dy 按「行内坐标」算,源管直接飞出棋盘(实测踩过);rect 差值还顺带吃掉行的 translateY。
  // 除以 zoom:?zoom=2 截图场景 rect 是缩放后视口坐标,而 transform 的 px 在缩放前坐标系。
  const tubesRect = tubesEl.getBoundingClientRect();
  const zoom = tubesEl.offsetWidth ? (tubesRect.width / tubesEl.offsetWidth) : 1;
  const sr = src.getBoundingClientRect(), dr = dst.getBoundingClientRect();
  const ax = (sr.left - tubesRect.left) / zoom, ay = (sr.top - tubesRect.top) / zoom;
  const aw = sr.width / zoom, ah = sr.height / zoom;
  const bx = (dr.left - tubesRect.left) / zoom, by = (dr.top - tubesRect.top) / zoom;
  const bw = dr.width / zoom;
  const dir = (bx + bw / 2) >= (ax + aw / 2) ? 1 : -1;
  // 倾角要超过 90° 管口才真的朝下倒(58°只是把管子斜过来,口还朝上,水等于凭空往上冒)。
  const deg = 105 * dir;
  const th = deg * Math.PI / 180;
  const arm = ah * 0.88;   // 管口到 transform-origin(50% 88%) 的距离
  // 位移按旋转矩阵反解 dx/dy:让「转完之后的管口」正好悬在目标管口上方。
  const dx = (bx + bw / 2) - (ax + aw / 2) - arm * Math.sin(th);
  const dy = (by - 18) - ay - arm + arm * Math.cos(th);
  src.classList.add('pouring');
  src.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(' + deg + 'deg)';
  WaterAudio.play('pour', { amount: amount || 1 });
  // 管口转完后的坐标(旋转矩阵):水柱从管口出发,垂直落到目标管当前液面。
  const mouthY = ay + arm + dy - arm * Math.cos(th);
  const filled = S.tubes[to].length / S.capacity;
  const surfaceY = by + ah * (0.20 + (1 - filled) * 0.72);   // Q版矮瓶:液面区间约 37%~98%,保留少量上浮偏置
  const streamTop = Math.min(mouthY + 2, surfaceY - 14);
  const streamX = bx + bw / 2;
  const stream = document.createElement('div');
  stream.className = 'stream';
  stream.style.cssText = 'left:' + (streamX - 11) + 'px;top:' + streamTop + 'px;height:' + Math.max(16, surfaceY - streamTop) + 'px;background:' + color;
  const splash = document.createElement('div');
  splash.className = 'splash';
  splash.style.cssText = 'left:' + (bx + bw / 2 - 15) + 'px;top:' + (surfaceY - 12) + 'px;background:' + color;
  tubesEl.appendChild(stream); tubesEl.appendChild(splash);
  setTimeout(() => { splash.style.animation = 'none'; splash.style.opacity = '.95'; }, 260);
  // 调试入口:#pourhold 把画面停在「正在倒」那一刻(headless 截图抓不到 CSS 动画帧,用它取证)
  if (/[#&]pourhold/.test(location.hash)) { return; }
  // 一次一格玩法下倒水更频繁,节奏比整段倒时更紧凑
  setTimeout(() => {
    stream.remove(); splash.remove();
    src.classList.remove('pouring'); src.style.transform = '';
    setTimeout(done, 100);
  }, 420);
}

document.getElementById('btnUndo').addEventListener('click', () => {
  if (S.finished || S.locked) return;
  const stock = Profile.state ? (Number(Profile.state.undos) || 0) : 0;
  if (stock <= 0) { offerUndoRefill(); return; }   // 道具用完 → 金币够就直接买，否则看广告
  if (!S.undo.length) return;
  if (!spendItem('undos')) { offerUndoRefill(); return; }
  S.tubes = JSON.parse(S.undo.pop());
  S.moves = Math.max(0, S.moves - 1); S.sel = -1;
  haptic('light'); WaterAudio.play('undo'); render();
});
// 撤销道具用完 → 与解锁空瓶同一条广告通道补充库存(永久保留)
let refillingUndo = false;
/* 用金币买道具：金币与道具同记在只增账本里，买过就是买过、花掉就是花掉，换设备重登不会回退。 */
function buyWithCoins(key) {
  const patch = Coins.buy(Profile.state, key);
  if (!patch) { toast(t('notEnoughCoins')); return false; }
  Profile.mutate((s) => Object.assign(s, patch));
  haptic('success');
  toast(t('boughtCoins').replace('{n}', Coins.priceOf(key)));
  const cell = document.getElementById('stCoins');      // 首页金币格即时刷新，别等下次回首页
  if (cell) cell.textContent = Coins.balance(Profile.state);
  return true;
}

/* 撤销用完：金币够就先给「花金币」这条路（不用看广告），不够才回到原来的看广告流程。 */
function offerUndoRefill() {
  const sku = Coins.sku('undos'), bal = Coins.balance(Profile.state);
  if (!sku || bal < sku.price) { adRefillUndo(); return; }
  dialog(`<h2>${t('undoEmptyTitle')}</h2>
    <p>${t('undoEmptyBody').replace('{n}', UNDO_AD_GRANT)}</p>
    <p style="font-size:12px;color:var(--ink-3)">${t('coinsItem')}: ${bal} / ${sku.price}</p>
    <button class="btn primary" id="dlgBuyUndo">${t('buyCoins').replace('{n}', sku.price)}</button>
    <button class="btn ad" id="dlgAdUndo">${t('adUndo').replace('{n}', UNDO_AD_GRANT)}</button>
    <button class="btn ghost" id="dlgClose">${t('notNow')}</button>`);
  overlay.querySelector('#dlgBuyUndo').addEventListener('click', () => {
    if (buyWithCoins('undos')) { closeDialog(); render(); }
  });
  overlay.querySelector('#dlgAdUndo').addEventListener('click', () => { closeDialog(); adRefillUndo(); });
  overlay.querySelector('#dlgClose').addEventListener('click', closeDialog);
}

function adRefillUndo() {
  if (refillingUndo) return;
  refillingUndo = true;
  // 倒计时的暂停/恢复统一由 showRewardedAd() 负责（Ad Placement API 的 beforeAd/afterAd 契约）
  showRewardedAd().then(() => {
    grantItem('undos', UNDO_AD_GRANT);
    toast(t('gotUndo').replace('{n}', UNDO_AD_GRANT));
    WaterAudio.play('tubeDone');
  }).catch(() => { toast(t('adFail')); }).then(() => {
    refillingUndo = false;
    render();
  });
}

document.getElementById('btnRestart').addEventListener('click', () => {
  if (S.finished || S.locked) return;
  S.tubes = S.start.map((t) => t.slice());
  S.moves = 0; S.undo = []; S.sel = -1;
  haptic('light'); WaterAudio.play('undo'); render();
});

function applyBottleUnlock(result, toastKey) {
  if (!result) return false;
  S.tubes = result.state;
  S.unlockedBottles = result.unlocked;
  S.sel = -1;
  // 道具解锁（mode:'item'）才扣库存：spent+1（只增）；看广告解锁不扣
  if (result.stock < Stock.stock(Profile.state, 'bottles')) spendItem('bottles');
  haptic('success');
  WaterAudio.play('tubeDone');
  toast(t(toastKey));
  render();
  return true;
}

function unlockBottleWithAd(i) {
  if (S.finished || S.locked || S.unlockingBottle >= 0 || !isBottleLocked(i)) return;
  // 倒计时的暂停/恢复统一由 showRewardedAd() 负责（Ad Placement API 的 beforeAd/afterAd 契约）
  S.sel = -1;
  S.unlockingBottle = i;
  render();
  showRewardedAd().then(() => {
    applyBottleUnlock(WaterPowerups.unlockBottle(S.tubes, {
      stock: Profile.state.bottles,
      lockedBottleIndexes: S.lockedBottleSlots,
      unlocked: S.unlockedBottles,
      mode: 'ad',
      target: i,
    }), 'bottleUnlockedAd');
  }, () => toast(t('adFail'))).then(() => {
    S.unlockingBottle = -1;
    render();
  });
}

// 键盘快捷:1-9 选瓶/倒水(桌面调试友好),U 撤销,R 重开,B 加瓶
document.addEventListener('keydown', (e) => {

/* ====================== 对话框 ====================== */
const overlay = document.getElementById('overlay');
/* 硬规则：任何弹窗都必须留有退出路径——右上角 ✕、点窗口外的遮罩、Esc 三条路都通。
   误点开一个窗口却出不来，是绝对不允许的状态。
   onDismiss 可选：给「关掉后要恢复现场」的弹窗用（例如死局弹窗要把计时接着走）。 */
let dlgDismiss = null;
/* 防误触静默期(2026-08-21 手机实报):弹窗生成的那一刻,玩家的手指可能正落在刚出现的按钮上
   (倒水是「点源 + 点目标」的成对点击,通关那一下与弹窗弹出重合),于是一通关就被误点。
   guardMs 内弹窗不接受任何点击/Esc:按钮 pointer-events 关掉,遮罩点击与 Esc 也一律忽略。 */
let dlgGuardUntil = 0;
function dlgGuarded() { return Date.now() < dlgGuardUntil; }
function dialog(html, onDismiss, guardMs) {
  dlgDismiss = onDismiss || null;
  overlay.innerHTML = '<div class="dialog">'
    + '<button class="dlgx" id="dlgX" type="button" aria-label="' + t('close') + '" title="' + t('close') + '">✕</button>'
    + html + '</div>';
  overlay.hidden = false;
  overlay.querySelector('#dlgX').addEventListener('click', dismissDialog);
  const g = Math.max(0, guardMs || 0);
  dlgGuardUntil = g ? Date.now() + g : 0;
  overlay.classList.toggle('guard', g > 0);
  if (g) setTimeout(() => overlay.classList.remove('guard'), g);
}
function closeDialog() { dlgDismiss = null; dlgGuardUntil = 0; overlay.classList.remove('guard'); overlay.hidden = true; overlay.innerHTML = ''; }
function dismissDialog() { if (dlgGuarded()) return; const after = dlgDismiss; closeDialog(); if (after) after(); }
overlay.addEventListener('click', (e) => { if (e.target === overlay) dismissDialog(); });  // 点窗口内不关
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !overlay.hidden) dismissDialog(); });

// 挂点:倒计时归零 → 看广告 +60s
function timeUp() {
  haptic('error');
  dialog(`<h2>${t('timeUpTitle')}</h2>
    <p>${t('timeUpBody', { n: AD_TIME_BONUS })}</p>
    <button class="btn ad" id="dlgAdTime">${t('adTime', { n: AD_TIME_BONUS })}</button>
    <button class="btn ghost" id="dlgGiveup">${t('giveUp')}</button>`,
    () => { S.finished = true; wsOnLose(); show('home'); });   // 关掉 = 回首页（时间已到，留在原地无事可做）；双连胜记一次失败
  overlay.querySelector('#dlgAdTime').addEventListener('click', () => {
    showRewardedAd().then(() => {
      grantTimeBonus(AD_TIME_BONUS);
      closeDialog(); haptic('success'); toast(t('gotTime', { n: AD_TIME_BONUS })); renderTimer(); startTimer();
    }).catch(() => toast(t('adFail')));
  });
  overlay.querySelector('#dlgGiveup').addEventListener('click', () => {
    S.finished = true; wsOnLose(); closeDialog(); show('home');
  });
}

// 倒水没有「填错」这回事,唯一的负向出口是「一步合法移动都没有了」。
// 这时不判死:给撤销一步 / 重开本关两个出口(撤销是免费的,不逼玩家看广告)。
//
// 关键:死局判定(tapTube 里的 playable)把「还没解锁的空瓶」当作不可用,
// 所以只要本关还锁着空瓶,这就是**伪死局**——解锁一个空瓶就能继续玩。
// 早先这里写死三个按钮(撤销/重开/首页),玩家明明能开瓶却被逼撤销或重开,白丢一局。
// 现在按局面动态给出口:还有锁着的空瓶 → 补「解锁空瓶」(有道具直接用道具,
// 没道具才看广告);没有锁着的空瓶才是真死局,维持原来三个出口。
function stuck() {
  stopTimer(); haptic('error');
  const lockedLeft = lockedBottleIndexes().length;
  const stock = Profile.state ? (Number(Profile.state.bottles) || 0) : 0;
  const bottleBtn = !lockedLeft ? ''
    : (stock > 0
      ? `<button class="btn" id="dlgStuckBottle">${t('stuckBottleItem', { n: stock })}</button>`
      : `<button class="btn ad" id="dlgStuckBottle">${t('stuckBottleAd')}</button>`);
  dialog(`<h2>${t('stuckTitle')}</h2>
    <p>${lockedLeft ? t('stuckBodyBottle') : t('stuckBody')}</p>
    ${bottleBtn}
    <button class="btn${lockedLeft ? ' ghost' : ''}" id="dlgUndo">${t('stuckUndo')}</button>
    <button class="btn ghost" id="dlgRestart">${t('stuckRestart')}</button>
    <button class="btn ghost" id="dlgGiveup">${t('toHome')}</button>`,
    startTimer);                                   // 关掉 = 继续这局，计时接着走
  const bottleEl = overlay.querySelector('#dlgStuckBottle');
  if (bottleEl) bottleEl.addEventListener('click', () => unlockBottleFromStuck(bottleEl, stock));
  overlay.querySelector('#dlgUndo').addEventListener('click', () => {
    closeDialog(); startTimer();
    document.getElementById('btnUndo').click();
  });
  overlay.querySelector('#dlgRestart').addEventListener('click', () => {
    closeDialog(); startTimer();
    document.getElementById('btnRestart').click();
  });
  overlay.querySelector('#dlgGiveup').addEventListener('click', () => {
    S.finished = true; wsOnLose(); closeDialog(); show('home');
  });
  InterAd.arm(); // issue #22:结算态空闲插屏
}

// 死局弹窗里的「解锁空瓶」出口:有道具走道具(免费),没道具才看广告。
// 解锁成功后不盲目认为局面已活:引擎禁止「整瓶单色 → 空瓶」这类无意义平移,
// 极端残局解锁后仍可能无路可走,所以这里重新判一次,还是死就再弹一次弹窗
// (那时锁着的空瓶已减少,出口随之变化),而不是把玩家丢回一个点不动的棋盘。
function unlockBottleFromStuck(btn, stock) {
  if (S.finished || S.unlockingBottle >= 0) return;
  const target = lockedBottleIndexes()[0];
  if (target == null) { toast(t('bottleUsed')); return; }
  const finish = (ok) => {
    if (!ok) return;
    closeDialog();
    InterAd.cancel();          // 玩家选择继续本局,别让结算态插屏打断棋盘
    const playable = WaterEngine.legalMoves(S.tubes, S.capacity)
      .filter((mv) => !isBottleLocked(mv[0]) && !isBottleLocked(mv[1]));
    if (!playable.length) { toast(t('stuckStillNoMove')); stuck(); return; }
    if (!S.finished) startTimer();
  };
  if (stock > 0) {
    finish(applyBottleUnlock(WaterPowerups.unlockBottle(S.tubes, {
      stock: Profile.state.bottles,
      lockedBottleIndexes: S.lockedBottleSlots,
      unlocked: S.unlockedBottles,
      mode: 'item',
      target,
    }), 'bottleAdded'));
    return;
  }
  btn.disabled = true;
  btn.classList.add('busy');
  btn.textContent = t('bottleUnlocking');
  S.unlockingBottle = target;
  showRewardedAd().then(() => {
    finish(applyBottleUnlock(WaterPowerups.unlockBottle(S.tubes, {
      stock: Profile.state.bottles,
      lockedBottleIndexes: S.lockedBottleSlots,
      unlocked: S.unlockedBottles,
      mode: 'ad',
      target,
    }), 'bottleUnlockedAd'));
  }, (err) => {
    // 降级可观测:广告没看完/没拿到奖励时要能从日志看出原因,不做静默吞异常
    console.warn('[water] stuck-unlock ad failed', err && (err.name || err.message || err));
    toast(t('adFail'));
  }).then(() => {
    S.unlockingBottle = -1;
    if (btn.isConnected) {
      btn.disabled = false;
      btn.classList.remove('busy');
      btn.textContent = t('stuckBottleAd');
    }
    render();
  });
}

/* 通关庆祝动画(2026-08-21 手机实报):通关那一下点击与结算窗弹出重合,手指的第二下会被
   刚生成的按钮接住(多半点到「回首页」),玩家看到的就是「通关后没有下一关,直接回首页」。
   修法:通关先播一段 🎉——这一层吃掉点击但没有任何按钮,误点不会有任何后果;
   动画播完才生成选择窗(再叠一道 DLG_GUARD_MS 静默期兜底)。
   #celems=N 覆盖时长(0=不播,自动化截图/门禁用);reduced-motion 用户自动缩短。 */
const WIN_CELE_MS = 1400;
const DLG_GUARD_MS = 450;
const CELE_CSS = `.cele{position:fixed;inset:0;z-index:118;overflow:hidden;display:flex;
align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,
rgba(255,255,255,.10),rgba(4,8,14,.42))}
.cele .cebig{font-size:76px;line-height:1;animation:cepop .75s cubic-bezier(.2,1.35,.4,1) both;
filter:drop-shadow(0 8px 20px rgba(0,0,0,.55))}
.cele .celab{position:absolute;top:calc(50% + 62px);font-size:15px;font-weight:800;letter-spacing:.06em;
color:#fff;padding:7px 16px;border-radius:999px;background:rgba(8,14,10,.72);
border:1px solid rgba(255,255,255,.18);box-shadow:0 6px 18px rgba(0,0,0,.35);
animation:cepop .75s .12s cubic-bezier(.2,1.35,.4,1) both}
.cele i.cf{position:absolute;top:-26px;width:9px;height:15px;border-radius:2px;
animation-name:cefall;animation-timing-function:ease-in;animation-fill-mode:both}
@keyframes cepop{0%{transform:scale(.2);opacity:0}55%{transform:scale(1.16);opacity:1}
100%{transform:scale(1);opacity:1}}
@keyframes cefall{0%{top:-26px;opacity:0}12%{opacity:1}100%{top:106%;opacity:.85}}
@media (prefers-reduced-motion:reduce){.cele i.cf{display:none}}
/* 防误触静默期:弹窗刚出现时按钮不可点(手指正落在那里也点不动),遮罩/Esc 由 dlgGuarded() 拦 */
#overlay.guard .dialog{pointer-events:none}`;
(function () {
  const st = document.createElement('style'); st.textContent = CELE_CSS; document.head.appendChild(st);
})();
function celebrate(done) {
  const m = location.hash.match(/celems=(\d+)/);
  let ms = m ? +m[1] : WIN_CELE_MS;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) ms = Math.min(ms, 400);
  if (!ms) { done(); return; }
  const el = document.createElement('div');
  el.className = 'cele'; el.id = 'celeLayer';
  const cols = ['#ffd166', '#06d6a0', '#4cc9f0', '#ef476f', '#b388ff', '#f8961e'];
  let bits = '<div class="cebig">🎉</div><div class="celab">' + t('winTitle', { n: S.level }).replace(/^🎉\s*/, '') + '</div>';
  for (let i = 0; i < 26; i++) {
    const l = Math.round(Math.random() * 96), d = (Math.random() * 0.45).toFixed(2);
    const du = (0.85 + Math.random() * 0.55).toFixed(2), c = cols[i % cols.length];
    const r = Math.round(Math.random() * 360);
    bits += `<i class="cf" style="left:${l}%;background:${c};animation-delay:${d}s;`
      + `animation-duration:${du}s;transform:rotate(${r}deg)"></i>`;
  }
  el.innerHTML = bits;
  document.body.appendChild(el);
  // 动画层自己吞掉这段时间里的所有点击(它没有按钮),这才是防误点的关键
  setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); done(); }, ms);
}

function win() {
  stopTimer(); S.finished = true; haptic('success'); WaterAudio.play('win');
  Profile.mutate((s) => {
    s.wins = Math.max(s.wins, S.level);
    const coinPatch = Coins.rewardClear(s);     // 通关奖励金币（本游戏配置在 game.config.json 的 coins 段）
    if (coinPatch) Object.assign(s, coinPatch);
  });
  wsOnWin();   // 双连胜:A+1,B 周期推进/出票(2026-08-24)
  lbSubmit(Profile.state.wins);
  // issue #30:每盘胜利 +10 碎片(解锁/大奖 toast 延迟播,不遮结算对话框)
  const wkMsgs = WeeklyCtl.addFrags(Weekly.frags.win);
  setTimeout(() => toast(t('wkGotFrags', { n: Weekly.frags.win })), 700);
  wkMsgs.forEach((m, i) => setTimeout(() => toast(m), 700 + 1400 * (i + 1)));
  const used = elapsedTime();
  const parTxt = S.par ? (S.moves === S.par ? t('statBest') : t('statPar', { n: S.par })) : t('statNoPar');
  // 先庆祝、后弹窗:结算窗绝不能生成在玩家手指还没离开屏幕的那一刻(见 celebrate 注释)
  celebrate(() => showWinDialog(used, parTxt));
}

/* 结算选择窗:只在庆祝动画播完后生成,并带 DLG_GUARD_MS 防误触静默期。 */
function showWinDialog(used, parTxt) {
  dialog(`<h2>${t('winTitle', { n: S.level })}</h2>
    <div class="stats">
      <span><b class="mono">${fmtTime(used)}</b>${t('statTime')}</span>
      <span><b class="mono">${S.moves}</b>${t('statMoves')}</span>
      <span><b class="mono">${Profile.state.wins}</b>${t('statWins')}</span>
    </div>
    <p class="parline">${parTxt}</p>
    ${WinStreak.enabled && WinStreak.hasTicket(wsGet()) ? '<button class="btn ad" id="dlgWsClaim">' + t('wsWinClaim', { r: wsRewardText(WinStreak.rewards()) }) + '</button>' : ''}
    ${IN_TG ? '<button class="btn ghost" id="dlgShare">' + t('share') + '</button>' : ''}
    <button class="btn" id="dlgNext">${t('next')}</button>
    <button class="btn ghost" id="dlgHome">${t('toHome')}</button>`,
    // 结算弹窗是「结束局面」：关掉(✕/Esc/点遮罩)必须回首页,不能把人留在一盘已完成、
    // 点什么都没反应的棋盘上——那时唯一出路只剩左上角返回,玩家看到的就是「通关后没有下一关」。
    () => { show('home'); }, DLG_GUARD_MS);
  overlay.querySelector('#dlgNext').addEventListener('click', () => {
    closeDialog();
    document.getElementById('btnStart').click();
  });
  overlay.querySelector('#dlgHome').addEventListener('click', () => { closeDialog(); show('home'); });

// 调试/回归用:按求解器最优解自动走完当前局(点击路径与真人一致,不走后门改状态)
function autoSolve() {
  // 自动化截图/回归入口不模拟付费流程：先开放关卡明确配置的锁瓶，再按真人点击路径解题。
  S.unlockedBottles = S.lockedBottleSlots.slice();
  render();
  const r = WaterEngine.solve(S.tubes, { capacity: S.capacity });
  if (!r.solvable) return;
  const seq = [];
  // 整段倒入玩法:一个最优移动=一次点击对(选源+点目标),与 tapTube/S.moves 同口径;
  // 旧的按 amount 重复点击会在整段倒完后多点出计划外移动,偏离最优路径。
  for (const mv of r.moves) seq.push(mv[0], mv[1]);
  // 必须等上一步倒水动画放完再点下一下:动画期间 tapTube 会被 S.locked 挡掉,
  // 固定间隔点击会被吞掉一次,后面整条序列错位(源/目标互换,于是出现非法移动)。
  (function step(n) {
    if (n >= seq.length) return;
    if (S.locked) { setTimeout(function () { step(n); }, 60); return; }
    tapTube(seq[n]);
    setTimeout(function () { step(n + 1); }, 240);
  })(0);
}

function newGame(level) {
  closeDialog();
  InterAd.reset(); // issue #22:新一局重置插屏抽签(每局最多一次)
  // 第 1-5 关内置固定盘面(全网同题);第 6 关起按关卡号确定性生成,
  // 生成时传入求解器做可解性验证——绝不把不可解的关发给玩家。
  const lv = WaterLevels.forLevel(level, WaterEngine.solve);
  S.tubes = lv.layout.map((t) => t.slice());
  S.start = lv.layout.map((t) => t.slice());   // 「重开」用的初始快照
  S.lockedBottleSlots = WaterPowerups.normalizeLockedBottleIndexes(
    S.tubes,
    lv.lockedBottleIndexes,
  );
  S.unlockedBottles = [];
  S.unlockingBottle = -1;
  S.capacity = lv.capacity;
  S.par = (() => {   // 步数口径=点击次数:整段倒入算 1 步,与 S.moves++ 完全同口径;生成关(minMoves=null)仍不显示
    if (lv.minMoves == null) return null;
    try {
      // 公平口径:按「不解锁空瓶」的可玩盘面求最优——锁瓶只是可选辅助,
      // 显示的「最少 N 步」必须是零广告玩家真实可达的(L9/L10 全开盘面会少 1 步,误导人)。
      const base = S.start.filter((_, ti) => !S.lockedBottleSlots.includes(ti));
      const r = WaterEngine.solve(base, { capacity: S.capacity });
      return r.solvable ? r.moves.length : lv.minMoves; // BFS 最短解的移动数就是最少点击数
    } catch (e) { return lv.minMoves; }
  })();
  S.level = level; S.sel = -1;
  S.moves = 0; S.undo = []; S.locked = false;
  S.remain = TIME_LIMIT; S.timeBudget = TIME_LIMIT;
  S.finished = false;

  show('game'); startTimer(); render();
}

  // 已存值(含 other/旧 UN)短路零 IP 请求;首次才走 IP 决策链并落盘永久锁定。
  Store.get(COUNTRY_KEY, (v) => {

  Profile.load(() => {
    Store.del('sudoku_save'); // 清掉旧版遗留对局快照:刷新一律回首页(issue #6)
    WeeklyCtl.load(() => {

      // 手动领取语义(issue #1):默认停在「可领取」;加 #wkclaimed 才标记为已领取。
      const wf = location.hash.match(/wkfrags=(\d+)/);
      if (wf) {

        for (let i = 0; i < 6; i++) if (wclaim && WeeklyCtl.state.frags >= Weekly.thresholds[i]) {
          WeeklyCtl.state.claimed[i] = true;
          WeeklyCtl.state['r' + i] = i % 2 === 0 ? { type: 'energy', n: 35 } : { type: 'hints', n: 2 };
        }
        if (wclaim && WeeklyCtl.state.frags >= Weekly.goal) WeeklyCtl.state.grand = true;
        const wc = location.hash.match(/wkcarry=(\d+)/);
        if (wc) WeeklyCtl.state.carried = +wc[1];
      }
      // 调试入口:#autostart 直接开一局(截图/自动化用,不扣体力)
      const auto = location.hash.match(/autostart(?:=(\d+))?/);
      if (auto) {

        // 调试入口:#addbottle 通过真实按钮 click 消耗道具解锁空瓶；#restartafter 随后点真实重开按钮。
        // #watergt 把最终状态写进隐藏 DOM，发布前 gate 可机械断言，不靠截图猜行为。
        if (/[#&]addbottle/.test(location.hash)) setTimeout(() => {
          document.getElementById('btnBottle').click();
          if (/[#&]restartafter/.test(location.hash)) document.getElementById('btnRestart').click();
          if (/[#&]watergt/.test(location.hash)) emitWaterGt();
        }, 0);
        // #adunlock 真实点击第一个瓶上广告按钮；演示广告 1.2s 完成后再写 ground truth。
        if (/[#&]adunlock/.test(location.hash)) setTimeout(() => {
          const adBtn = document.querySelector('[data-unlock-bottle]');
          if (adBtn) adBtn.click();
          setTimeout(() => {
            if (/[#&]restartafter/.test(location.hash)) document.getElementById('btnRestart').click();
            if (/[#&]watergt/.test(location.hash)) emitWaterGt();
          }, 1500);
        }, 0);
        // 调试入口:#stucktest 直接弹出「没有可走的了」出口弹窗(截图/自动化用,不改棋盘)。
        // #stuckunlock 随后点击弹窗里的「解锁空瓶」按钮,验证伪死局能真的被解开。
        if (/[#&]stucktest/.test(location.hash)) setTimeout(() => {
          stuck();
          if (/[#&]stuckunlock/.test(location.hash)) {
            const b = overlay.querySelector('#dlgStuckBottle');
            if (b) b.click();
            setTimeout(() => { if (/[#&]watergt/.test(location.hash)) emitWaterGt(); }, 1500);
            return;
          }
          if (/[#&]watergt/.test(location.hash)) emitWaterGt();
        }, 0);
        if (/[#&]watergt/.test(location.hash) &&
            !/[#&](?:addbottle|adunlock|stucktest)/.test(location.hash)) setTimeout(emitWaterGt, 0);
        // 调试入口:#wintest 立即进入胜利结算态(issue #22 插屏链路截图/自动化用)
        if (/[#&]wintest/.test(location.hash)) setTimeout(win, 0);
        // 调试入口:#autosolve 按求解器最优解自动走完本关(截图/回归验证用,正常玩法不受影响)
        if (/[#&]autosolve/.test(location.hash)) setTimeout(autoSolve, 300);
        return;
      }
      if (/#lb/.test(location.hash)) { show('lb'); renderLb(); return; } // 调试入口:#lb 直开排行榜(截图用)
      if (/#weekly/.test(location.hash)) { show('weekly'); return; } // 调试入口:#weekly 直开活动页(截图用)
      show('home');
    });
  });
}

/* ====================== run.ceo 平台（core/platform.js，SDK §0 两行接入）：云存档 + 登录，匿名可玩优先 ====================== */
/* 刻意用 var:这些状态在文件末尾声明,但 applyStaticI18n() 等顶层早期代码会调 renderIdentity()。
   若用 let,早期调用会踩 TDZ 抛 ReferenceError,整段脚本中断(实测崩过:boot/平台连接/事件监听全不执行)。
   var 有 hoisting,早期读到 undefined → 身份行落到「平台连接中」态,安全降级。 */
var Plat = null, platPrompted = false;

var SYNC_FAILS = 0;   // 云端回写累计失败次数（降级可观测：常态化失败要能一眼看出来）
function platformSync() {
  if (!Plat || Plat.mode !== 'online' || !Plat.user) return;
  Plat.queueSync(() => Object.assign({}, Profile.state), {
    onAuthLost: () => {
      PLAT_EXPIRED = true; renderIdentity();
      toast(LANG === 'zh' ? '登录已过期，进度暂存这个浏览器' : 'Session expired; progress kept in this browser');

    },
    /* 降级必须可观测：云端回写失败过去被静默吞掉，道具/进度对不上时日志里一条线索都没有。
       这里记异常本体 + 累计失败次数，常态化失败一眼可见。 */
    onError: (err) => {
      SYNC_FAILS += 1;
      console.warn('[water cloud] 云存档回写失败（累计 ' + SYNC_FAILS + ' 次）：' +
        ((err && (err.code || err.name)) || 'unknown') + ' / ' +
        String((err && err.message) || err).slice(0, 200) + ' status=' + (err && err.status));
    }
  });
}
/* ---- 单栏身份行:两栏合一后「我是谁 / 进度存哪 / 能做什么」只由 IdentityCore 判定一次 ---- */
var PLAT_EXPIRED = false;      // authexpired / 401 后置起,重新登录成功清掉（var:同上,防 TDZ）
var PLAT_LAST_NAME = '';       // 过期时保住上一次显示的名字,避免跳回陌生名

/* 平台顶域:play-<slug>.run.ceo → https://run.ceo(SDK 同一推断规则,见 v1.md §0) */
function platformApex() {
  const m = /^play-([a-z0-9-]+)\.(.+)$/i.exec(location.hostname);

/* 改完名字回到游戏:名字到底变了没必须判定清楚,不许静默当成功。
   stale/unknown 都打带原因的 warn 日志 + 计数,并给用户一句能分辨的提示。 */

const DEGRADE_KEY = 'water:renameDegrade';   // 跨会话持久化：内存计数刷新即归零,看不出降级是否常态化
function readRenameDegrade() {
  try { return JSON.parse(localStorage.getItem(DEGRADE_KEY) || 'null'); } catch (e) { return null; }
}
function writeRenameDegrade(state) {
  try { localStorage.setItem(DEGRADE_KEY, JSON.stringify(state)); } catch (e) {}
}
function settleRenameReturn() {
  let before = '';
  try { before = sessionStorage.getItem('water:renameFrom') || ''; sessionStorage.removeItem('water:renameFrom'); } catch (e) {}
  const after = (Plat && Plat.user && typeof Plat.user.name === 'string') ? Plat.user.name : null;
  const r = IdentityCore.renameOutcome({ before: before, after: after });

  const degrade = IdentityCore.trackRenameDegrade({ prev: readRenameDegrade(), outcome: r, at: Date.now() });
  writeRenameDegrade(degrade);
  if (r.warn) {
    console.warn('[identity] 改名回跳后名字未更新:', {
      status: r.status, before: before, after: after,
      platMode: Plat ? Plat.mode : 'pending', signedIn: !!(Plat && Plat.user),
      streak: degrade.streak, total: degrade.total, alert: degrade.alert
    });
  }
  if (r.status === 'applied') toast(t('idRenameApplied').replace('{n}', r.name));
  else toast(degrade.alert ? t('idRenameDegraded') : t(r.msgKey));
  renderIdentity();
  return { outcome: r, degrade: degrade };
}

  const whenProfile = (fn) => { if (Profile.state) fn(); else setTimeout(() => whenProfile(fn), 100); };
  whenProfile(() => {
    session.loadCloud().then((row) => {
      // localFresh：本地无实际游玩痕迹（换设备刚打开就登录），云端优先，防默认档覆盖云档
      const localFresh = (Profile.state.wins || 0) === 0;
      const merged = session.core.mergeSave(Profile.state, row, { localFresh }).save;
      Profile.mutate((s) => {
        Object.keys(merged).forEach((k) => { if (k !== 'localId') s[k] = merged[k]; });
        // 云端老行只有旧「库存数」列时按它推导 granted/spent；已有账本则原样保留（migrate 幂等）
        Object.assign(s, Stock.migrate(s));
      });
      if (!pages.home.hidden) renderHome();
      renderIdentity();
    }).catch(() => renderIdentity());
  });
});

boot();
</script>
</body>
</html>
