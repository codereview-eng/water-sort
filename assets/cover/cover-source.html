<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:#0d1420}
  svg{display:block}
</style></head><body>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1420"/>
      <stop offset="55%" stop-color="#16203a"/>
      <stop offset="100%" stop-color="#1d2740"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0a83c" stop-opacity="0.72"/>
      <stop offset="60%" stop-color="#f0a83c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f0a83c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bombBody" cx="34%" cy="26%" r="80%">
      <stop offset="0%" stop-color="#7c8cad"/>
      <stop offset="42%" stop-color="#414f72"/>
      <stop offset="100%" stop-color="#1b2438"/>
    </radialGradient>
    <radialGradient id="eyeShine" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dfe8f5"/>
    </radialGradient>
    <linearGradient id="glassRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd98a"/>
      <stop offset="100%" stop-color="#f0a83c"/>
    </linearGradient>
    <radialGradient id="glassLens" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#bfe9ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#6dc4f0" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="softS" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="tiny" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- bokeh -->
  <g opacity="0.5">
    <circle cx="150" cy="120" r="52" fill="#4fb7e8" opacity="0.09" filter="url(#soft)"/>
    <circle cx="1130" cy="150" r="70" fill="#8f8ff0" opacity="0.10" filter="url(#soft)"/>
    <circle cx="1010" cy="600" r="90" fill="#43d17c" opacity="0.07" filter="url(#soft)"/>
    <circle cx="330" cy="640" r="60" fill="#f0a83c" opacity="0.07" filter="url(#soft)"/>
    <circle cx="640" cy="90" r="40" fill="#6df0d8" opacity="0.06" filter="url(#soft)"/>
  </g>

  <!-- warm glow behind mascot -->
  <ellipse cx="820" cy="330" rx="330" ry="290" fill="url(#glow)"/>

  <!-- ============ isometric candy board (lower-left sweep) ============ -->
  <!-- tile helper geometry: rhombus 120x62, drawn with rounded look via layered polys -->
  <g id="board">
    <!-- board soft shadow -->
    <ellipse cx="520" cy="600" rx="470" ry="120" fill="#050912" opacity="0.55" filter="url(#soft)"/>

    <g id="tiles">
      <!-- row generator done by hand: 5 cols x 4 rows isometric -->
      <!-- each tile: top face + left side + right side -->
      <!-- ROW 4 (front) -->
      <g transform="translate(250,545)">
        <polygon points="0,0 66,34 0,68 -66,34" fill="#4fb7e8"/>
        <polygon points="-66,34 0,68 0,92 -66,58" fill="#2b7fa8"/>
        <polygon points="66,34 0,68 0,92 66,58" fill="#1f6588"/>
        <polygon points="0,8 52,34 0,60 -52,34" fill="#7fd4f5" opacity="0.55"/>
      </g>
      <g transform="translate(382,545)">
        <polygon points="0,0 66,34 0,68 -66,34" fill="#f0a83c"/>
        <polygon points="-66,34 0,68 0,92 -66,58" fill="#b3762a"/>
        <polygon points="66,34 0,68 0,92 66,58" fill="#8e5d20"/>
        <!-- opened tile: pip dots -->
        <polygon points="0,8 52,34 0,60 -52,34" fill="#ffd28a" opacity="0.75"/>
        <circle cx="-14" cy="32" r="6.5" fill="#5b3410"/>
        <circle cx="14" cy="38" r="6.5" fill="#5b3410"/>
      </g>
      <g transform="translate(514,545)">
        <polygon points="0,0 66,34 0,68 -66,34" fill="#43d17c"/>
        <polygon points="-66,34 0,68 0,92 -66,58" fill="#2c9457"/>
        <polygon points="66,34 0,68 0,92 66,58" fill="#217844"/>
        <polygon points="0,8 52,34 0,60 -52,34" fill="#8bf0b6" opacity="0.5"/>
      </g>
      <g transform="translate(646,545)">
        <polygon points="0,0 66,34 0,68 -66,34" fill="#8f8ff0"/>
        <polygon points="-66,34 0,68 0,92 -66,58" fill="#6060bb"/>
        <polygon points="66,34 0,68 0,92 66,58" fill="#4c4c9c"/>
        <polygon points="0,8 52,34 0,60 -52,34" fill="#c3c3ff" opacity="0.5"/>
      </g>

      <!-- ROW 3 -->
      <g transform="translate(184,511)">
        <polygon points="0,0 66,34 0,68 -66,34" fill="#8f8ff0"/>
        <polygon points="-66,34 0,68 0,92 -66,58" fill="#6060bb"/>
        <polygon points="66,34 0,68 0,92 66,58" fill="#4c4c9c"/>
        <polygon points="0,8 52,34 0,60 -52,34" fill="#c3c3ff" opacity="0.5"/>
      </g>
      <g transform="translate(316,511)">
        <polygon points="0,0 66,34 0,68 -66,34" fill="#ff7a6b"/>
        <polygon points="-66,34 0,68 0,92 -66,58" fill="#c2544a"/>
        <polygon points="66,34 0,68 0,92 66,58" fill="#9d4038"/>
        <polygon points="0,8 52,34 0,60 -52,34" fill="#ffb1a6" opacity="0.55"/>
      </g>
      <g transform="translate(448,511)">
        <polygon points="0,0 66,34 0,68 -66,34" fill="#f0a83c"/>
        <polygon points="-66,34 0,68 0,92 -66,58" fill="#b3762a"/>
        <polygon points="66,34 0,68 0,92 66,58" fill="#8e5d20"/>
        <polygon points="0,8 52,34 0,60 -52,34" fill="#ffd28a" opacity="0.6"/>
      </g>
      <g transform="translate(580,511)">
        <polygon points="0,0 66,34 0,68 -66,34" fill="#6df0d8"/>
        <polygon points="-66,34 0,68 0,92 -66,58" fill="#3fb8a3"/>
        <polygon points="66,34 0,68 0,92 66,58" fill="#2f9585"/>
        <polygon points="0,8 52,34 0,60 -52,34" fill="#aefaee" opacity="0.5"/>
      </g>
      <g transform="translate(712,511)">
        <polygon points="0,0 66,34 0,68 -66,34" fill="#4fb7e8"/>
        <polygon points="-66,34 0,68 0,92 -66,58" fill="#2b7fa8"/>
        <polygon points="66,34 0,68 0,92 66,58" fill="#1f6588"/>
        <polygon points="0,8 52,34 0,60 -52,34" fill="#7fd4f5" opacity="0.55"/>
      </g>

      <!-- ROW 2 -->
      <g transform="translate(250,477)">
        <polygon points="0,0 66,34 0,68 -66,34" fill="#43d17c"/>
        <polygon points="-66,34 0,68 0,92 -66,58" fill="#2c9457"/>
        <polygon points="66,34 0,68 0,92 66,58" fill="#217844"/>
        <polygon points="0,8 52,34 0,60 -52,34" fill="#8bf0b6" opacity="0.5"/>
      </g>
      <g transform="translate(382,477)">
        <polygon points="0,0 66,34 0,68 -66,34" fill="#4fb7e8"/>
        <polygon points="-66,34 0,68 0,92 -66,58" fill="#2b7fa8"/>
        <polygon points="66,34 0,68 0,92 66,58" fill="#1f6588"/>
        <polygon points="0,8 52,34 0,60 -52,34" fill="#a9e6ff" opacity="0.75"/>
        <circle cx="0" cy="34" r="7" fill="#12405c"/>
      </g>
      <g transform="translate(514,477)">
        <polygon points="0,0 66,34 0,68 -66,34" fill="#f0a83c"/>
        <polygon points="-66,34 0,68 0,92 -66,58" fill="#b3762a"/>
        <polygon points="66,34 0,68 0,92 66,58" fill="#8e5d20"/>
        <polygon points="0,8 52,34 0,60 -52,34" fill="#ffd28a" opacity="0.6"/>
      </g>
      <g transform="translate(646,477)">
        <polygon points="0,0 66,34 0,68 -66,34" fill="#ff7a6b"/>
        <polygon points="-66,34 0,68 0,92 -66,58" fill="#c2544a"/>
        <polygon points="66,34 0,68 0,92 66,58" fill="#9d4038"/>
        <polygon points="0,8 52,34 0,60 -52,34" fill="#ffb1a6" opacity="0.55"/>
      </g>

      <!-- ROW 1 (back) -->
      <g transform="translate(316,443)">
        <polygon points="0,0 66,34 0,68 -66,34" fill="#6df0d8"/>
        <polygon points="-66,34 0,68 0,92 -66,58" fill="#3fb8a3"/>
        <polygon points="66,34 0,68 0,92 66,58" fill="#2f9585"/>
        <polygon points="0,8 52,34 0,60 -52,34" fill="#aefaee" opacity="0.5"/>
      </g>
      <g transform="translate(448,443)">
        <polygon points="0,0 66,34 0,68 -66,34" fill="#8f8ff0"/>
        <polygon points="-66,34 0,68 0,92 -66,58" fill="#6060bb"/>
        <polygon points="66,34 0,68 0,92 66,58" fill="#4c4c9c"/>
        <polygon points="0,8 52,34 0,60 -52,34" fill="#d4d4ff" opacity="0.75"/>
        <circle cx="-13" cy="30" r="6.5" fill="#3b3b80"/>
        <circle cx="13" cy="38" r="6.5" fill="#3b3b80"/>
        <circle cx="0" cy="46" r="6.5" fill="#3b3b80"/>
      </g>
      <g transform="translate(580,443)">
        <polygon points="0,0 66,34 0,68 -66,34" fill="#43d17c"/>
        <polygon points="-66,34 0,68 0,92 -66,58" fill="#2c9457"/>
        <polygon points="66,34 0,68 0,92 66,58" fill="#217844"/>
        <polygon points="0,8 52,34 0,60 -52,34" fill="#8bf0b6" opacity="0.5"/>
      </g>

      <!-- cracked tile with mini bomb peeking (drawn last = never occluded) -->
      <g transform="translate(316,590)">
        <polygon points="0,0 66,34 0,68 -66,34" fill="#2b3854"/>
        <polygon points="-66,34 0,68 0,92 -66,58" fill="#1c2740"/>
        <polygon points="66,34 0,68 0,92 66,58" fill="#151e33"/>
        <polyline points="-40,26 -16,34 -28,44 0,50" fill="none" stroke="#0a0f1a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- mini bomb popping out of the tile -->
        <g transform="translate(14,4)">
          <ellipse cx="0" cy="34" rx="26" ry="10" fill="#0a0f1a" opacity="0.55"/>
          <circle cx="0" cy="8" r="24" fill="#39476a"/>
          <ellipse cx="-9" cy="-2" rx="8" ry="6" fill="#8d9ab5" opacity="0.7" transform="rotate(-25 -9 -2)"/>
          <rect x="-5" y="-22" width="10" height="12" rx="4" fill="#55648a"/>
          <path d="M0,-22 C9,-32 -8,-38 4,-50" fill="none" stroke="#c9a06a" stroke-width="4.5" stroke-linecap="round"/>
          <circle cx="6" cy="-53" r="7" fill="#ffd36b"/>
          <circle cx="6" cy="-53" r="14" fill="#ffb03a" opacity="0.5" filter="url(#tiny)"/>
          <circle cx="-8" cy="7" r="4.6" fill="#ffffff"/>
          <circle cx="8" cy="9" r="4.6" fill="#ffffff"/>
          <circle cx="-7" cy="8" r="2.6" fill="#12203a"/>
          <circle cx="9" cy="10" r="2.6" fill="#12203a"/>
          <path d="M-6,19 Q0,25 6,19" fill="none" stroke="#0f1524" stroke-width="3" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>

  <!-- ============ chibi bomb mascot ============ -->
  <g id="mascot" transform="translate(838,318) scale(1.06)">
    <!-- ground shadow -->
    <ellipse cx="10" cy="215" rx="150" ry="40" fill="#050912" opacity="0.6" filter="url(#softS)"/>

    <!-- raised arm holding magnifier (behind body) -->
    <g transform="translate(-130,-60) rotate(-18)">
      <rect x="-16" y="0" width="34" height="86" rx="17" fill="#33405c"/>
    </g>

    <!-- body -->
    <circle cx="0" cy="60" r="150" fill="url(#bombBody)"/>
    <!-- rim light -->
    <path d="M-150,60 A150,150 0 0 1 -30,-86" fill="none" stroke="#7f9cf5" stroke-width="9" stroke-linecap="round" opacity="0.55"/>
    <path d="M150,60 A150,150 0 0 0 60,-78" fill="none" stroke="#f0a83c" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
    <!-- glossy highlight -->
    <ellipse cx="-52" cy="-18" rx="46" ry="32" fill="#ffffff" opacity="0.22" transform="rotate(-25 -52 -18)"/>
    <ellipse cx="-70" cy="-40" rx="18" ry="11" fill="#ffffff" opacity="0.4" transform="rotate(-25 -70 -40)"/>

    <!-- fuse cap -->
    <rect x="-26" y="-108" width="52" height="42" rx="16" fill="#46536e"/>
    <rect x="-18" y="-102" width="16" height="26" rx="8" fill="#6b7a96" opacity="0.7"/>
    <!-- fuse -->
    <path d="M0,-108 C26,-146 -26,-166 16,-206" fill="none" stroke="#c9a06a" stroke-width="11" stroke-linecap="round"/>
    <!-- spark -->
    <circle cx="20" cy="-212" r="17" fill="#ffd36b"/>
    <circle cx="20" cy="-212" r="34" fill="#ffb03a" opacity="0.45" filter="url(#softS)"/>
    <g stroke="#ffe9a8" stroke-width="5" stroke-linecap="round">
      <line x1="20" y1="-244" x2="20" y2="-258"/>
      <line x1="46" y1="-228" x2="58" y2="-236"/>
      <line x1="-6" y1="-228" x2="-18" y2="-236"/>
      <line x1="40" y1="-252" x2="49" y2="-262"/>
    </g>

    <!-- eyes -->
    <g>
      <ellipse cx="-46" cy="34" rx="30" ry="34" fill="url(#eyeShine)"/>
      <ellipse cx="46" cy="34" rx="30" ry="34" fill="url(#eyeShine)"/>
      <ellipse cx="-42" cy="40" rx="17" ry="21" fill="#12203a"/>
      <ellipse cx="50" cy="40" rx="17" ry="21" fill="#12203a"/>
      <circle cx="-48" cy="30" r="7" fill="#ffffff"/>
      <circle cx="44" cy="30" r="7" fill="#ffffff"/>
      <circle cx="-36" cy="50" r="3.5" fill="#ffffff" opacity="0.8"/>
      <circle cx="56" cy="50" r="3.5" fill="#ffffff" opacity="0.8"/>
    </g>
    <!-- blush -->
    <ellipse cx="-84" cy="76" rx="24" ry="14" fill="#ff8f7a" opacity="0.45"/>
    <ellipse cx="84" cy="76" rx="24" ry="14" fill="#ff8f7a" opacity="0.45"/>
    <!-- smile -->
    <path d="M-34,86 Q0,124 34,86" fill="none" stroke="#0f1524" stroke-width="9" stroke-linecap="round"/>
    <path d="M-24,96 Q0,120 24,96 Z" fill="#ff8f7a" opacity="0.85"/>

    <!-- left arm (raised) with magnifier -->
    <g transform="translate(-150,-96)">
      <circle cx="0" cy="0" r="26" fill="#3c4a68"/>
      <g transform="rotate(-25)">
        <rect x="-9" y="0" width="18" height="46" rx="9" fill="url(#glassRim)"/>
        <circle cx="0" cy="-34" r="42" fill="url(#glassLens)" stroke="url(#glassRim)" stroke-width="12"/>
        <ellipse cx="-14" cy="-48" rx="14" ry="9" fill="#ffffff" opacity="0.6" transform="rotate(-30 -14 -48)"/>
      </g>
    </g>
    <!-- right arm: waving outward, clearly outside the body silhouette -->
    <g transform="translate(143,44) rotate(44)">
      <rect x="-16" y="0" width="32" height="86" rx="16" fill="#3b496a"/>
      <circle cx="0" cy="96" r="27" fill="#4a5a80"/>
      <ellipse cx="-9" cy="88" rx="9" ry="6.5" fill="#7d8db0" opacity="0.65"/>
    </g>
    <!-- feet -->
    <ellipse cx="-56" cy="196" rx="42" ry="24" fill="#26314a"/>
    <ellipse cx="60" cy="200" rx="42" ry="24" fill="#26314a"/>
  </g>

  <!-- floating candy tiles filling the upper-left space -->
  <g opacity="0.95">
    <g transform="translate(210,205) scale(0.5)">
      <polygon points="0,0 66,34 0,68 -66,34" fill="#4fb7e8"/>
      <polygon points="-66,34 0,68 0,92 -66,58" fill="#2b7fa8"/>
      <polygon points="66,34 0,68 0,92 66,58" fill="#1f6588"/>
      <polygon points="0,8 52,34 0,60 -52,34" fill="#a9e6ff" opacity="0.6"/>
    </g>
    <g transform="translate(400,140) scale(0.38)">
      <polygon points="0,0 66,34 0,68 -66,34" fill="#43d17c"/>
      <polygon points="-66,34 0,68 0,92 -66,58" fill="#2c9457"/>
      <polygon points="66,34 0,68 0,92 66,58" fill="#217844"/>
      <polygon points="0,8 52,34 0,60 -52,34" fill="#8bf0b6" opacity="0.55"/>
    </g>
    <g transform="translate(120,360) scale(0.32)">
      <polygon points="0,0 66,34 0,68 -66,34" fill="#8f8ff0"/>
      <polygon points="-66,34 0,68 0,92 -66,58" fill="#6060bb"/>
      <polygon points="66,34 0,68 0,92 66,58" fill="#4c4c9c"/>
      <polygon points="0,8 52,34 0,60 -52,34" fill="#c3c3ff" opacity="0.55"/>
    </g>
    <g transform="translate(560,235) scale(0.3)">
      <polygon points="0,0 66,34 0,68 -66,34" fill="#ff7a6b"/>
      <polygon points="-66,34 0,68 0,92 -66,58" fill="#c2544a"/>
      <polygon points="66,34 0,68 0,92 66,58" fill="#9d4038"/>
      <polygon points="0,8 52,34 0,60 -52,34" fill="#ffb1a6" opacity="0.55"/>
    </g>
  </g>

  <!-- confetti / sparkles -->
  <g>
    <rect x="1105" cy="0" y="250" width="18" height="10" rx="5" fill="#43d17c" opacity="0.85" transform="rotate(24 1114 255)"/>
    <rect x="1010" y="180" width="16" height="9" rx="4.5" fill="#4fb7e8" opacity="0.8" transform="rotate(-16 1018 184)"/>
    <rect x="1160" y="420" width="20" height="10" rx="5" fill="#f0a83c" opacity="0.8" transform="rotate(38 1170 425)"/>
    <rect x="700" y="140" width="16" height="9" rx="4.5" fill="#ff7a6b" opacity="0.75" transform="rotate(-30 708 144)"/>
    <rect x="240" y="240" width="16" height="9" rx="4.5" fill="#8f8ff0" opacity="0.7" transform="rotate(18 248 244)"/>
    <g fill="#ffffff" opacity="0.85">
      <path d="M1090,120 l6,14 14,6 -14,6 -6,14 -6,-14 -14,-6 14,-6 z"/>
      <path d="M200,330 l5,11 11,5 -11,5 -5,11 -5,-11 -11,-5 11,-5 z" opacity="0.7"/>
      <path d="M980,520 l4,9 9,4 -9,4 -4,9 -4,-9 -9,-4 9,-4 z" opacity="0.65"/>
    </g>
  </g>

  <!-- vignette -->
  <rect width="1280" height="720" fill="none"/>
</svg>
</body></html>
