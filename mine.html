<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>彩色扫雷 · Color Mines</title>
<style>
  :root{
    --bg:#141a24; --surface:#1e2735; --ink:#f2f5f9; --ink-2:#9fb0c3; --ink-3:#6b7a8d;
    --edge:rgba(255,255,255,.09); --accent:#ffb454; --ok:#43d17c; --bad:#ff5d5d;
    --cell-gap:3px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;
    height:100%; overflow-x:hidden; touch-action:manipulation; user-select:none; -webkit-user-select:none;}
  body{display:flex; flex-direction:column; align-items:center; min-height:100%;
    background:radial-gradient(circle at 50% -10%, #22304a 0%, #141a24 62%);}
  .wrap{width:100%; max-width:560px; padding:10px 12px calc(18px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:10px;}

  /* ---------- HUD ---------- */
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .title{font-weight:800; font-size:15px; letter-spacing:.04em;}
  .title em{font-style:normal; color:var(--accent);}
  .hud{display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--surface); border:1px solid var(--edge); border-radius:12px; padding:8px 12px;}
  .hud .box{display:flex; flex-direction:column; align-items:center; gap:2px; min-width:56px;}
  .hud .k{font-size:11px; color:var(--ink-2); letter-spacing:.06em;}
  .hud .v{font-size:15px; font-weight:800; font-variant-numeric:tabular-nums;}
  .hud .v.low{color:var(--bad); animation:blink 1s steps(2) infinite;}
  @keyframes blink{50%{opacity:.45}}
  .hearts b{color:var(--bad); letter-spacing:1px; font-size:14px;}
  .hearts b.off{color:#3a4657;}

  /* ---------- 棋盘 ---------- */
  .boardwrap{background:var(--surface); border:1px solid var(--edge); border-radius:14px; padding:8px;}
  .board{display:grid; gap:var(--cell-gap); width:100%; aspect-ratio:1; touch-action:none;}
  .cell{position:relative; border-radius:6px; border:1px solid rgba(0,0,0,.28);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    font-size:15px; font-weight:800; overflow:hidden;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22), inset 0 -2px 0 rgba(0,0,0,.18);}
  .cell.small{font-size:12px; border-radius:5px;}
  .cell .mk{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:rgba(0,0,0,.62); text-shadow:0 1px 0 rgba(255,255,255,.25); pointer-events:none;}
  .cell.safe .mk::before{content:'✕';}
  .cell.hintsafe .mk::before{content:'✕'; color:#0b6b3a;}
  .cell.opened{filter:saturate(.35) brightness(.72);}
  .cell.opened .mk::before{content:'·'; font-size:1.4em;}
  .cell.mine{filter:brightness(1.06);}
  .cell.mine .mk::before{content:'💣'; font-size:.95em; text-shadow:none;}
  .cell.boom{animation:shake .4s;}
  @keyframes shake{20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
  .cell.pop{animation:pop .35s;}
  @keyframes pop{40%{transform:scale(1.18)}}

  /* ---------- 道具 ---------- */
  .tools{display:flex; gap:8px;}
  .tool{flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    background:var(--surface); border:1px solid var(--edge); border-radius:12px;
    padding:10px 8px; color:var(--ink); font-size:13px; font-weight:700; cursor:pointer;}
  .tool .cnt{background:rgba(255,180,84,.16); color:var(--accent); border-radius:8px; padding:1px 7px; font-size:12px;}
  .tool:disabled{opacity:.45;}
  .hintline{font-size:13px; color:#b9c5d3; text-align:center; line-height:1.65;}

  /* ---------- 弹窗 / toast ---------- */
  .overlay{position:fixed; inset:0; background:rgba(8,12,18,.66); display:none;
    align-items:center; justify-content:center; z-index:30; padding:20px;}
  .overlay.show{display:flex;}
  .dialog{background:var(--surface); border:1px solid var(--edge); border-radius:16px;
    padding:20px; width:100%; max-width:320px; display:flex; flex-direction:column; gap:12px; text-align:center;}
  .dialog h2{margin:0; font-size:18px;}
  .dialog p{margin:0; font-size:13px; color:var(--ink-2); line-height:1.6;}
  .dialog .btn{border:0; border-radius:10px; padding:11px; font-size:14px; font-weight:800; cursor:pointer;}
  .btn.primary{background:var(--accent); color:#20160a;}
  .btn.ghost{background:transparent; color:var(--ink-2); border:1px solid var(--edge);}
  .toast{position:fixed; left:50%; bottom:80px; transform:translateX(-50%) translateY(8px);
    background:#0d1420; border:1px solid var(--edge); color:var(--ink); border-radius:10px;
    padding:8px 14px; font-size:13px; opacity:0; transition:.25s; pointer-events:none; z-index:40; white-space:nowrap;}
  .toast.show{opacity:1; transform:translateX(-50%);}

  /* ---------- 首页（与 water.html home 同款布局） ---------- */
  [hidden]{display:none !important;}
  .home{display:flex; flex-direction:column; gap:14px; padding-top:26px;}
  .home .logo{text-align:center; font-size:30px; font-weight:700; letter-spacing:.08em; color:var(--ink);}
  .home .logo em{display:block; font-style:normal; color:var(--accent); font-size:13px; letter-spacing:.3em; margin-top:4px;}
  .homestats{display:flex; gap:10px;}
  .homestats .st{flex:1; background:var(--surface); border:1px solid var(--edge); border-radius:12px;
    padding:10px 12px; text-align:center;}
  .homestats .st b{display:block; font-size:20px; color:var(--ink); margin-bottom:2px;}
  .homestats .st span{font-size:12px; color:var(--ink-2);}
  .bigbtn{border:0; border-radius:14px; padding:16px; font-size:17px; font-weight:800; cursor:pointer;
    background:var(--accent); color:#20160a;}
  .bigbtn small{display:block; font-weight:600; font-size:12px; margin-top:4px; opacity:.9;}
  .energy{display:flex; gap:10px; align-items:center; background:var(--surface); border:1px solid var(--edge);
    border-radius:12px; padding:10px 12px;}
  .energy .icon{font-size:22px;}
  .energy .info{flex:1;}
  .energy .val{font-size:15px; font-weight:800; color:var(--ink);}
  .energy .val .max{color:var(--ink-3); font-weight:600;}
  .energy .sub{font-size:12px; color:var(--ink-2); margin:2px 0 4px;}
  .energy .bar{height:5px; border-radius:3px; background:rgba(255,255,255,.08); overflow:hidden;}
  .energy .bar i{display:block; height:100%; background:var(--accent); border-radius:3px;}
  .profilerow{display:flex; gap:10px; align-items:center; background:var(--surface); border:1px solid var(--edge);
    border-radius:12px; padding:10px 12px; cursor:pointer; color:var(--ink); font-size:13px; text-align:left; width:100%;}
  .profilerow .avatar{width:32px; height:32px; border-radius:50%; background:var(--accent); color:#20160a;
    display:flex; align-items:center; justify-content:center; font-weight:800; flex:none;}
  .profilerow .profileinfo{flex:1; min-width:0; display:flex; flex-direction:column; gap:1px;}
  .profilerow .profilelabel{font-size:12px; color:var(--ink-2); line-height:1.35;}
  .profilerow .profilename{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .profilerow .profilesource{font-size:12px; color:var(--ink-2); line-height:1.35;}
  .langrow{display:flex; align-items:center; justify-content:space-between; background:var(--surface);
    border:1px solid var(--edge); border-radius:12px; padding:10px 12px; font-size:13px; color:var(--ink-2);}
  .sfxbtn{border:1px solid var(--edge); background:transparent; color:var(--ink); border-radius:8px;
    padding:4px 14px; cursor:pointer; font-size:13px;}
  .langrow select{appearance:none; -webkit-appearance:none; color-scheme:dark; border:1px solid var(--edge);
    background-color:#151d29; color:var(--ink); border-radius:8px; padding:6px 30px 6px 10px;
    font:inherit; cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),
      linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);
    background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;
    background-size:5px 5px,5px 5px; background-repeat:no-repeat;}
  .langrow select:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .backbtn{background:transparent; border:0; color:var(--ink-2); font-size:13px; cursor:pointer; padding:4px 6px; flex:none;}
  .game{display:flex; flex-direction:column; gap:10px;}
  .home > .hintline{margin-top:3px;}
</style>
</head>
<body>
<div class="wrap">
  <!-- ============ 首页：由 core/home.js 模块按 gameConfig screens.home 声明渲染 ============ -->
  <div class="home" id="home"></div>

  <!-- ============ 游戏页 ============ -->
  <div class="game" id="game" hidden>
  <div class="topbar">
    <button class="backbtn" id="btnBack">‹ 返回</button>
    <div class="title">彩色扫雷 <em>COLOR MINES</em></div>
    <div class="hearts" id="hearts"></div>
  </div>

  <div class="hud">
    <div class="box"><span class="k">关卡</span><b class="v" id="hudLv">1</b></div>

  </div>

  <div class="boardwrap"><div class="board" id="board" aria-label="扫雷棋盘"></div></div>

  <div class="tools">
    <button class="tool" id="toolMine">🎯 找一个雷 <span class="cnt" id="cntMine">0</span></button>

  </div>
  <div class="hintline">单击 = 标记「不是雷」✕（再点取消）· 按住拖动 = 批量标记/取消 · 快速双击 = 挖开 · 每种颜色 / 每行 / 每列恰好一颗雷，雷与雷互不相邻</div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="dialog">
    <h2 id="dlgTitle"></h2>
    <p id="dlgBody"></p>
    <button class="btn primary" id="dlgMain"></button>
    <button class="btn ghost" id="dlgSub"></button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';
  /* ============ 常量 / 存档 ============ */
  var DBL_MS = 320;                    // 双击窗口
  var KEY = 'mine_save_v1';
  var COLORS = ['#7f9cf5','#f56d6d','#f5c66d','#6dd3a8','#c98df0','#6dc4f0',
                '#f09db8','#a8d36d','#f0a56d','#8f8ff0','#6df0d8'];  // 11 色恰好覆盖 11×11
  var AD_TOOL_GRANT = 1;               // 看广告补 1 个道具（演示：模拟播放）
  var AD_TIME_BONUS = 60;              // 看广告加 60 秒
  /* GameConfig 内嵌：与 games/mine/game.config.json 逐字段一致（mine-config.test.js 校验）；
     reward 参数经 RewardCore fail-fast 校验，screens.home 声明驱动首页渲染 */
  var CFG = JSON.parse(document.getElementById('gameConfig').textContent);
  var Reward = RewardCore.create(CFG.reward);
  var I18n = LocaleCore.createI18n(CFG.i18n);
  var LANG_KEY = 'mine_lang';
  function normalizeLang(lang) {
    var raw = String(lang || '').replace('_', '-');
    var locales = I18n.locales();
    if (locales.indexOf(raw) !== -1) return raw;
    var base = raw.split('-')[0].toLowerCase();
    return locales.indexOf(base) !== -1 ? base : null;
  }
  function resolveInitialLang() {
    var query = /[?&]lang=([A-Za-z-]+)/.exec(location.search || '');
    var queryLang = query ? normalizeLang(query[1]) : null;
    var saved = null;
    try { saved = localStorage.getItem(LANG_KEY); } catch (e) {}
    return queryLang || normalizeLang(saved) || normalizeLang(navigator.language) || CFG.i18n['default'];
  }
  var LANG = resolveInitialLang();
  function t(key, vars) {
    var text = I18n.t(LANG, key);
    if (vars) Object.keys(vars).forEach(function (name) {
      text = text.split('{' + name + '}').join(String(vars[name]));
    });
    return text;
  }
  var save = Object.assign({ level: 1, clears: 0, toolMine: 2, toolSafe: 2,
    energy: Reward.E_MAX, lastTs: Date.now(), alias: '', sfx: true }, load() || {});
  function load(){ try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } }
  function persist(){ save.updatedMs = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} platformSync(); }

  /* ============ 音效（首页设置可开关） ============ */
  var AC = null;
  function blip(freq, dur) {
    if (!save.sfx) return;
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = 'triangle'; o.frequency.value = freq;
      g.gain.setValueAtTime(.08, AC.currentTime);
      g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + dur);
      o.connect(g); g.connect(AC.destination);
      o.start(); o.stop(AC.currentTime + dur);
    } catch (e) {}
  }

  /* ============ 运行时状态 ============ */
  var S = null;        // 当前关：{lv,size,board,mines:Set,found:Set,marks:Set,opened:Set,lives,remain,timerId,done}
  var clickTimer = null, lastTap = { idx: -1, t: 0 };

  var $ = function (id) { return document.getElementById(id); };
  var boardEl = $('board');

  /* ============ 开关 ============ */
  function startLevel(lv) {
    var data = MineLevels.get(lv);
    if (!data) { toast(t('levelFailed')); return; }
    var mines = new Set();
    data.board.mines.forEach(function (c, r) { mines.add(r * data.size + c); });
    S = { lv: lv, size: data.size, board: data.board, mines: mines,
          found: new Set(), marks: new Set(), opened: new Set(),
          lives: data.lives, remain: data.timeLimit, timerId: null, done: false };
    renderBoard(); renderHud();
    if (S.remain != null) startTimer();
  }

  function startTimer() {
    stopTimer();
    S.timerId = setInterval(function () {
      if (S.done) return stopTimer();
      S.remain -= 1; renderTime();
      if (S.remain <= 0) { stopTimer(); onTimeUp(); }
    }, 1000);
  }
  function stopTimer(){ if (S && S.timerId) { clearInterval(S.timerId); S.timerId = null; } }

  /* ============ 渲染 ============ */
  function renderBoard() {
    boardEl.innerHTML = '';
    boardEl.style.gridTemplateColumns = 'repeat(' + S.size + ',1fr)';
    for (var i = 0; i < S.size * S.size; i++) {
      var d = document.createElement('div');
      d.className = 'cell' + (S.size >= 9 ? ' small' : '');
      d.dataset.idx = i;
      d.style.background = COLORS[S.board.region[i] % COLORS.length];
      var mk = document.createElement('span'); mk.className = 'mk'; d.appendChild(mk);
      boardEl.appendChild(d);
    }
    boardEl.onpointerdown = onTap;
  }
  function cellEl(idx){ return boardEl.children[idx]; }
  function renderHud() {
    $('hudLv').textContent = S.lv;
    $('hudLeft').textContent = S.size - S.found.size;
    var hs = '';
    for (var i = 0; i < 3; i++) hs += '<b class="' + (i < S.lives ? '' : 'off') + '">♥</b>';
    $('hearts').innerHTML = hs;
    $('cntMine').textContent = save.toolMine;
    $('cntSafe').textContent = save.toolSafe;
    $('toolMine').disabled = save.toolMine <= 0 && false;
    renderTime();
  }
  function renderTime() {
    var el = $('hudTime');
    if (S.remain == null) { el.textContent = '∞'; el.classList.remove('low'); return; }
    var s = Math.max(0, S.remain);
    el.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    el.classList.toggle('low', s <= 30);
  }

  /* ============ 点击：单击标记 / 双击挖开 / 拖动批量标记 ============ */
  var drag = null;   // {startIdx, mode:'mark'|'erase', moved}

  function canPaint(idx) { return !(S.found.has(idx) || S.opened.has(idx)); }

  // 拖动涂抹：mark 只标记未标记的；erase 只取消已标记的；雷/已挖开一律跳过
  function applyMark(idx, mode) {
    if (!canPaint(idx)) return;
    var el = cellEl(idx);
    if (mode === 'mark') {
      if (S.marks.has(idx)) return;
      S.marks.add(idx); el.classList.add('safe');
    } else {
      if (!S.marks.has(idx)) return;
      S.marks.delete(idx); el.classList.remove('safe', 'hintsafe');
    }
  }

  function cellIdxFromPoint(ev) {
    var t = document.elementFromPoint(ev.clientX, ev.clientY);
    var cell = t && t.closest ? t.closest('.cell') : null;
    return (cell && boardEl.contains(cell)) ? Number(cell.dataset.idx) : -1;
  }

  function onDragMove(ev) {
    if (!drag || S.done) return;
    var idx = cellIdxFromPoint(ev);
    if (idx < 0) return;
    if (!drag.moved) {
      if (idx === drag.startIdx) return;
      drag.moved = true;                       // 进入拖动：取消单击/双击判定
      if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
      lastTap = { idx: -1, t: 0 };
      applyMark(drag.startIdx, drag.mode);     // 起点按拖动模式生效
    }
    applyMark(idx, drag.mode);
  }

  function onDragEnd() { drag = null; }
  document.addEventListener('pointermove', onDragMove, { passive: true });
  document.addEventListener('pointerup', onDragEnd);
  document.addEventListener('pointercancel', onDragEnd);

  function onTap(ev) {
    if (S.done) return;
    var cell = ev.target.closest('.cell');
    if (!cell) return;
    var idx = Number(cell.dataset.idx);
    if (S.found.has(idx) || S.opened.has(idx)) return;
    // 记录拖动起点：起点已标记 → 本次拖动取消标记；未标记 → 本次拖动补标记
    drag = { startIdx: idx, mode: S.marks.has(idx) ? 'erase' : 'mark', moved: false };
    var now = Date.now();
    if (lastTap.idx === idx && now - lastTap.t < DBL_MS) {   // 双击 → 挖开
      lastTap = { idx: -1, t: 0 };
      if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
      dig(idx);
      return;
    }
    lastTap = { idx: idx, t: now };
    if (clickTimer) clearTimeout(clickTimer);
    clickTimer = setTimeout(function () { clickTimer = null; toggleMark(idx); }, DBL_MS);
  }

  function toggleMark(idx) {
    if (S.done || S.found.has(idx) || S.opened.has(idx)) return;
    var el = cellEl(idx);
    if (S.marks.has(idx)) { S.marks.delete(idx); el.classList.remove('safe', 'hintsafe'); }
    else { S.marks.add(idx); el.classList.add('safe'); blip(660, .06); }
  }

  function dig(idx) {
    var el = cellEl(idx);
    if (S.mines.has(idx)) {                 // 挖中雷 = 找对
      S.found.add(idx); S.marks.delete(idx);
      el.classList.remove('safe', 'hintsafe');
      el.classList.add('mine', 'pop');
      blip(880, .12);
      renderHud();
      if (S.found.size === S.size) return onWin();
    } else {                                // 挖错 → 扣血
      S.opened.add(idx); S.marks.delete(idx);
      el.classList.remove('safe', 'hintsafe');
      el.classList.add('opened', 'boom');
      blip(140, .25);
      S.lives -= 1; renderHud();
      if (S.lives <= 0) return onDead();
      toast(t('notMine', { lives: S.lives }));
    }
  }

  /* ============ 道具 ============ */
  $('toolMine').addEventListener('click', function () {
    if (S.done) return;
    if (save.toolMine <= 0) return offerAdTool('toolMine', '🎯 ' + t('toolMine'));
    var idx = MineEngine.pickUnfoundMine(S.board, S.found);
    if (idx < 0) return toast(t('allMinesFound'));
    save.toolMine -= 1; persist();
    S.found.add(idx); S.marks.delete(idx);
    var el = cellEl(idx);
    el.classList.remove('safe', 'hintsafe');
    el.classList.add('mine', 'pop');
    renderHud();
    if (S.found.size === S.size) onWin();
  });

  $('toolSafe').addEventListener('click', function () {
    if (S.done) return;
    if (save.toolSafe <= 0) return offerAdTool('toolSafe', '🛡 ' + t('toolSafe'));
    var excluded = new Set(S.marks);
    S.opened.forEach(function (i) { excluded.add(i); });
    var idx = MineEngine.pickSafeCell(S.board, excluded);
    if (idx < 0) return toast(t('noSafeCell'));
    save.toolSafe -= 1; persist();
    S.marks.add(idx);
    cellEl(idx).classList.add('safe', 'hintsafe', 'pop');
    renderHud();
    toast(t('safeHint'));
  });

  function offerAdTool(key, name) {
    dialog(t('toolEmptyTitle'), t('toolEmptyBody', { count: AD_TOOL_GRANT, name: name }),
      t('watchAd', { count: AD_TOOL_GRANT }), function () {
        save[key] += AD_TOOL_GRANT; persist(); renderHud(); toast(t('toolRefilled'));
      }, t('cancel'), null);
  }

  /* ============ 结算 ============ */
  function onWin() {
    S.done = true; stopTimer();
    save.level = S.lv + 1; save.clears = (save.clears || 0) + 1; persist();
    dialog(t('winTitle', { level: S.lv }), t('winBody', { count: S.size }),
      t('nextLevel'), function () { startLevel(save.level); }, t('home'), showHome);
  }
  function onDead() {
    S.done = true; stopTimer();
    dialog(t('deadTitle'), t('deadBody'),
      t('revive'), function () { S.done = false; S.lives = 1; renderHud(); if (S.remain != null) startTimer(); },
      t('restart'), function () { startLevel(S.lv); });
  }
  function onTimeUp() {
    S.done = true;
    dialog(t('timeUpTitle'), t('timeUpBody', { seconds: AD_TIME_BONUS }),
      t('watchAdSeconds', { seconds: AD_TIME_BONUS }), function () { S.done = false; S.remain = AD_TIME_BONUS; renderHud(); startTimer(); },
      t('restart'), function () { startLevel(S.lv); });
  }

  /* ============ 弹窗 / toast ============ */
  var toastTimer = null;
  function toast(msg) {
    var el = $('toast'); el.textContent = msg; el.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1600);
  }
  function dialog(title, body, mainText, onMain, subText, onSub) {
    $('dlgTitle').textContent = title;
    $('dlgBody').textContent = body;
    var mainBtn = $('dlgMain'), subBtn = $('dlgSub'), ov = $('overlay');
    mainBtn.textContent = mainText;
    mainBtn.onclick = function () { ov.classList.remove('show'); if (onMain) onMain(); };
    if (subText) {
      subBtn.style.display = ''; subBtn.textContent = subText;
      subBtn.onclick = function () { ov.classList.remove('show'); if (onSub) onSub(); };
    } else subBtn.style.display = 'none';
    ov.classList.add('show');
  }

  /* ============ 调试口（截图/自动化用，与倒水页同风格） ============ */
  window.__mine = {
    state: function () { return S && { lv: S.lv, size: S.size, found: Array.from(S.found), lives: S.lives, remain: S.remain, done: S.done }; },
    dig: dig, mark: toggleMark,
    solve: function () { S.mines.forEach(function (i) { if (!S.found.has(i)) dig(i); }); },
    home: function () { showHome(); }, start: function () { startGame(); }
  };

  /* ============ 首页：ShellCore + HomeCore 按 gameConfig screens.home 声明渲染 ============ */
  $('home').innerHTML = ShellCore.create(HomeCore.registry(), CFG.screens).render('home', {}).join('');

  function populateLangSel() {
    var sel = $('langSel');
    sel.innerHTML = '';
    I18n.locales().forEach(function (code) {
      var option = document.createElement('option');
      option.value = code;
      option.textContent = I18n.t(code, 'langName');
      option.selected = code === LANG;
      sel.appendChild(option);
    });
    $('langLabel').textContent = t('langLabel');
    sel.setAttribute('aria-label', t('langLabel'));
  }
  function applyStaticI18n() {
    document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
    document.title = t('title');
    var logo = document.querySelector('#home .logo');
    logo.childNodes[0].nodeValue = '💣 ' + t('logoMain');
    logo.querySelector('em').textContent = t('logoSub');
    logo.querySelector('em').hidden = LANG === 'en';
    $('btnStart').innerHTML = t('start') + ' <span class="mono" id="startLv">' + save.level + '</span>' +
      '<small>' + t('startCost', { cost: Reward.E_COST }) + '</small>';
    var homeLabels = document.querySelectorAll('#home .homestats .st span');
    [t('homeProgress'), t('homeClears'), t('homeTools')].forEach(function (text, i) { homeLabels[i].textContent = text; });
    $('profileLabel').textContent = t('profileLabel');
    $('profileSource').textContent = t('profileSource');
    $('accountLabel').textContent = t('accountLabel');
    $('sfxLabel').textContent = t('sfxLabel');
    var homeHint = document.querySelector('#home .hintline');
    homeHint.innerHTML = t('homeHint1') + '<br>' + t('homeHint2');

    $('btnBack').textContent = t('back');
    var gameTitle = document.querySelector('#game .title');
    gameTitle.childNodes[0].nodeValue = t('logoMain') + ' ';
    gameTitle.querySelector('em').textContent = t('logoSub');
    gameTitle.querySelector('em').hidden = LANG === 'en';
    var hudLabels = document.querySelectorAll('#game .hud .box .k');
    [t('hudLevel'), t('hudMines'), t('hudTime')].forEach(function (text, i) { hudLabels[i].textContent = text; });
    boardEl.setAttribute('aria-label', t('boardAria'));
    $('toolMine').childNodes[0].nodeValue = '🎯 ' + t('toolMine') + ' ';
    $('toolSafe').childNodes[0].nodeValue = '🛡 ' + t('toolSafe') + ' ';
    document.querySelector('#game .hintline').textContent = t('gameHint');
  }
  function applyLang(lang) {
    LANG = normalizeLang(lang) || CFG.i18n['default'];
    applyStaticI18n();
    populateLangSel();
    renderHome();
    if (S) renderHud();
    renderAccount();
  }

  function renderHome() {
    var r = Reward.restore(save.energy, save.lastTs, Date.now());
    if (r.energy !== save.energy || r.lastTs !== save.lastTs) { save.energy = r.energy; save.lastTs = r.lastTs; persist(); }
    $('homeLv').textContent = save.level;
    $('startLv').textContent = save.level;
    $('homeClears').textContent = save.clears || 0;
    $('homeTools').textContent = save.toolMine + save.toolSafe;
    $('enVal').textContent = save.energy;
    document.querySelector('.energy .max').textContent = ' / ' + Reward.E_MAX;
    $('enBar').style.width = Math.min(100, Math.round(save.energy / Reward.E_MAX * 100)) + '%';
    $('enSub').textContent = save.energy >= Reward.E_MAX ? t('energyFull')
      : t('energyRefill', { seconds: Math.max(0, Math.ceil((Reward.E_TICK - (Date.now() - save.lastTs)) / 1000)) });
    $('profileName').textContent = save.alias || t('player');
    $('profileAvatar').textContent = (save.alias || t('player')).slice(0, 1);
    $('sfxToggle').textContent = save.sfx ? t('sfxOn') : t('sfxOff');
    $('sfxToggle').setAttribute('aria-pressed', String(!!save.sfx));
  }
  function showHome() {
    stopTimer();
    $('game').hidden = true; $('home').hidden = false;
    renderHome();
    renderAccount();
    maybePromptLogin();
  }
  function startGame() {
    renderHome();                        // 先按当前时间恢复体力再判定
    if (save.energy < Reward.E_COST) {
      dialog(t('energyLowTitle'), t('energyLowBody', { energy: save.energy, cost: Reward.E_COST, bonus: Reward.E_AD }),
        t('watchAd', { count: Reward.E_AD }), function () {
          save.energy += Reward.E_AD;    // 广告补体力可超上限（与 water 同规则，issue #7）
          if (save.energy >= Reward.E_MAX) save.lastTs = Date.now();
          persist(); renderHome(); toast(t('energyAdded'));
        }, t('cancel'), null);
      return;
    }
    save.energy -= Reward.E_COST;
    if (save.energy + Reward.E_COST >= Reward.E_MAX) save.lastTs = Date.now();
    persist();
    $('home').hidden = true; $('game').hidden = false;
    startLevel(save.level);
  }
  $('btnStart').addEventListener('click', startGame);
  $('btnProfile').addEventListener('click', function () {
    var name = window.prompt(t('promptName'), save.alias || '');
    if (name === null) return;
    save.alias = name.trim().slice(0, 12); persist(); renderHome();
  });
  $('sfxToggle').addEventListener('click', function () { save.sfx = !save.sfx; persist(); renderHome(); });
  $('langSel').addEventListener('change', function (e) {
    try { localStorage.setItem(LANG_KEY, e.target.value); } catch (err) {}
    applyLang(e.target.value);
  });
  setInterval(function () { if (!$('home').hidden) renderHome(); }, 1000);
  $('btnBack').addEventListener('click', function () {
    if (S && !S.done) {
      dialog(t('exitTitle'), t('exitBody', { level: S.lv }), t('exit'), showHome, t('continue'), null);
    } else showHome();
  });

  /* ============ run.ceo 平台（core/platform.js，SDK §0 两行接入）：云存档 + 登录，匿名可玩优先 ============ */
  var Plat = null, platPrompted = false;
  function platformSync() {
    if (!Plat || Plat.mode !== 'online' || !Plat.user) return;
    Plat.queueSync(function () { return save; }, {
      onAuthLost: function () { renderAccount(); toast(t('authExpired')); }
    });
  }
  function renderAccount() {
    if (!$('btnAccount')) return;
    var view = { avatar: '☁', status: t('connecting'), title: t('connecting'), action: '' };
    if (!Plat || Plat.mode !== 'online') {
      view.status = Plat ? t('localSave') : t('connecting');
      view.title = view.status;
    } else if (Plat.user) {
      view = Plat.core.accountPresentation(Plat.user);
      view.action = t('logout');
    } else {
      view.status = t('loggedOut');
      view.title = view.status;
      view.action = t('login');
    }
    $('accountAvatar').textContent = view.avatar;
    $('accountStatus').textContent = view.status;
    $('accountStatus').title = view.title;
    $('accountAction').textContent = view.action;
    $('btnAccount').setAttribute('aria-label', t('accountLabel') + ': ' + view.status + (view.action ? ', ' + view.action : ''));
  }
  /* 登录引导：匿名通关满 N 盘（config platform.loginPromptAfterClears）在首页非阻断提示一次 */
  function maybePromptLogin() {
    if (!Plat || Plat.mode !== 'online' || Plat.user) return;
    if (!Plat.core.shouldPromptLogin({ clears: save.clears || 0, prompted: platPrompted })) return;
    platPrompted = true;
    dialog(t('cloudPromptTitle'), t('cloudPromptBody', { clears: save.clears || 0 }),
      t('login'), function () { Plat.login(); }, t('later'), null);
  }
  $('btnAccount').addEventListener('click', function () {
    if (!Plat) { toast(t('platformConnecting')); return; }
    if (Plat.mode !== 'online') { toast(t('localOnly')); return; }
    if (Plat.user) {
      dialog(t('logoutTitle'), t('logoutBody'), t('logout'), function () {
        Plat.logout(); Plat.user = null; renderAccount(); toast(t('loggedOutToast'));
      }, t('cancel'), null);
    } else Plat.login();
  });
  PlatformCore.connect(CFG.platform).then(function (session) {
    Plat = session;
    renderAccount();
    if (session.mode !== 'online') return;
    session.on('authexpired', function () { renderAccount(); });
    if (!session.user) return;
    // 登录态：拉云档 → 字段级合并（进度取大、道具/体力按时间戳取新）→ 落本地并回写云端
    session.loadCloud().then(function (row) {
      // localFresh：本地没有实际游玩痕迹（换设备刚打开就登录），云端优先，防默认档覆盖云档
      var localFresh = (save.clears || 0) === 0 && save.level <= 1;
      var merged = session.core.mergeSave(save, row, { localFresh: localFresh }).save;
      Object.keys(merged).forEach(function (k) { save[k] = merged[k]; });
      persist(); renderHome(); renderAccount();
    }).catch(function () { renderAccount(); });
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden' && Plat && Plat.mode === 'online') Plat.flush(function () { return save; });
  });

  applyLang(LANG);
  showHome();
})();
</script>
</body>
</html>
