<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>倒水排序 · Water Sort</title>
<!-- Telegram Mini App SDK(仅在 Telegram 内生效;浏览器打开自动降级)。
     issue #20:自托管同源副本(telegram.org 在部分网络被墙导致身份丢失),
     onerror 动态注入官方 URL 作后备。 -->
<script src="./tg-web-app.js" onerror="(function(){var s=document.createElement('script');s.src='https://telegram.org/js/telegram-web-app.js';document.head.appendChild(s);})()"></script>
<!-- Monetag SDK(Rewarded Interstitial zone 11440777) -->
<script src="https://libtl.com/sdk.js" data-zone="11440777" data-sdk="show_11440777"></script>
<style>
:root{
  --canvas:#141A16; --surface:#1B231D; --elevated:#232E26;
  --ink:#E7EDE8; --ink-2:#B2C0B6; --ink-3:#8CA093; --ink-4:#57685D;
  --accent:#7FC29B; --podium:#D4B36A;
  --ok:#58B98C; --warn:#D2A05C; --bad:#DE7A70;
  --edge:#25312A; --edge-strong:#5F7568;
  --cell-same:#20362A; --cell-sel:#2B4636; --cell-peer:#1E2921;
  --chip-bad:#301F1D; --overlay:rgba(10,14,11,.72);
}
:root[data-theme=light]{
  --canvas:#F1F4F0; --surface:#FFFFFF; --elevated:#E7EDE8;
  --ink:#1E2922; --ink-2:#43554A; --ink-3:#5F7568; --ink-4:#9AABA0;
  --accent:#2E7D57; --podium:#8A6D2B;
  --ok:#247A54; --warn:#8A6414; --bad:#B44438;
  --edge:#DCE3DD; --edge-strong:#8CA093;
  --cell-same:#D8EAE0; --cell-sel:#C2E0D0; --cell-peer:#E9F0EA;
  --chip-bad:#F6E3E0; --overlay:rgba(30,41,34,.45);
}
/* ---------- 试管台（倒水玩法） ---------- */
.tubes{
  width:100%; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:18px; padding:10px 0 4px;
}
.tubes{position:relative}   /* 水流/水花按这里的坐标系绝对定位 */
.tubes .row{display:flex; justify-content:center; align-items:flex-start; gap:14px}
/* 倾倒:源管抬到目标管口上方并侧倾,倾斜轴放在管底,像真的用手拿着倒 */
.tube.pouring{z-index:6; transition:transform .22s cubic-bezier(.34,1.15,.64,1)}
.tube{transform-origin:50% 88%}
/* 水柱:Blender 渲的白色液柱做遮罩,颜色由倒出的液体决定 */
.stream{
  position:absolute; width:22px; z-index:5; pointer-events:none;
  -webkit-mask-image:url(./assets/tubes/pour-stream.png); mask-image:url(./assets/tubes/pour-stream.png);
  -webkit-mask-size:100% 100%; mask-size:100% 100%;
  -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
  transform-origin:top center; animation:streamIn .16s ease-out;
}
@keyframes streamIn{from{transform:scaleY(.08);opacity:.35}to{transform:scaleY(1);opacity:1}}
.splash{
  position:absolute; width:30px; height:19px; z-index:5; pointer-events:none;
  -webkit-mask-image:url(./assets/tubes/pour-splash.png); mask-image:url(./assets/tubes/pour-splash.png);
  -webkit-mask-size:100% 100%; mask-size:100% 100%;
  -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
  animation:splashPop .36s ease-out forwards;
}
@keyframes splashPop{0%{transform:translateY(4px) scale(.45);opacity:0}
  38%{transform:translateY(0) scale(1);opacity:.95}
  100%{transform:translateY(-3px) scale(1.18);opacity:0}}
.slot{display:flex; flex-direction:column; align-items:center; gap:6px}
/* 试管本体由 Blender 渲染的素材承担（玻璃折射/厚度/圆底/管口都是真渲染出来的，
   不再用 CSS 描边模拟）；液体 = 纯色块 + 该层遮罩，因此任意配色都能复用同一套素材。 */
.tube{
  width:56px; aspect-ratio:240/660; position:relative; cursor:pointer;
  transition:transform .16s ease, filter .16s ease;
}
.tube .layer{
  position:absolute; inset:0; z-index:1;
  -webkit-mask-size:100% 100%; mask-size:100% 100%;
  -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
  transition:opacity .2s ease;
}
/* 明暗底图叠在色块上（被同一遮罩裁到该层形状内），让纯色块有玻璃里的立体感 */
.tube .layer::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:url(./assets/tubes/tube-shade.png) center/100% 100% no-repeat;
  mix-blend-mode:multiply; opacity:.55;
}
.tube .glass{
  position:absolute; inset:0; z-index:2; pointer-events:none;
  background:url(./assets/tubes/tube-empty.png) center/100% 100% no-repeat;
}
.tube.sel{transform:translateY(-12px);filter:drop-shadow(0 8px 14px rgba(127,194,155,.45))}
.tube.done{filter:drop-shadow(0 0 6px rgba(127,194,155,.55))}
.tube.hint{filter:drop-shadow(0 0 7px rgba(212,179,106,.85))}
.tube.shake{animation:tubeshake .32s}
@keyframes tubeshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.slot .tag{font-family:ui-monospace,"SF Mono",monospace;font-size:10px;color:var(--ink-4);line-height:1}
.slot.done .tag{color:var(--accent)}
.parhint{width:100%;text-align:center;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.sfxbtn{min-width:64px;padding:7px 14px;border-radius:9px;border:1px solid var(--edge);
  background:var(--surface);color:var(--accent);font-size:14px;font-weight:600;cursor:pointer}
.sfxbtn.off{color:var(--ink-3)}
.parline{margin:-4px 0 12px;font-size:12px;color:var(--accent);text-align:center}
.tool.dim{opacity:.35}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none}
[hidden]{display:none!important}
html,body{margin:0; height:100%}
body{
  background:var(--canvas); color:var(--ink);
  font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;
  display:flex; flex-direction:column; align-items:center;
  padding:10px 12px calc(16px + env(safe-area-inset-bottom)); gap:10px;
  width:100%; max-width:480px; margin:0 auto; overflow-x:hidden;
}
button{font:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer}
.mono{font-family:ui-monospace,"SF Mono",Consolas,"Noto Sans Mono CJK SC",monospace; font-variant-numeric:tabular-nums}
/* ---------- 首页 ---------- */
.home{width:100%; display:flex; flex-direction:column; gap:14px; padding-top:26px}
.home .logo{text-align:center; font-size:30px; font-weight:700; letter-spacing:.08em}
.home .logo em{font-style:normal; color:var(--accent); display:block; font-size:13px; letter-spacing:.3em; margin-top:4px; color:var(--ink-3)}
.energy{
  background:var(--surface); border:1px solid var(--edge); border-radius:10px;
  padding:12px 16px; display:flex; align-items:center; gap:12px;
}
.energy .icon{font-size:20px}
.energy .info{flex:1}
.energy .val{font-weight:700; font-size:16px}
.energy .val .max{color:var(--ink-4); font-weight:400}
.energy .sub{font-size:11px; color:var(--ink-3)}
.energy .bar{height:5px; background:var(--elevated); border-radius:3px; margin-top:6px; overflow:hidden}
.energy .bar i{display:block; height:100%; background:var(--accent); border-radius:3px; transition:width .3s}
.bigbtn{
  width:100%; background:var(--accent); color:var(--canvas); border-radius:12px;
  padding:16px; font-size:18px; font-weight:700; text-align:center;
}
.bigbtn small{display:block; font-size:11px; font-weight:400; opacity:.75; margin-top:2px}
.homebtn{
  width:100%; background:var(--surface); border:1px solid var(--edge); border-radius:10px;
  padding:12px 16px; font-size:14px; color:var(--ink-2); display:flex; justify-content:space-between; align-items:center;
}
.homebtn b{color:var(--podium)}
/* ---------- 每周活动(issue #30) ---------- */
.eventbtn{
  position:relative; width:100%; background:linear-gradient(135deg,var(--surface),var(--cell-same));
  border:1px solid var(--accent); border-radius:10px; padding:13px 16px; font-size:14px; color:var(--ink);
  display:flex; justify-content:space-between; align-items:center; gap:10px;
}
.eventbtn .left{display:flex; align-items:center; gap:10px; text-align:left}
.eventbtn .ic{font-size:20px}
.eventbtn .t b{display:block; font-size:15px; color:var(--accent)}
.eventbtn .t span{font-size:11px; color:var(--ink-3)}
.eventbtn .frag{font-size:12px; color:var(--podium); font-weight:700; white-space:nowrap}
.eventbtn .badge{position:absolute; top:-7px; right:-4px; background:var(--bad); color:#fff; font-size:10px; font-weight:700; border-radius:8px; padding:2px 7px; letter-spacing:.05em}
.weekly{width:100%; display:flex; flex-direction:column; gap:12px; padding-top:4px}
.weekly .topbar2{display:flex; align-items:center; justify-content:space-between; font-size:13px; color:var(--ink-3)}
.weekly .topbar2 .wtitle{font-weight:700; font-size:15px; color:var(--ink); letter-spacing:.06em}
.weekly .topbar2 .wtitle em{font-style:normal; color:var(--accent)}
.weekly .topbar2 button{color:var(--accent); font-weight:600; font-size:13px; padding:4px 2px}
.themecard{
  background:linear-gradient(160deg,#18241D 0%,#12281E 60%,#1B231D 100%);
  border:1px solid var(--edge-strong); border-radius:12px; padding:14px 16px;
  display:flex; align-items:center; gap:12px; position:relative; overflow:hidden;
}
.themecard .deco{position:absolute; right:-12px; top:-16px; opacity:.18; font-size:90px; line-height:1}
.themecard .t{flex:1}
/* 背景写死深色渐变,文字用固定浅色(不随明暗主题),否则浅色主题下不可读 */
.themecard .t b{font-size:19px; letter-spacing:.04em; color:#E7EDE8}
.themecard .t .sub{font-size:11px; color:#8CA093; margin-top:3px}
.themecard .cd{text-align:right}
.themecard .cd b{display:block; font-size:15px; color:#D2A05C}
.themecard .cd span{font-size:10px; color:#8CA093}
.themecard .deco{color:#E7EDE8}
.fragrow{background:var(--surface); border:1px solid var(--edge); border-radius:10px; padding:12px 16px}
.fragrow .line1{display:flex; justify-content:space-between; align-items:baseline}
.fragrow .line1 .lab{font-size:12px; color:var(--ink-3)}
.fragrow .line1 .num{font-size:22px; font-weight:700; color:var(--podium)}
.fragrow .line1 .num small{font-size:11px; color:var(--ink-3); font-weight:400}
.fragrow .carry{font-size:11px; color:var(--ok); margin-top:2px}
.track{margin-top:10px}
.track .bar{position:relative; height:8px; background:var(--elevated); border-radius:4px}
.track .bar i{position:absolute; left:0; top:0; height:100%; background:linear-gradient(90deg,var(--accent),var(--podium)); border-radius:4px}
.track .ticks{display:flex; justify-content:space-between; font-size:10px; color:var(--ink-4); margin-top:5px}
.track .ticks b{color:var(--ink-2)}
.wkgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
.pic{background:var(--surface); border:1px solid var(--edge); border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:8px; position:relative}
.pic svg{width:100%; height:88px; border-radius:6px; background:var(--elevated); display:block}
.pic .cap{display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--ink-3); gap:6px}
.pic .cap b{color:var(--ink-2); font-size:12px; white-space:nowrap}
.pic .tag{font-size:10px; font-weight:700; border-radius:4px; padding:2px 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pic.open{border-color:var(--accent)}
.pic.open .tag{background:var(--cell-same); color:var(--ok)}
.pic.cur{border-color:var(--podium)}
.pic.cur .tag{background:#2F281C; color:var(--warn)}
.pic.lock svg{filter:grayscale(1) brightness(.55)}
.pic.lock .tag{background:var(--elevated); color:var(--ink-4)}
.pic.lock .lockov{position:absolute; inset:10px 10px auto 10px; height:88px; border-radius:6px; background:var(--overlay); display:flex; align-items:center; justify-content:center; font-size:22px}
.pic .prog{height:4px; background:var(--elevated); border-radius:2px; overflow:hidden}
.pic .prog i{display:block; height:100%; background:var(--warn)}
.grand{border:1px dashed var(--podium); border-radius:12px; background:var(--surface); padding:13px 16px; display:flex; align-items:center; gap:12px}
.grand .ic{font-size:26px}
.grand .t{flex:1}
.grand .t b{font-size:14px; color:var(--podium)}
.grand .t div{font-size:11px; color:var(--ink-3); margin-top:2px}
.grand .st{font-size:11px; color:var(--ink-4); border:1px solid var(--edge); border-radius:6px; padding:4px 8px; white-space:nowrap}
.grand.done .st{color:var(--ok); border-color:var(--accent)}
.wkadbar{width:100%; border:1px dashed var(--edge-strong); border-radius:10px; padding:11px 14px; display:flex; align-items:center; gap:10px; background:var(--surface); font-size:13px; color:var(--ink-2)}
.wkadbar .adtag{background:var(--podium); color:var(--canvas); font-size:10px; font-weight:700; border-radius:4px; padding:2px 6px; letter-spacing:.04em; white-space:nowrap}
.wkadbar b{color:var(--accent)}
.wknote{font-size:11px; color:var(--ink-4); display:flex; gap:8px; align-items:center; padding:0 4px}
.wknote .dot{color:var(--ink-3)}
.homestats{display:flex; gap:10px}
.homestats .st{flex:1; background:var(--surface); border:1px solid var(--edge); border-radius:10px; padding:10px 12px; text-align:center}
.homestats .st b{display:block; font-size:20px; color:var(--accent)}
.homestats .st span{font-size:11px; color:var(--ink-3)}
.langrow{display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--edge); border-radius:10px; padding:10px 12px}
.langrow label{font-size:13px; color:var(--ink-3)}
.langrow select{background:var(--elevated); color:var(--ink); border:1px solid var(--edge); border-radius:6px; padding:6px 10px; font-size:14px}
.profilerow{width:100%; display:flex; align-items:center; gap:12px; text-align:left; background:var(--surface); border:1px solid var(--edge); border-radius:10px; padding:10px 12px}
.profilerow .avatar{width:34px; height:34px; flex:0 0 34px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:var(--elevated); color:var(--accent); font-size:15px; font-weight:700}
.profilerow .profileinfo{min-width:0; flex:1}
.profilerow .profilelabel{display:block; font-size:11px; color:var(--ink-3)}
.profilerow .profilename{display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink); font-size:14px; font-weight:600}
.profilerow .profilesource{color:var(--ink-4); font-size:11px; white-space:nowrap}
/* ---------- 排行榜 ---------- */
.lb{width:100%; display:flex; flex-direction:column; gap:10px; padding-top:8px}
.lb h2{margin:0; font-size:18px; display:flex; justify-content:space-between; align-items:center}
.lb h2 button{color:var(--accent); font-size:13px; font-weight:600}
.lbrow{
  display:flex; align-items:center; gap:12px; background:var(--surface);
  border:1px solid var(--edge); border-radius:8px; padding:9px 14px; font-size:14px;
}
.lbrow.me{border-color:var(--accent); background:var(--cell-same)}
.lbrow .rank{width:26px; color:var(--ink-3); font-weight:700}
.lbrow .rank.top{color:var(--podium)}
.lbrow .name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.lbrow .lv{color:var(--accent); font-weight:700}
.lbnote{font-size:11px; color:var(--ink-4); text-align:center}
/* issue #24:本国/全球 Tab */
.lbtabs{display:flex; gap:8px}
.lbtab{
  flex:1; padding:7px 0; font-size:13px; font-weight:600; border-radius:8px;
  border:1px solid var(--edge); background:var(--surface); color:var(--ink-3);
}
.lbtab.on{border-color:var(--accent); color:var(--accent); background:var(--cell-same)}
/* issue #25:分享按钮 */
.lbshare{
  padding:9px 0; font-size:14px; font-weight:600; border-radius:8px;
  border:1px solid var(--accent); color:var(--accent); background:transparent;
}
/* ---------- 游戏 ---------- */
.gamewrap{width:100%; flex:1; display:flex; flex-direction:column; gap:10px; align-items:center}
.topbar{width:100%; display:flex; align-items:center; justify-content:space-between; font-size:13px; color:var(--ink-3)}
.topbar .title{font-weight:700; font-size:15px; color:var(--ink); letter-spacing:.06em}
.topbar .title em{font-style:normal; color:var(--accent)}
.topbar .backbtn{color:var(--accent); font-weight:600; font-size:13px; padding:4px 2px}
.hud{width:100%; display:flex; justify-content:space-between; align-items:baseline; font-size:12px; color:var(--ink-3)}
.hud b{color:var(--ink-2); font-weight:600; font-size:13px}
.hud .err b{color:var(--ink-2)}  /* 倒水版这一格是步数,不是错误数,不用红色 */
.hud .timer b{color:var(--ink-2)}
.hud .timer.low b{color:var(--bad)}
.lvl{color:var(--podium); font-weight:600}
.board{
  width:100%; aspect-ratio:1; background:var(--surface);
  border:2px solid var(--edge-strong); border-radius:8px;
  display:grid; grid-template-columns:repeat(9,minmax(0,1fr)); grid-template-rows:repeat(9,minmax(0,1fr));
  overflow:hidden; touch-action:manipulation;
}
.c{
  display:flex; align-items:center; justify-content:center;
  font-family:ui-monospace,"SF Mono",Consolas,"Noto Sans Mono CJK SC",monospace;
  font-variant-numeric:tabular-nums; font-size:clamp(16px,5.2vw,24px);
  border-right:1px solid var(--edge); border-bottom:1px solid var(--edge);
  color:var(--ink); position:relative; padding:0;
}
.c:nth-child(9n){border-right:none}
.c.b3r{border-right:2px solid var(--edge-strong)}
.c.b3b{border-bottom:2px solid var(--edge-strong)}
.c.user{color:var(--accent)}
.c.bad{color:var(--bad); background:var(--chip-bad)}
.c.same{background:var(--cell-same)}
.c.peer{background:var(--cell-peer)}
.c.sel{background:var(--cell-sel); outline:2px solid var(--accent); outline-offset:-2px}
.tools{width:100%; display:flex; gap:8px}
.tool{
  flex:1; background:var(--surface); border:1px solid var(--edge); border-radius:8px;
  padding:7px 4px 6px; text-align:center; font-size:11px; color:var(--ink-3);
}
.tool .ic{display:block; font-size:16px; color:var(--ink-2); font-family:ui-monospace,Consolas,monospace; line-height:1.2}
.tool .cnt{color:var(--podium); font-weight:700}
.tool.ad .cnt{color:var(--warn)}
.tool:disabled{opacity:.4}
.pad{width:100%; display:grid; grid-template-columns:repeat(9,minmax(0,1fr)); gap:6px}
.key{
  background:var(--elevated); border:1px solid var(--edge); border-radius:8px;
  aspect-ratio:.78; display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-family:ui-monospace,"SF Mono",Consolas,monospace; font-size:clamp(16px,5vw,22px); color:var(--ink);
}
.key small{font-size:9px; color:var(--ink-4); font-variant-numeric:tabular-nums}
.key.dim{opacity:.35}
/* ---------- 弹窗 / toast ---------- */
.overlay{
  position:fixed; inset:0; background:var(--overlay); display:flex; align-items:center; justify-content:center;
  padding:24px; z-index:10;
}
.dialog{
  background:var(--surface); border:1px solid var(--edge-strong); border-radius:12px;
  padding:22px 20px; width:100%; max-width:320px; display:flex; flex-direction:column; gap:14px; text-align:center;
}
.dialog h2{margin:0; font-size:18px}
.dialog p{margin:0; font-size:13px; color:var(--ink-2); line-height:1.6}
.dialog .stats{display:flex; justify-content:center; gap:18px; font-size:12px; color:var(--ink-3)}
.dialog .stats b{display:block; font-size:18px; color:var(--accent)}
.dialog input{width:100%; background:var(--elevated); color:var(--ink); border:1px solid var(--edge-strong); border-radius:8px; padding:11px 12px; font-size:16px; outline:none; user-select:text}
.dialog input:focus{border-color:var(--accent)}
.btn{
  border-radius:8px; padding:11px 14px; font-size:14px; font-weight:600;
  background:var(--accent); color:var(--canvas);
}
.btn.ghost{background:var(--elevated); color:var(--ink-2); border:1px solid var(--edge)}
.btn.ad{background:var(--podium); color:var(--canvas)}
.toast{
  position:fixed; bottom:calc(24px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
  background:var(--elevated); border:1px solid var(--edge-strong); color:var(--ink);
  border-radius:8px; padding:8px 16px; font-size:13px; z-index:20; white-space:nowrap;
  opacity:0; transition:opacity .2s; pointer-events:none;
}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>

/* ====================== 数独引擎(与 engine.js 同源,内联;倒水版已不再调用,保留以免动到旧测试) ====================== */
var SudokuEngine=(function(){
  'use strict';
  const DIFFICULTY={
    beginner:{givens:[40,47],label:'新手'},
    easy:{givens:[34,39],label:'简单'},
    medium:{givens:[28,33],label:'中等'},
    hard:{givens:[23,27],label:'困难'},
  };
  function rng(seed){let a=seed>>>0;return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
  function shuffled(arr,rand){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  function conflicts(g,idx,v){const r=Math.floor(idx/9),c=idx%9,br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;
    for(let i=0;i<9;i++){
      if(g[r*9+i]===v&&r*9+i!==idx)return true;
      if(g[i*9+c]===v&&i*9+c!==idx)return true;
      const bi=(br+Math.floor(i/3))*9+bc+(i%3);
      if(g[bi]===v&&bi!==idx)return true;
    }return false;}
  function search(g,digits,count,limit){
    let best=-1,bestCands=null;
    for(let i=0;i<81;i++){
      if(g[i]!==0)continue;
      const cands=[];
      for(const v of digits)if(!conflicts(g,i,v))cands.push(v);
      if(best===-1||cands.length<bestCands.length){best=i;bestCands=cands;}
      if(bestCands.length===0)return count.n;
      if(bestCands.length===1)break;
    }
    if(best===-1){count.n++;if(!count.first)count.first=g.slice();return count.n;}
    for(const v of bestCands){g[best]=v;search(g,digits,count,limit);g[best]=0;if(count.n>=limit)return count.n;}
    return count.n;}
  const D19=[1,2,3,4,5,6,7,8,9];
  function validGivens(grid){for(let i=0;i<81;i++)if(grid[i]!==0&&conflicts(grid,i,grid[i]))return false;return true;}
  function solve(grid){const g=grid.slice();if(!validGivens(g))return null;const count={n:0,first:null};search(g,D19,count,1);return count.first;}
  function countSolutions(grid,limit){const g=grid.slice();if(!validGivens(g))return 0;const count={n:0,first:null};return search(g,D19,count,limit||2);}
  function generate(diff,seed){
    const spec=DIFFICULTY[diff];if(!spec)throw new Error('unknown difficulty: '+diff);
    const rand=rng(seed===undefined?(Date.now()&0x7fffffff):seed);
    const full=new Array(81).fill(0);
    const digits=shuffled(D19,rand);
    const count={n:0,first:null};
    search(full,digits,count,1);
    const solution=count.first;
    const lo=spec.givens[0],hi=spec.givens[1];
    const target=lo+Math.floor(rand()*(hi-lo+1));
    const puzzle=solution.slice();
    let givens=81;
    const order=shuffled(Array.from({length:41},(_,i)=>i),rand);
    for(const i of order){
      if(givens<=target)break;
      const j=80-i;
      const holes=i===j?[i]:[i,j];
      const saved=holes.map(h=>puzzle[h]);
      if(saved.every(v=>v===0))continue;
      if(givens-holes.length<lo)continue;
      holes.forEach(h=>{puzzle[h]=0;});
      if(countSolutions(puzzle,2)!==1){holes.forEach((h,k)=>{puzzle[h]=saved[k];});}
      else{givens-=holes.filter((_,k)=>saved[k]!==0).length;}
    }
    if(givens>hi){
      const singles=shuffled(Array.from({length:81},(_,i)=>i),rand);
      for(const i of singles){
        if(givens<=target)break;
        if(puzzle[i]===0)continue;
        const v=puzzle[i];puzzle[i]=0;
        if(countSolutions(puzzle,2)!==1)puzzle[i]=v;else givens--;
      }
    }
    return{puzzle,solution,givens,difficulty:diff};
  }
  return{solve,countSolutions,generate,DIFFICULTY};
})();

/* ====================== 激励循环纯函数(与 reward.js 同源,内联) ====================== */
var Reward=(function(){
  'use strict';
  const E_MAX=120, E_COST=15, E_TICK=60000, E_AD=60;
  function restore(energy,lastTs,now){
    if(energy>=E_MAX)return{energy,lastTs:now}; // 超额保留:>=120 不自然恢复、不回收(issue #7)
    if(now<lastTs)return{energy,lastTs:now};
    const gained=Math.floor((now-lastTs)/E_TICK);
    const newEnergy=Math.min(E_MAX,energy+gained);
    return{energy:newEnergy,lastTs:newEnergy>=E_MAX?now:lastTs+gained*E_TICK};
  }
  function levelDiff(level){
    if(level<=20)return'beginner';
    if(level<=60)return'easy';
    if(level<=150)return'medium';
    return'hard';
  }
  function levelSeed(level){return(Math.imul(level,2654435761)^0x5D0C0)>>>1;}
  return{restore,levelDiff,levelSeed,E_MAX,E_COST,E_TICK,E_AD};
})();

/* ====================== 兜底身份解析(与 tgid.js 同源,内联;issue #20) ====================== */
const TgId = (function () {
  'use strict';
  function parseTgWebAppData(hashOrSearch) {
    if (!hashOrSearch || typeof hashOrSearch !== 'string') return null;
    const s = hashOrSearch.replace(/^[#?]/, '');
    let raw = null;
    const parts = s.split('&');
    for (let i = 0; i < parts.length; i++) {
      if (parts[i].indexOf('tgWebAppData=') === 0) { raw = parts[i].slice(13); break; }
    }
    if (!raw) return null;
    let inner;
    try { inner = decodeURIComponent(raw); } catch (e) { return null; }
    let userStr = null;
    const kv = inner.split('&');
    for (let i = 0; i < kv.length; i++) {
      if (kv[i].indexOf('user=') === 0) { userStr = kv[i].slice(5); break; }
    }
    if (!userStr) return null;
    let u;
    try { u = JSON.parse(decodeURIComponent(userStr)); } catch (e) { return null; }
    if (!u || typeof u !== 'object' || u.id == null) return null;
    return {
      id: String(u.id),
      first_name: u.first_name || '',
      last_name: u.last_name || '',
      username: u.username || '',
      language_code: u.language_code || '',
    };
  }
  function displayName(u) {
    if (!u) return '';
    return ((u.first_name || '') + ' ' + (u.last_name || '')).trim() || u.username || '';
  }
  return { parseTgWebAppData, displayName };
})();

/* issue #20:SDK 不可用时的兜底身份。启动即解析 hash 并存内存;
   解析成功持久化一份 sessionStorage 镜像(刷新后 hash 可能被清,同会话可恢复;
   跨会话不留,避免串号——取舍见 issue #20 评论)。SDK 可用时以 SDK 为准。 */
const TGID_KEY = 'sudoku_tgid';
let TG_USER = TgId.parseTgWebAppData(location.hash);
try {
  if (TG_USER) window.sessionStorage.setItem(TGID_KEY, JSON.stringify(TG_USER));

} catch (e) {}
/* 统一身份取值:SDK 可用取 SDK → 否则 hash 兜底 → 都无 null */
function tgUser() {
  return (IN_TG && TG.initDataUnsafe && TG.initDataUnsafe.user) || TG_USER || null;
}

/* 语言检测(与 i18n.js 同源):?lang= 调试参数(最高优先) → Telegram language_code → navigator.language → 默认 en;zh* 归 zh */
function detectLang(search, tgCode, navLang) {
  const m = /[?&]lang=([A-Za-z-]+)/.exec(search || '');
  const cand = (m && m[1]) || tgCode || navLang || 'en';
  return /^zh/i.test(cand) ? 'zh' : 'en';
}
/* issue #18:已保存语言优先层(与 i18n.js resolveLang 同源)。
   优先级:?lang=(调试,仅本次会话生效,不写持久化) → saved(手动选择,持久化) → 自动检测。
   saved 仅接受字典已有语言码,非法值忽略。 */
function resolveLang(search, saved, tgCode, navLang) {
  const m = /[?&]lang=([A-Za-z-]+)/.exec(search || '');
  if (m) return /^zh/i.test(m[1]) ? 'zh' : 'en';
  if (saved && I18N[saved]) return saved;
  return detectLang('', tgCode, navLang);
}

/* ====================== 局间插屏纯函数(与 idlead.js 同源,内联;issue #22) ====================== */
const IdleAd = (function () {
  'use strict';
  const DELAYS = [null, 5000, 10000, 20000];
  // rand ∈ [0,1);非法输入一律安全回退 null(不弹)
  function pickInterstitialDelay(rand) {
    if (typeof rand !== 'number' || !isFinite(rand) || rand < 0 || rand >= 1) return null;
    return DELAYS[Math.floor(rand * DELAYS.length)];
  }
  return { DELAYS, pickInterstitialDelay };
})();

/* 局间插屏控制器(issue #22):进入结算态随机四态(不弹/空闲5s/10s/20s后弹);
   期间任何交互(pointerdown/keydown,捕获层)立即取消并清计时器;
   弹出走现有 Monetag 展示路径,纯曝光不发奖励;同一局最多一次(含抽中"不弹"),重进页面不补弹。 */
const InterAd = {
  timer: null, onAct: null, done: false,
  arm() {
    this.cancel();
    if (this.done) return;
    this.done = true; // 每局只抽一次签
    const dbg = location.hash.match(/adtest=(\d+)/); // 调试入口:#adtest=毫秒 强制定时弹(截图/验链路用)
    const delay = dbg ? +dbg[1] : IdleAd.pickInterstitialDelay(Math.random());
    if (delay == null) return; // 本局不弹
    this.onAct = () => this.cancel();
    document.addEventListener('pointerdown', this.onAct, true);
    document.addEventListener('keydown', this.onAct, true);
    this.timer = setTimeout(() => {
      this.cancel();
      showRewardedAd().catch(() => {}); // 纯曝光:无奖励回调,广告关后结算按钮原位可用
    }, delay);
  },
  cancel() {
    if (this.timer) { clearTimeout(this.timer); this.timer = null; }
    if (this.onAct) {
      document.removeEventListener('pointerdown', this.onAct, true);
      document.removeEventListener('keydown', this.onAct, true);
      this.onAct = null;
    }
  },
  reset() { this.cancel(); this.done = false; }
};

/* ====================== 每周活动纯函数(与 weekly.js 同源,内联;issue #30) ======================
   周界取舍:UTC 周,周一 00:00 UTC 为界(周日 24:00 UTC 重置,与排行榜 todayUTC 同口径) */
const Weekly = (function () {
  'use strict';
  const DAY = 86400000;
  const WEEK = 7 * DAY;
  const GOAL = 600;
  const THRESHOLDS = [100, 200, 300, 400, 500, 600];
  const FRAG_WIN = 10;
  const FRAG_AD = 10;
  const GRAND = { energy: 60, hints: 5 };
  function weekIndex(now) { return Math.floor((Math.floor(now / DAY) + 3) / 7); }
  function weekKey(now) { return 'w' + weekIndex(now); }
  function weekEnd(now) { return (weekIndex(now) + 1) * WEEK - 3 * DAY; }
  const THEMES = [
    { zh: { name: '星空周', pics: ['晓星', '孤星', '行星环', '彗星', '星云涡', '星座图'] },
      en: { name: 'Starry Week', pics: ['Dawn Star', 'Lone Star', 'Ringed Planet', 'Comet', 'Nebula', 'Constellation'] },
      c1: '#D4B36A', c2: '#7FC29B', bg: '#101820' },
    { zh: { name: '深海周', pics: ['珍珠', '水母', '游鱼', '海螺', '暗流', '灯塔'] },
      en: { name: 'Deep Sea Week', pics: ['Pearl', 'Jellyfish', 'Fish', 'Conch', 'Undertow', 'Lighthouse'] },
      c1: '#7FB8C2', c2: '#7FC29B', bg: '#0E1A20' },
    { zh: { name: '森林周', pics: ['嫩芽', '孤木', '年轮', '飞鸟', '林间光', '山丘'] },
      en: { name: 'Forest Week', pics: ['Sprout', 'Lone Tree', 'Rings', 'Bird', 'Sunbeam', 'Hills'] },
      c1: '#8FC27F', c2: '#D4B36A', bg: '#121D14' },
    { zh: { name: '灯火周', pics: ['烛光', '灯笼', '街灯', '篝火', '烟花', '灯河'] },
      en: { name: 'Lantern Week', pics: ['Candle', 'Lantern', 'Streetlamp', 'Bonfire', 'Fireworks', 'River of Light'] },
      c1: '#D2A05C', c2: '#DE9A70', bg: '#1C1410' },
  ];
  function themeFor(now) { return THEMES[weekIndex(now) % THEMES.length]; }
  function unlockedCount(frags) {
    let n = 0;
    for (let i = 0; i < THRESHOLDS.length; i++) if (frags >= THRESHOLDS[i]) n++;
    return n;
  }
  function newlyUnlocked(before, after) {
    const out = [];
    for (let i = 0; i < THRESHOLDS.length; i++) if (before < THRESHOLDS[i] && after >= THRESHOLDS[i]) out.push(i);
    return out;
  }
  function rollReward(randType, randAmt) {
    const ok = (r) => typeof r === 'number' && isFinite(r) && r >= 0 && r < 1;
    const rt = ok(randType) ? randType : 0;
    const ra = ok(randAmt) ? randAmt : 0;
    if (rt < 0.5) return { type: 'energy', n: 10 + Math.floor(ra * 51) };
    return { type: 'hints', n: 1 + Math.floor(ra * 3) };
  }
  function carry(frags) { return Math.max(0, (frags | 0) - GOAL); }
  function blank(wk) { return { week: wk, frags: 0, carried: 0, claimed: [false, false, false, false, false, false], grand: false }; }
  function normalize(state, wk) {
    if (state && state.week === wk && Array.isArray(state.claimed) && state.claimed.length === 6) return state;
    const b = blank(wk);
    if (state && typeof state.frags === 'number' && state.week !== wk) {
      b.carried = carry(state.frags);
      b.frags = b.carried;
    }
    return b;
  }
  return { DAY, WEEK, GOAL, THRESHOLDS, FRAG_WIN, FRAG_AD, GRAND, THEMES,
    weekIndex, weekKey, weekEnd, themeFor, unlockedCount, newlyUnlocked, rollReward, carry, blank, normalize };
})();

/* 每周活动控制器(issue #30):状态持久化 sudoku_weekly(CloudStorage 优先 + localStorage 镜像,
   走 Store 同一通道);内存权威副本 + 快照串行 flush,与 Profile 同模式。
   奖励发放:体力走 Profile(可超 120 持久保留,issue #7),提示走 Profile.hints。 */
const WeeklyCtl = {
  key: 'sudoku_weekly',
  state: null,
  flushChain: Promise.resolve(),
  load(cb) {
    Store.get(this.key, (v) => {
      let s = null;
      if (v) { try { s = JSON.parse(v); } catch (e) {} }
      this.state = Weekly.normalize(s, Weekly.weekKey(Date.now()));
      if (this.state !== s) this.flush();
      cb && cb();
    });
  },
  flush() {
    const snapshot = JSON.stringify(this.state);
    this.flushChain = this.flushChain.then(() => { Store.set(this.key, snapshot); });
  },
  // 周对账:跨周则重置+结转(渲染/加碎片前都先走这里)
  settle() {
    const wk = Weekly.weekKey(Date.now());
    const n = Weekly.normalize(this.state, wk);
    if (n !== this.state) { this.state = n; this.flush(); }
  },
  // 加碎片 + 发放解锁奖励(幂等:claimed/grand 标记);返回 toast 文案数组
  addFrags(n, randFn) {
    this.settle();
    const st = this.state;
    const rnd = randFn || Math.random;
    const before = st.frags;
    st.frags += n;
    const msgs = [];
    for (const i of Weekly.newlyUnlocked(before, st.frags)) {
      if (st.claimed[i]) continue;
      const r = Weekly.rollReward(rnd(), rnd());
      st.claimed[i] = true;
      if (r.type === 'energy') Profile.mutate((s) => { s.energy += r.n; });
      else Profile.mutate((s) => { s.hints += r.n; });
      st['r' + i] = r; // 记录已领奖励,活动页展示用
      const rTxt = t(r.type === 'energy' ? 'wkRewardEnergy' : 'wkRewardHints', { n: r.n });
      msgs.push(t('wkUnlockToast', { pic: themePics()[i], r: rTxt }));
    }
    if (st.frags >= Weekly.GOAL && !st.grand) {
      st.grand = true;
      Profile.mutate((s) => { s.energy += Weekly.GRAND.energy; s.hints += Weekly.GRAND.hints; });
      msgs.push(t('wkGrandToast', { e: Weekly.GRAND.energy, h: Weekly.GRAND.hints }));
    }
    this.flush();
    return msgs;
  },
};
function themePics() {
  const th = Weekly.themeFor(Date.now());
  return (th[LANG] || th.en).pics;
}

/* ====================== 终身档案:内存权威副本 + 串行 flush(Spike S1 验证模式) ====================== */
const Profile = {
  key: 'sudoku_profile',
  state: null,            // { energy, lastTs, wins, hints, alias, localId }
  flushChain: Promise.resolve(),
  load(cb) {
    Store.get(this.key, (v) => {
      let s = null;
      if (v) { try { s = JSON.parse(v); } catch (e) {} }
      this.state = Object.assign({ energy: Reward.E_MAX, lastTs: Date.now(), wins: 0, hints: 3, alias: '', localId: '', sfx: true }, s || {});
      // 非 Telegram 环境:稳定化名 + 每浏览器唯一 ID,生成一次后持久保留。
      if (!this.state.alias || !this.state.localId) this.mutate((st) => {
        if (!st.alias) st.alias = t('alias') + Math.floor(1000 + Math.random() * 9000);
        if (!st.localId) st.localId = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12);
      });
      this.settle();
      cb();
    });
  },
  // 所有修改同步走内存副本,快照串行异步落盘 — 不存在读改写竞态窗口
  mutate(fn) {
    fn(this.state);
    const snapshot = JSON.stringify(this.state);
    this.flushChain = this.flushChain.then(() => { Store.set(this.key, snapshot); });
  },
  // 体力离线/在线结算
  settle() {
    const r = Reward.restore(this.state.energy, this.state.lastTs, Date.now());
    if (r.energy !== this.state.energy || r.lastTs !== this.state.lastTs) {
      this.mutate((s) => { s.energy = r.energy; s.lastTs = r.lastTs; });
    }
  },
};

/* 每日快照纯函数(与 lb.js 同源,内联;issue #11/#24/#25):UTC 日期;Top50 competition ranking;提交池随重算裁剪;
   country 字段与本国过滤(#24);分享文本组装(#25,模板走 I18N.shareTpl) */
const Lb = (function () {
  const TOP_N = 50;
  function todayUTC(now) { return new Date(now).toISOString().slice(0, 10); }
  function needsRebuild(board, today) {
    return !board || !Array.isArray(board.top) || board.date !== today;
  }
  function assignRanks(rows) {
    let rank = 0, prev = null;
    rows.forEach((p, i) => {
      if (p.level !== prev) { rank = i + 1; prev = p.level; }
      p.rank = rank;
    });
    return rows;
  }
  function normCountry(c) {
    const s = String(c || '').toUpperCase();
    return /^[A-Z]{2}$/.test(s) ? s : 'UN';
  }
  function detectCountry(tgCode, navLang) { // issue #27 起退役:不再参与决策,仅保留与 lb.js 同源
    for (const cand of [tgCode, navLang]) {
      const m = /^[A-Za-z]{2,3}[-_]([A-Za-z]{2})(?:[-_]|$)/.exec(String(cand || ''));
      if (m) return m[1].toUpperCase();
    }
    return 'UN';
  }
  function filterCountry(top, country) {
    const c = normCountry(country);
    const rows = (top || []).filter((p) => normCountry(p && p.country) === c)
      .map((p) => ({ id: p.id, name: p.name, level: p.level, country: normCountry(p.country) }));
    return assignRanks(rows);
  }
  function buildTop(players, today) {
    const rows = Object.entries(players || {})
      .map(([id, p]) => p && { id, name: String(p.name == null ? '' : p.name).slice(0, 16), level: Number(p.level), country: normCountry(p.country) })
      .filter((p) => p && p.name && Number.isFinite(p.level) && p.level > 0)
      .sort((a, b) => b.level - a.level || a.name.localeCompare(b.name))
      .slice(0, TOP_N);
    assignRanks(rows);
    return { date: today, top: rows };
  }
  function trimPlayers(players, top) {
    const keep = new Set(top.map((p) => p.id));
    const out = {};
    for (const id in players) if (keep.has(id)) out[id] = players[id];
    return out;
  }
  const SHARE_TPL = {
    zh: {
      head: '🧩 数独{scope}排行榜 · {date}',
      scopeLocal: '本国', scopeGlobal: '全球',
      row: '{medal} {name} · 第 {level} 关',
      mineRanked: '我的名次:第 {rank} 名(第 {level} 关)',
      mineUnranked: '我的成绩:第 {level} 关(尚未上榜)',
      empty: '榜单虚位以待,快来抢头名!',
      call: '来挑战我 👉 {url}',
    },
    en: {
      head: '🧩 Sudoku {scope} leaderboard · {date}',
      scopeLocal: 'national', scopeGlobal: 'global',
      row: '{medal} {name} · Lv {level}',
      mineRanked: 'My rank: #{rank} (Lv {level})',
      mineUnranked: 'My score: Lv {level} (not on board yet)',
      empty: 'The board is wide open — claim the top spot!',
      call: 'Beat me 👉 {url}',
    },
  };
  function fmtTpl(s, vars) { return s.replace(/\{(\w+)\}/g, (_, k) => (vars[k] != null ? vars[k] : '')); }
  function buildShareText(rows, my, lang, opts) {
    // opts.tpl 可传入 I18N 字典里的模板(sudoku.html 内联走字典;node 直测用内置同源模板)
    const T = (opts && opts.tpl) || SHARE_TPL[lang] || SHARE_TPL.en;
    const o = opts || {};
    const medals = ['🥇', '🥈', '🥉'];
    const lines = [fmtTpl(T.head, { scope: o.scope === 'global' ? T.scopeGlobal : T.scopeLocal, date: o.date || '' })];
    const top3 = (rows || []).slice(0, 3);
    if (top3.length === 0) lines.push(T.empty);
    else top3.forEach((p, i) => lines.push(fmtTpl(T.row, { medal: medals[i], name: p.name, level: p.level })));
    if (my && my.level > 0) {
      lines.push(my.rank ? fmtTpl(T.mineRanked, { rank: my.rank, level: my.level }) : fmtTpl(T.mineUnranked, { level: my.level }));
    }
    lines.push(fmtTpl(T.call, { url: o.url || 'https://t.me/sudoku2_bot/sudoku' }));
    return lines.join('\n');
  }
  return { TOP_N, todayUTC, needsRebuild, buildTop, trimPlayers, normCountry, detectCountry, filterCountry, buildShareText };
})();
/* 国家判定决策链纯函数(与 geo.js 同源,内联;issue #27):
   首次启动 IP 归属地判定,判不出记 'other';一经确认永久锁定,后续零 IP 请求。
   旧 language 推断(Lb.detectCountry,#24)退役,不再参与决策。 */
const Geo = (function () {
  const OTHER = 'other';
  const TIMEOUT_MS = 4000;
  const PROVIDERS = [
    { name: 'country.is', url: 'https://api.country.is/' },
    { name: 'ipwho.is', url: 'https://ipwho.is/' },
  ];
  function normCountry(c) {
    const s = String(c == null ? '' : c).trim().toUpperCase();
    return /^[A-Z]{2}$/.test(s) ? s : null;
  }
  function normSaved(v) {
    if (v == null) return null;
    const s = String(v).trim();
    if (s.toLowerCase() === OTHER) return OTHER;
    const c = normCountry(s);
    if (c === 'UN') return OTHER; // 旧 'UN' 桶合并为 other
    return c;
  }
  function parseCountryResponse(provider, json) {
    if (!json || typeof json !== 'object') return null;
    if (provider === 'country.is') return normCountry(json.country);
    if (provider === 'ipwho.is') {
      if (json.success === false) return null;
      return normCountry(json.country_code);
    }
    return null;
  }
  function resolveCountry(saved, fetchers) {
    const s = normSaved(saved);
    if (s) return Promise.resolve({ country: s, source: 'saved', requests: 0 });
    const list = (fetchers || []).slice();
    let requests = 0;
    function next(i) {
      if (i >= list.length) return Promise.resolve({ country: OTHER, source: 'fallback', requests });
      requests += 1;
      return Promise.resolve().then(() => list[i]()).then(
        (c) => {
          const n = normCountry(c);
          return n ? { country: n, source: 'ip', requests } : next(i + 1);
        },
        () => next(i + 1)
      );
    }
    return next(0);
  }
  return { OTHER, TIMEOUT_MS, PROVIDERS, normCountry, normSaved, parseCountryResponse, resolveCountry };
})();

/* issue #27:当前用户国家 = 已存值(永久锁定)|| 'other'(未确认期间按 other/全球 Tab 处理)。
   首屏同步读 localStorage 镜像(与 sudoku_lang 同模式),CloudStorage 权威值与首个 IP 判定在 boot() 里异步走。 */
const COUNTRY_KEY = 'sudoku_country';
let MY_COUNTRY = null;
try { MY_COUNTRY = Geo.normSaved(window.localStorage.getItem(COUNTRY_KEY)); } catch (e) {}
function myCountry() { return MY_COUNTRY || Geo.OTHER; }
// 单个提供方请求:HTTPS+CORS、4s 超时(AbortController)、静默失败(返回 null 走降级)
function geoFetchProvider(p) {
  return function () {
    const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = ctrl ? setTimeout(() => ctrl.abort(), Geo.TIMEOUT_MS) : null;
    return fetch(p.url, { signal: ctrl && ctrl.signal, headers: { Accept: 'application/json' } })
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then((j) => Geo.parseCountryResponse(p.name, j))
      .finally(() => { if (timer) clearTimeout(timer); });
  };
}
// 首次确认国家(boot 异步调用,绝不阻塞开局/渲染):已存值短路零请求;否则 IP 决策链,
// 结果(含 other)立即持久化并永久锁定,此后换网/换语言不再变。
function confirmCountryOnce(saved) {
  return Geo.resolveCountry(saved != null ? saved : MY_COUNTRY, Geo.PROVIDERS.map(geoFetchProvider))
    .then((r) => {
      MY_COUNTRY = r.country;
      if (r.source !== 'saved') Store.set(COUNTRY_KEY, r.country); // 首次确认落盘
      else { try { window.localStorage.setItem(COUNTRY_KEY, r.country); } catch (e) {} } // 云端已有:回写镜像(含 UN→other 迁移)
      return r.country;
    });
}
function lbFetch() {
  return fetch(LB_URL, { headers: { Accept: 'application/json' } })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((d) => (d && typeof d === 'object' && d.players) ? d : { players: {} });
}
function lbSubmit(level) {
  return lbFetch().then((d) => {
    const me = d.players[myId()];
    if (me && me.level >= level) return;
    // issue #24:提交带 country;读-改-写只覆盖自己一条,他人记录的 country 原样保留
    d.players[myId()] = { name: myName(), level, country: myCountry() };
    return fetch(LB_URL, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(d),
    });
  }).catch(() => {}); // 静默:榜不可用不阻塞游戏
}

function renderLb() {
  const list = document.getElementById('lbList');

  document.getElementById('lbTabLocal').className = 'lbtab' + (tab === 'local' ? ' on' : '');

  list.innerHTML = '<div class="lbnote">' + t('lbLoading') + '</div>';

  const row = (p, me, mineTag) => {
    const d = document.createElement('div');
    d.className = 'lbrow' + (me ? ' me' : '');
    d.innerHTML = '<span class="rank mono' + (p.rank && p.rank <= 3 ? ' top' : '') + '">' + (p.rank || '–') + '</span>' +

    d.querySelector('.name').textContent = p.name + (me ? (mineTag || t('lbMe')) : '');
    return d;
  };
  const finish = (board, offline) => {
    // issue #24:本国 Tab 按 country 过滤当日快照并国内重排名次;全球 Tab 用全量快照
    const rows = tab === 'local' ? Lb.filterCountry(board.top, myCountry()) : board.top;
    list.innerHTML = '';

    if (rows.length === 0) list.innerHTML = '<div class="lbnote">' + t('lbEmpty') + '</div>';
    // 自己不在当前榜内:底部附一行自己的成绩(无名次,次日进榜)
    if (my.level > 0 && !rows.some((p) => p.id === my.id)) {
      list.appendChild(row({ rank: 0, name: my.name, level: my.level }, true, ' · ' + t('lbMine')));
    }

    const mine = rows.find((p) => p.id === my.id);
    LB_VIEW = { rows, date: board.date, offline, myRank: mine ? mine.rank : 0, myLevel: my.level };
  };
  lbFetch().then((d) => {
    const today = Lb.todayUTC(Date.now());
    if (Lb.needsRebuild(d.board, today)) {
      // 当日首访者:从提交池重算 Top50 快照并裁剪提交池,写回失败静默(下个访问者会重试)
      d.board = Lb.buildTop(d.players, today);
      d.players = Lb.trimPlayers(d.players, d.board.top);
      fetch(LB_URL, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(d),
      }).catch(() => {});
    }
    finish(d.board, false);
  }).catch(() => finish(Lb.buildTop(
    FAKE_BOARD.reduce((m, p) => (m[p.id] = p, m), {}), Lb.todayUTC(Date.now())), true));
}

// Blender 渲出来的分层遮罩（单文件预览版会把这几行替换成内联 data URI）
var MASK_URLS = [
  './assets/tubes/mask-l1.png',
  './assets/tubes/mask-l2.png',
  './assets/tubes/mask-l3.png',
  './assets/tubes/mask-l4.png',
];
const tubesEl = document.getElementById('tubes');

// 点击委托:点一根管选中 → 再点另一根倒水(与数独的 selectCell/inputDigit 同位)
tubesEl.addEventListener('click', (ev) => {
  const el = ev.target.closest && ev.target.closest('[data-tube]');
  if (el) tapTube(Number(el.getAttribute('data-tube')));
});
function tubeEl(i) { return tubesEl.querySelector('[data-tube="' + i + '"]'); }

function tubeHtml(i) {
  const t = S.tubes[i], cap = S.capacity;
  const full = t.length > 0 && WaterEngine.isDone(t, cap);
  const cls = 'tube' + (i === S.sel ? ' sel' : '') + (full ? ' done' : '') + (t.length === 0 ? ' empty' : '');
  let layers = '';
  for (let k = 0; k < t.length; k++) {
    // 第 k+1 层用 Blender 渲的同名遮罩定位形状,颜色由关卡调色板给
    const m = MASK_URLS[Math.min(k, MASK_URLS.length - 1)];
    layers += '<div class="layer" style="background:' + WaterLevels.PALETTE[t[k]] +
      ';-webkit-mask-image:url(' + m + ');mask-image:url(' + m + ')" data-color="' + t[k] + '"></div>';
  }
  layers += '<div class="glass"></div>';
  const kinds = t.filter((c, k) => t.indexOf(c) === k).length;
  const tag = t.length === 0 ? '空管' : (full ? '完成' : kinds + ' 色');
  return '<div class="slot' + (full ? ' done' : '') + '">' +
    '<div class="' + cls + '" data-tube="' + i + '">' + layers + '</div>' +
    '<span class="tag">' + tag + '</span></div>';
}

function render() {
  if (!S.tubes) return;
  // 试管排布:≤5 根一行放下,再多就两行(每行最多 ceil(n/2) 根)
  const perRow = S.tubes.length <= 5 ? S.tubes.length : Math.ceil(S.tubes.length / 2);
  let html = '', idx = 0;
  while (idx < S.tubes.length) {
    html += '<div class="row">';
    for (let k = 0; k < perRow && idx < S.tubes.length; k++, idx++) html += tubeHtml(idx);
    html += '</div>';
  }
  if (S.par) html += '<div class="parhint">' + t('par', { n: S.par }) + '</div>';
  if (/[#&]sfxlog/.test(location.hash)) {
    html += '<pre id="sfxlog" style="font-size:9px;color:#888;white-space:pre-wrap">' +
      JSON.stringify(WaterAudio.stats()) + '</pre>';
  }
  tubesEl.innerHTML = html;
  document.getElementById('hudLv').textContent = S.level;
  document.getElementById('hudMoves').textContent = S.moves;
  document.getElementById('btnUndo').classList.toggle('dim', S.undo.length === 0);
  renderTimer();
  renderHintBtn();
}

/* ====================== 交互 ====================== */
function shakeTube(i) {
  const el = tubeEl(i);
  if (!el) return;
  el.classList.add('shake');
  setTimeout(() => el.classList.remove('shake'), 340);
}

// 交互规则:点非空管选中 → 点目标管倒水;非法只抖动不计步;倒完判胜;无路可走给出口
function tapTube(i) {
  if (S.finished || S.locked) return;
  if (S.sel === -1) {
    if (!S.tubes[i].length) { shakeTube(i); return; }   // 空管不能当源
    S.sel = i; haptic('light'); WaterAudio.play('pick'); render(); return;
  }
  if (S.sel === i) { S.sel = -1; render(); return; }    // 再点一次取消选中

  const res = WaterEngine.pour(S.tubes, S.sel, i, S.capacity);
  if (!res) { haptic('error'); WaterAudio.play('illegal'); shakeTube(i); return; }

  const from = S.sel;
  S.undo.push(JSON.stringify(S.tubes));
  S.locked = true; haptic('light');
  // 先播倒水动画(期间不重绘,否则动画节点会被 innerHTML 冲掉),播完再落盘新局面
  animatePour(from, i, res.color, res.amount, () => {
    S.tubes = res.state; S.moves++; S.sel = -1; S.locked = false;
    render();
    // 这一管刚好归位 → 给个上行三音（正反馈落在“完成”而不是每次倒水）
    if (WaterEngine.isDone(S.tubes[i], S.capacity) && S.tubes[i].length) WaterAudio.play('tubeDone');
    if (WaterEngine.isSolved(S.tubes, S.capacity)) return win();
    if (!WaterEngine.legalMoves(S.tubes, S.capacity).length) stuck();
  });
}

// 倾倒动画:源管抬起侧倾 → 水柱落进目标管 → 落点水花 → 源管回位
function animatePour(from, to, color, amount, done) {
  const src = tubeEl(from), dst = tubeEl(to);
  if (!src || !dst) { done(); return; }
  // 坐标一律用布局坐标(offsetLeft/Top,相对 .tubes)。
  // 不能用 getBoundingClientRect:截图/缩放场景下页面带 zoom 时它返回的是缩放后的视口坐标,
  // 而 transform 的 px 在缩放前的坐标系里,直接相减会把位移放大一倍——源管会飞出屏幕(实测踩过)。
  const ax = src.offsetLeft, ay = src.offsetTop, aw = src.offsetWidth, ah = src.offsetHeight;
  const bx = dst.offsetLeft, by = dst.offsetTop, bw = dst.offsetWidth, bh = dst.offsetHeight;
  const dir = (bx + bw / 2) >= (ax + aw / 2) ? 1 : -1;

  // 倾角要超过 90° 管口才真的朝下倒（58° 只是把管子斜过来，口还朝上，水等于凭空往上冒）。
  // 位移不再拍脑袋给经验值：按旋转矩阵反解 dx/dy，让「转完之后的管口」正好落在目标管口上方。
  const deg = 105 * dir;
  const th = deg * Math.PI / 180;
  const arm = ah * 0.88;                       // 管口到 transform-origin(50% 88%) 的距离
  const dx = (bx + bw / 2) - (ax + aw / 2) - arm * Math.sin(th);
  const dy = (by - 18) - ay - arm + arm * Math.cos(th);
  src.classList.add('pouring');
  src.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(' + deg + 'deg)';
  WaterAudio.play('pour', { amount: amount || 1 });   // 倒得越多，水声越久、气泡越多

  // 目标管当前液面(层数越多液面越高),水柱就落到这里
  const filled = S.tubes[to].length / S.capacity;
  // 水柱要从「倾斜后的管口」出来,不能凭空吊在半空:
  // 管口原本在 (中心, 顶边),绕 transform-origin(50% 88%) 转 θ 后按旋转矩阵求新位置。
  const mouthX = ax + aw / 2 + dx + arm * Math.sin(th);
  const mouthY = ay + arm + dy - arm * Math.cos(th);
  const surfaceY = by + bh * (0.07 + (1 - filled) * 0.86);
  const streamTop = Math.min(mouthY + 2, surfaceY - 14);
  const streamX = (mouthX + bx + bw / 2) / 2;  // 管口与落点之间,视觉上像顺着流下去
  const stream = document.createElement('div');
  stream.className = 'stream';
  stream.style.cssText = 'left:' + (streamX - 11) + 'px;top:' + streamTop +
    'px;height:' + Math.max(16, surfaceY - streamTop) + 'px;background:' + color;
  const splash = document.createElement('div');
  splash.className = 'splash';
  splash.style.cssText = 'left:' + (bx + bw / 2 - 15) + 'px;top:' + (surfaceY - 12) +
    'px;background:' + color;

  setTimeout(() => {
    tubesEl.appendChild(stream); tubesEl.appendChild(splash);
    WaterAudio.play('splash');
  }, 170);
  // 调试入口:#pourhold 把画面停在「正在倒」那一刻(headless 截图抓不到 CSS 动画帧,用它取证)
  if (/[#&]pourhold/.test(location.hash)) {
    setTimeout(() => { splash.style.animation = 'none'; splash.style.opacity = '.95'; }, 260);
    return;
  }
  setTimeout(() => {
    stream.remove(); splash.remove();
    src.style.transform = '';
    setTimeout(() => { src.classList.remove('pouring'); done(); }, 150);
  }, 470);
}

function win() {
  stopTimer(); S.finished = true; haptic('success'); WaterAudio.play('win');
  Profile.mutate((s) => { s.wins = Math.max(s.wins, S.level); });
 
  lbSubmit(Profile.state.wins);
  // issue #30:每盘胜利 +10 碎片(解锁/大奖 toast 延迟播,不遮结算对话框)
  const wkMsgs = WeeklyCtl.addFrags(Weekly.FRAG_WIN);
  setTimeout(() => toast(t('wkGotFrags', { n: Weekly.FRAG_WIN })), 700);
  wkMsgs.forEach((m, i) => setTimeout(() => toast(m), 700 + 1400 * (i + 1)));
  const used = elapsedTime();
  const parTxt = S.par ? (S.moves === S.par ? t('statBest') : t('statPar', { n: S.par })) : t('statNoPar');
  dialog(`<h2>${t('winTitle', { n: S.level })}</h2>
    <div class="stats">
      <span><b class="mono">${fmtTime(used)}</b>${t('statTime')}</span>
      <span><b class="mono">${S.moves}</b>${t('statMoves')}</span>
      <span><b class="mono">${Profile.state.wins}</b>${t('statWins')}</span>
    </div>
    <p class="parline">${parTxt}</p>
    ${IN_TG ? '<button class="btn ghost" id="dlgShare">' + t('share') + '</button>' : ''}
    <button class="btn" id="dlgNext">${t('next')}</button>
    <button class="btn ghost" id="dlgHome">${t('toHome')}</button>`);
  overlay.querySelector('#dlgNext').addEventListener('click', () => {
    closeDialog();
    document.getElementById('btnStart').click();
  });
  overlay.querySelector('#dlgHome').addEventListener('click', () => { closeDialog(); show('home'); });
  const sh = overlay.querySelector('#dlgShare');
  // issue #25:完局分享改走公共 shareText()(TG 深链/剪贴板降级同一路径)
  if (sh) sh.addEventListener('click', () => shareText(t('shareText', { n: Profile.state.wins }) + ' ' + GAME_URL));
  InterAd.arm(); // issue #22:结算态(胜利)空闲插屏
}

/* ====================== 开局与恢复 ====================== */
// 调试/回归用:按求解器最优解自动走完当前局(点击路径与真人一致,不走后门改状态)
function autoSolve() {
  const r = WaterEngine.solve(S.tubes, { capacity: S.capacity });
  if (!r.solvable) return;
  const seq = [];
  for (const mv of r.moves) seq.push(mv[0], mv[1]);
  // 必须等上一步倒水动画放完再点下一下:动画期间 tapTube 会被 S.locked 挡掉,
  // 固定间隔点击会被吞掉一次,后面整条序列错位(源/目标互换,于是出现非法移动)。
  (function step(n) {
    if (n >= seq.length) return;
    if (S.locked) { setTimeout(function () { step(n); }, 60); return; }
    tapTube(seq[n]);
    setTimeout(function () { step(n + 1); }, 240);
  })(0);
}

function newGame(level) {
  closeDialog();
  InterAd.reset(); // issue #22:新一局重置插屏抽签(每局最多一次)
  // 第 1-5 关内置固定盘面(全网同题);第 6 关起按关卡号确定性生成,
  // 生成时传入求解器做可解性验证——绝不把不可解的关发给玩家。
  const lv = WaterLevels.forLevel(level, WaterEngine.solve);
  S.tubes = lv.layout.map((t) => t.slice());
  S.start = lv.layout.map((t) => t.slice());   // 「重开」用的初始快照
  S.capacity = lv.capacity;
  S.par = lv.minMoves;                          // 生成关为 null,界面就不显示「最少 N 步」
  S.level = level; S.sel = -1;
  S.moves = 0; S.undo = []; S.locked = false;
  S.remain = TIME_LIMIT; S.timeBudget = TIME_LIMIT;
  S.finished = false;

  show('game'); startTimer(); render();
}

// 截图用:?zoom=2 整页放大(headless 出 2x 清晰图),不影响布局逻辑
(function () {
  const z = Number(new URLSearchParams(location.search).get('zoom'));
  if (z > 0) document.documentElement.style.zoom = String(z);
})();

function boot() {
  // issue #18:语言持久化对账。首屏已同步用 localStorage 镜像渲染(不闪);
  // 这里异步读 CloudStorage 权威值(跨设备迁移场景),不一致且无 ?lang= 覆盖时切换过去并回写镜像。
  Store.get(LANG_KEY, (v) => {
    if (v && I18N[v] && !/[?&]lang=/.test(location.search) && v !== LANG) {
      try { window.localStorage.setItem(LANG_KEY, v); } catch (e) {}
      applyLang(v);
    }
  });
  // issue #27:国家确认(异步静默,绝不阻塞开局/渲染)。CloudStorage 权威值优先(跨设备迁移),
  // 已存值(含 other/旧 UN)短路零 IP 请求;首次才走 IP 决策链并落盘永久锁定。
  Store.get(COUNTRY_KEY, (v) => {
    confirmCountryOnce(v != null ? v : MY_COUNTRY).catch(() => {});
  });
  Profile.load(() => {
    Store.del('sudoku_save'); // 清掉旧版遗留对局快照:刷新一律回首页(issue #6)
    WeeklyCtl.load(() => {
      // 调试入口:#wkfrags=N 造数(截图/自动化用,只改内存不发奖励)
      const wf = location.hash.match(/wkfrags=(\d+)/);
      if (wf) {
        WeeklyCtl.state.frags = +wf[1];
        for (let i = 0; i < 6; i++) if (WeeklyCtl.state.frags >= Weekly.THRESHOLDS[i]) {
          WeeklyCtl.state.claimed[i] = true;
          WeeklyCtl.state['r' + i] = i % 2 === 0 ? { type: 'energy', n: 35 } : { type: 'hints', n: 2 };
        }
        if (WeeklyCtl.state.frags >= Weekly.GOAL) WeeklyCtl.state.grand = true;
        const wc = location.hash.match(/wkcarry=(\d+)/);
        if (wc) WeeklyCtl.state.carried = +wc[1];
      }
      // 调试入口:#autostart 直接开一局(截图/自动化用,不扣体力)
      const auto = location.hash.match(/autostart(?:=(\d+))?/);
      if (auto) {
        newGame(auto[1] ? +auto[1] : Profile.state.wins + 1);
        // 调试入口:#wintest 立即进入胜利结算态(issue #22 插屏链路截图/自动化用)
        if (/[#&]wintest/.test(location.hash)) setTimeout(win, 0);
        // 调试入口:#autosolve 按求解器最优解自动走完本关(截图/回归验证用,正常玩法不受影响)
        if (/[#&]autosolve/.test(location.hash)) setTimeout(autoSolve, 300);
        return;
      }
      if (/#lb/.test(location.hash)) { show('lb'); renderLb(); return; } // 调试入口:#lb 直开排行榜(截图用)
      if (/#weekly/.test(location.hash)) { show('weekly'); return; } // 调试入口:#weekly 直开活动页(截图用)
      show('home');
    });
  });
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (!pages.game.hidden) { stopTimer(); } }
  else {
    Profile.settle();
    if (!pages.game.hidden && S.tubes && !S.finished && overlay.hidden) startTimer();
    if (!pages.home.hidden) renderHome();
  }
});
boot();
</script>
