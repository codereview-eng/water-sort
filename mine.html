<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- Monetag 站点所有权验证。必须留在原始 HTML 的 <head> 里：验证器抓页面源码、不执行 JS，
     且 Monetag 要求验证通过后不要移除（用于持续确认所有权）。
     注册的站点应是本游戏自己的子域 play-color-mines.run.ceo —— 不是 run.ceo
     （run.ceo 首页属于平台，我们改不了它的 <head>，也不该声称拥有整个平台）。 -->
<meta name="monetag" content="2f9e3e08b43a9d525e226b36d0a22368">
<title>Color Mines</title>
<style>
  :root{
    --bg:#141a24; --surface:#1e2735; --ink:#f2f5f9; --ink-2:#9fb0c3; --ink-3:#6b7a8d;
    --edge:rgba(255,255,255,.09); --accent:#ffb454; --ok:#43d17c; --bad:#ff5d5d;
    --cell-gap:3px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;
    height:100%; overflow-x:hidden; touch-action:manipulation; user-select:none; -webkit-user-select:none;}
  body{display:flex; flex-direction:column; align-items:center; min-height:100%;
    background:radial-gradient(circle at 50% -10%, #22304a 0%, #141a24 62%);}
  .wrap{width:100%; max-width:560px; padding:10px 12px calc(18px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:10px;}

  /* ---------- HUD ---------- */
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .title{font-weight:800; font-size:15px; letter-spacing:.04em;}
  .title em{font-style:normal; color:var(--accent);}
  .hud{display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--surface); border:1px solid var(--edge); border-radius:12px; padding:8px 12px;}
  .hud .box{display:flex; flex-direction:column; align-items:center; gap:2px; min-width:56px;}
  .hud .k{font-size:11px; color:var(--ink-2); letter-spacing:.06em;}
  .hud .v{font-size:15px; font-weight:800; font-variant-numeric:tabular-nums;}
  .hud .v.low{color:var(--bad); animation:blink 1s steps(2) infinite;}
  @keyframes blink{50%{opacity:.45}}
  .hearts b{color:var(--bad); letter-spacing:1px; font-size:14px;}
  .hearts b.off{color:#3a4657;}

  /* ---------- 棋盘 ---------- */
  .boardwrap{background:var(--surface); border:1px solid var(--edge); border-radius:14px; padding:8px;}
  .board{display:grid; gap:var(--cell-gap); width:100%; aspect-ratio:1; touch-action:none;}
  .cell{position:relative; container-type:inline-size; border-radius:6px; border:1px solid rgba(0,0,0,.28);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    font-size:32px; font-weight:800; overflow:hidden;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22), inset 0 -2px 0 rgba(0,0,0,.18);}
  .cell.small{font-size:20px; border-radius:5px;}
  .cell .mk{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:rgba(0,0,0,.62); text-shadow:0 1px 0 rgba(255,255,255,.25); pointer-events:none;}
  .cell .mk::before{font-size:32px; line-height:1;}
  .cell.small .mk::before{font-size:20px;}
  @supports (font-size:1cqi){
    .cell .mk::before{font-size:clamp(18px,58cqi,48px);}
    .cell.small .mk::before{font-size:clamp(12px,58cqi,30px);}
  }
  .cell.safe .mk::before{content:'✕'; font-weight:900; -webkit-text-stroke:.035em currentColor;}
  .cell.hintsafe .mk::before{content:'✕'; color:#0b6b3a; font-weight:900; -webkit-text-stroke:.035em currentColor;}
  /* 道具「找线索」的表现（2026-08-26 · owner 选定方案 A）：
     高亮线索来源那一组 + 目标格聚光并打问号，落子仍由玩家自己点——
     道具教的是「该看哪里」，不代替思考。 */
  .cell.cluegroup{outline:2px solid rgba(255,180,84,.85); outline-offset:-2px; z-index:2;}
  .cell.cluespot{outline:3px solid #ffd07a; outline-offset:-1px; z-index:3;
    box-shadow:0 0 0 4px rgba(255,180,84,.35), 0 0 22px 6px rgba(255,180,84,.55);
    animation:cluepulse 1.1s ease-in-out infinite;}
  .cell.cluespot .mk::before{content:'❓'; color:#20160a; text-shadow:none;}
  @keyframes cluepulse{50%{box-shadow:0 0 0 7px rgba(255,180,84,.22), 0 0 26px 9px rgba(255,180,84,.42);}}
  @media (prefers-reduced-motion:reduce){ .cell.cluespot{animation:none;} }
  .cluebar{display:flex; align-items:flex-start; gap:9px; border-radius:13px; padding:10px 12px;
    background:linear-gradient(120deg,rgba(255,180,84,.16),var(--surface) 60%);
    border:1px solid rgba(255,180,84,.45);}
  .cluebar.deep{background:linear-gradient(120deg,rgba(139,123,255,.16),var(--surface) 60%);
    border-color:rgba(139,123,255,.5);}
  .cluebar .ic{font-size:19px; line-height:1.2; flex:none;}
  .cluebar .tx{font-size:12.5px; line-height:1.5; color:var(--ink); flex:1; min-width:0;}
  .cluebar .tx b{display:block; color:var(--accent);}
  .cluebar.deep .tx b{color:#c3b8ff;}
  /* 理由这一行原来用 --ink-3(#6b7a8d)，在深底上对比度不够（视觉评审 2026-08-27 实测扣分）：
     提一档到 --ink-2；落子动作单独一行，别跟理由挤在一起被折行折断。 */
  .cluebar .tx span{display:block; font-size:11px; color:var(--ink-2); margin-top:2px;}
  .cluebar .tx span.act{color:var(--accent); font-weight:700; margin-top:3px;}
  .cluebar.deep .tx span.act{color:#c3b8ff;}
  .cluebar .ok{flex:none; border:0; border-radius:9px; padding:7px 11px; font:inherit; font-size:12px;
    font-weight:800; background:var(--accent); color:#20160a; cursor:pointer;}
  .cell.opened{filter:saturate(.35) brightness(.72);}
  .cell.opened .mk::before{content:'·'; font-size:.65em;}
  .cell.mine{filter:brightness(1.06);}
  .cell.mine .mk::before{content:'💣'; text-shadow:none;}
  .cell.boom{animation:shake .4s;}
  @keyframes shake{20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
  .cell.pop{animation:pop .35s;}
  @keyframes pop{40%{transform:scale(1.18)}}

  /* ---------- 道具 ---------- */
  .tools{display:flex; gap:8px;}
  .tool{flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    background:var(--surface); border:1px solid var(--edge); border-radius:12px;
    padding:10px 8px; color:var(--ink); font-size:13px; font-weight:700; cursor:pointer;}
  .tool .cnt{background:rgba(255,180,84,.16); color:var(--accent); border-radius:8px; padding:1px 7px; font-size:12px;}
  .tool:disabled{opacity:.45;}
  .hintline{font-size:11px; color:var(--ink-3); text-align:center; line-height:1.5;}
  @media (min-width:700px){
    .hintline{font-size:13px; color:#b9c5d3; line-height:1.65;}
    .hud .k,.topbar .backbtn{color:#aeb9c8;}
  }

  /* ---------- 弹窗 / toast ---------- */
  .overlay{position:fixed; inset:0; background:rgba(8,12,18,.66); display:none;
    align-items:center; justify-content:center; z-index:30; padding:20px;}
  .overlay.show{display:flex;}
  .dialog{position:relative; background:var(--surface); border:1px solid var(--edge); border-radius:16px;
    padding:20px; width:100%; max-width:320px; display:flex; flex-direction:column; gap:12px; text-align:center;}
  /* 关闭入口：任何弹窗都必须能退出（硬规则：禁止出现用户无法返回的窗口） */
  .dlgx{position:absolute; top:6px; right:8px; width:32px; height:32px; padding:0; border:0;
    border-radius:9px; background:transparent; color:var(--ink-3); font-size:16px; line-height:1;
    cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .dlgx:hover{background:rgba(255,255,255,.07); color:var(--ink);}
  .dialog h2{margin:0; font-size:18px;}
  .dialog p{margin:0; font-size:13px; color:var(--ink-2); line-height:1.6;}
  .dialog .btn{border:0; border-radius:10px; padding:11px; font-size:14px; font-weight:800; cursor:pointer;}
  .btn.primary{background:var(--accent); color:#20160a;}
  .btn.ghost{background:transparent; color:var(--ink-2); border:1px solid var(--edge);}
  .toast{position:fixed; left:50%; bottom:80px; transform:translateX(-50%) translateY(8px);
    background:#0d1420; border:1px solid var(--edge); color:var(--ink); border-radius:10px;
    padding:8px 14px; font-size:13px; opacity:0; transition:.25s; pointer-events:none; z-index:40; white-space:nowrap;}
  .toast.show{opacity:1; transform:translateX(-50%);}

  /* 兜底广告卡（house 源）：没有第三方广告可放时也要真的"看"一段，
     否则「看广告拿奖励」就退化成白送 —— 这正是本次 RCA 的问题所在。 */
  .admask{position:fixed; inset:0; z-index:60; background:rgba(4,8,14,.92);
    display:flex; align-items:center; justify-content:center; padding:22px;}
  .adbox{width:100%; max-width:340px; background:var(--surface); border:1px solid var(--edge);
    border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:12px; text-align:center;}
  .adbox .adlab{font-size:11px; color:var(--ink-3); letter-spacing:.12em; text-transform:uppercase;}
  .adbox .adart{height:150px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    font-size:40px; background:linear-gradient(135deg,#1d2836,#0f1620); border:1px solid var(--edge);}
  .adbox .adtip{font-size:12px; color:var(--ink-2);}
  .adbox .adcd{font-size:15px; font-weight:800; color:var(--accent);}
  .adbox button{border:0; border-radius:10px; padding:10px; font-size:13px; font-weight:700; cursor:pointer;
    background:rgba(127,127,127,.18); color:var(--ink-2);}
  .adbox button:disabled{opacity:.45; cursor:default;}

  /* 首页周活动入口按钮（骨架由 core/home.js 的 weekly-event-entry 产出） */
  .eventbtn{display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%;
    background:var(--surface); border:1px solid var(--edge); border-radius:14px; padding:12px 14px;
    font:inherit; color:var(--ink); cursor:pointer; position:relative;}
  .eventbtn:hover{border-color:var(--accent);}
  .eventbtn .left{display:flex; align-items:center; gap:10px; min-width:0;}
  .eventbtn .ic{font-size:20px; color:var(--accent);}
  .eventbtn .t{display:flex; flex-direction:column; text-align:left; min-width:0;}
  .eventbtn .t b{font-size:14px;}
  .eventbtn .t span{font-size:11px; color:var(--ink-3);}
  .eventbtn .frag{font-size:13px; font-weight:800; color:var(--accent); flex:0 0 auto;}
  .eventbtn .badge{position:absolute; top:-6px; right:10px; background:#e5484d; color:#fff;
    font-size:10px; font-weight:800; border-radius:9px; padding:2px 6px;}

  /* 每周活动（机制在 core/weekly.js，奖励内容由 game.config.json 的 weekly 段配置） */
  .wk{padding:14px 16px 30px; display:flex; flex-direction:column; gap:14px;}
  .wktop{display:flex; align-items:center; gap:10px;}
  .wktop button{background:transparent; border:0; color:var(--ink-2); font-size:14px; cursor:pointer; padding:4px 2px;}
  .wktop .wkh{flex:1; text-align:center; font-size:15px; font-weight:800; color:var(--ink);}
  .wkcard{background:var(--surface); border:1px solid var(--edge); border-radius:14px; padding:14px;
    display:flex; flex-direction:column; gap:10px;}
  .wkcard .wkth{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
  .wkcard .wkth b{font-size:16px; color:var(--ink);}
  .wkcard .wkth span{font-size:11px; color:var(--ink-3);}
  .wkfrag{display:flex; align-items:baseline; justify-content:space-between;}
  .wkfrag .lab{font-size:12px; color:var(--ink-3);}
  .wkfrag .num{font-size:20px; font-weight:800; color:var(--accent);}
  .wkbar{height:8px; border-radius:6px; background:rgba(127,127,127,.22); overflow:hidden;}
  .wkbar i{display:block; height:100%; background:var(--accent); border-radius:6px; transition:width .3s;}
  .wkcarry{font-size:11px; color:var(--ink-3);}
  .wkgrid{display:flex; flex-direction:column; gap:10px;}
  .wkpic{display:flex; align-items:center; gap:10px; background:var(--surface);
    border:1px solid var(--edge); border-radius:12px; padding:10px 12px;}
  .wkpic .ico{font-size:20px; width:26px; text-align:center; flex:0 0 auto;}
  .wkpic .info{flex:1 1 auto; min-width:0;}
  .wkpic .info b{display:block; font-size:14px; color:var(--ink);}
  .wkpic .info span{font-size:11px; color:var(--ink-3);}
  .wkpic.locked{opacity:.55;}
  .wkpic.claimed .info b{color:var(--ink-3);}
  .wkpic button{flex:0 0 auto; border:0; border-radius:9px; padding:7px 12px; font-size:12px;
    font-weight:700; cursor:pointer; background:var(--accent); color:#1a1205;}
  .wkpic button[disabled]{background:rgba(127,127,127,.2); color:var(--ink-3); cursor:default;}
  .wkgrand{border-color:var(--accent);}
  .wknote{font-size:11px; color:var(--ink-3); line-height:1.7; text-align:center;}

  /* 隐藏工具面板（仅 URL 带 #selftest 时显示，普通玩家看不到） */
  .selftest{position:fixed; left:10px; right:10px; bottom:10px; z-index:50; background:#0d1420;
    border:1px solid var(--edge); border-radius:12px; padding:10px; display:flex;
    flex-direction:column; gap:8px;}
  .selftest pre{margin:0; font-size:11px; line-height:1.55; color:var(--ink-2); white-space:pre-wrap;
    word-break:break-all; max-height:46vh; overflow:auto; user-select:text; -webkit-user-select:text;}

  /* ---------- 首页（与 water.html home 同款布局） ---------- */
  [hidden]{display:none !important;}
  .home{display:flex; flex-direction:column; gap:14px; padding-top:26px;}
  .home .logo{text-align:center; font-size:30px; font-weight:700; letter-spacing:.08em; color:var(--ink);}
  .home .logo em{display:block; font-style:normal; color:var(--accent); font-size:13px; letter-spacing:.3em; margin-top:4px;}
  .homestats{display:flex; gap:10px;}
  .homestats .st{flex:1; background:var(--surface); border:1px solid var(--edge); border-radius:12px;
    padding:10px 12px; text-align:center;}
  .homestats .st b{display:block; font-size:20px; color:var(--ink); margin-bottom:2px;}
  .homestats .st span{font-size:11px; color:var(--ink-3);}
  /* 道具格 = 图标按钮（数量不在首页显示，点开背包窗口看） */
  .homestats .stbtn{font:inherit; cursor:pointer; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:2px;}
  .homestats .stbtn:hover{border-color:var(--accent);}
  .homestats .stbtn .sticon{font-size:20px; line-height:1.15; margin-bottom:2px;}
  /* 背包窗口内的道具行 */
  .bagrow{display:flex; align-items:center; gap:10px; text-align:left;
    background:var(--bg-2, rgba(255,255,255,.04)); border:1px solid var(--edge);
    border-radius:10px; padding:10px 12px;}
  .bagrow .bagicon{font-size:22px; line-height:1; flex:0 0 auto;}
  .bagrow .baginfo{flex:1 1 auto; min-width:0;}
  .bagrow .baginfo b{display:block; font-size:14px; color:var(--ink);}
  .bagrow .baginfo span{font-size:11px; color:var(--ink-3);}
  .bagrow .bagqty{flex:0 0 auto; font-size:16px; font-weight:800; color:var(--accent);}
  .bagrow.empty .bagqty{color:var(--ink-3);}
  .bagempty{font-size:12px; color:var(--ink-3); line-height:1.6;}
  .bigbtn{border:0; border-radius:14px; padding:16px; font-size:17px; font-weight:800; cursor:pointer;
    background:var(--accent); color:#20160a;}
  .bigbtn small{display:block; font-weight:600; font-size:12px; margin-top:4px; opacity:.9;}
  .energy{display:flex; gap:10px; align-items:center; background:var(--surface); border:1px solid var(--edge);
    border-radius:12px; padding:10px 12px;}
  /* 并排行：体力条 + 金币牌同一行（体力不再独占整行） */
  .hrow{display:flex; gap:10px; align-items:stretch;}
  .hrow .rowcell{min-width:0;}                       /* 允许收缩，长数字不撑破布局 */
  .hrow .rowcell > *{height:100%; box-sizing:border-box;}
  .coinbox{display:flex; gap:8px; align-items:center; justify-content:center;
    background:var(--surface); border:1px solid var(--edge); border-radius:12px; padding:10px 12px;}
  .coinbox .icon{font-size:20px;}
  .coinbox .info{display:flex; flex-direction:column; line-height:1.15; min-width:0;}
  .coinbox .info b{font-size:17px; font-weight:800; color:var(--ink);}
  .coinbox .info span{font-size:11px; color:var(--ink-3);}
  .energy .icon{font-size:22px;}
  .energy .info{flex:1;}
  .energy .val{font-size:15px; font-weight:800; color:var(--ink);}
  .energy .val .max{color:var(--ink-3); font-weight:600;}
  .energy .sub{font-size:12px; color:var(--ink-2); margin:2px 0 4px;}
  .energy .bar{height:5px; border-radius:3px; background:rgba(255,255,255,.08); overflow:hidden;}
  .energy .bar i{display:block; height:100%; background:var(--accent); border-radius:3px;}
  /* 双连胜卡(2026-08-24 · core/winstreak.js) */
  .streakcard{display:flex; gap:10px; align-items:center; background:var(--surface); border:1px solid var(--edge);
    border-radius:12px; padding:10px 12px;}
  .streakcard .ic{font-size:22px;}
  .streakcard .info{flex:1; min-width:0;}
  .streakcard .val{font-size:15px; font-weight:800; color:var(--ink);}
  .streakcard .val span{color:var(--ink-3); font-weight:600; font-size:11px;}
  .streakcard .sub{font-size:11px; color:var(--ink-3); margin:2px 0 4px; display:flex; justify-content:space-between; gap:8px;}
  .streakcard .bar{height:5px; border-radius:3px; background:rgba(255,255,255,.08); overflow:hidden;}
  .streakcard .bar i{display:block; height:100%; background:var(--ok); border-radius:3px; transition:width .3s;}
  .streakcard .wsclaim{background:var(--accent); color:#20160a; border-radius:9px; padding:9px 11px;
    font-size:12px; font-weight:800; white-space:nowrap;}
  .profilerow{display:flex; gap:10px; align-items:center; background:var(--surface); border:1px solid var(--edge);
    border-radius:12px; padding:10px 12px; cursor:pointer; color:var(--ink); font-size:13px; text-align:left; width:100%;}
  .profilerow .avatar{width:32px; height:32px; border-radius:50%; background:var(--accent); color:#20160a;
    display:flex; align-items:center; justify-content:center; font-weight:800; flex:none;}
  .profilerow .profileinfo{flex:1; display:flex; flex-direction:column; gap:1px;}
  .profilerow .profilelabel{font-size:11px; color:var(--ink-3);}
  .profilerow .profilesource{font-size:11px; color:var(--ink-3);}
  .idrow .avatar{position:relative;}
  .idnameline{display:flex; align-items:center; gap:6px; min-width:0;}
  .idnameline .profilename{font-weight:800; min-width:0; overflow-wrap:anywhere;}
  .idsource{display:none; flex:none; font-style:normal; font-size:10px; font-weight:600; color:var(--ink-3);
    border:1px solid var(--edge); border-radius:999px; padding:1px 5px;}
  .idsource.show{display:inline-block;}
  .idsub{font-size:11px; color:var(--ink-3); line-height:1.4; white-space:normal; overflow-wrap:anywhere;}
  .idrow #idAction{flex:none; max-width:88px; text-align:right; color:var(--ink-2);}
  .idbadge{position:absolute; right:-2px; bottom:-2px; width:14px; height:14px; border-radius:50%;
    border:2px solid var(--surface); display:flex; align-items:center; justify-content:center;
    font-style:normal; font-size:9px; font-weight:900; line-height:1;}
  .idbadge.off{background:var(--surface); box-shadow:inset 0 0 0 1px var(--ink-3);}
  .idbadge.ok{background:var(--ok); color:var(--surface);}
  .idbadge.ok::after{content:'✓';}
  .idbadge.warn{background:var(--accent); color:var(--surface);}
  .idbadge.warn::after{content:'!';}
  .langrow{display:flex; align-items:center; justify-content:space-between; background:var(--surface);
    border:1px solid var(--edge); border-radius:12px; padding:10px 12px; font-size:13px; color:var(--ink-2);}
  .sfxbtn{border:1px solid var(--edge); background:transparent; color:var(--ink); border-radius:8px;
    padding:4px 14px; cursor:pointer; font-size:13px;}
  .langrow select{appearance:none; -webkit-appearance:none; color-scheme:dark; border:1px solid var(--edge);
    background-color:#151d29; color:var(--ink); border-radius:8px; padding:6px 30px 6px 10px;
    font:inherit; cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),
      linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);

<script>
(function () {
  'use strict';
  /* ============ 常量 / 存档 ============ */
  var DBL_MS = 320;                    // 双击窗口
  var KEY = 'mine_save_v1';
  var COLORS = ['#7f9cf5','#f56d6d','#f5c66d','#6dd3a8','#c98df0','#6dc4f0',
                '#f09db8','#a8d36d','#f0a56d','#8f8ff0','#6df0d8'];  // 11 色恰好覆盖 11×11
  var REGION_TEXTURES = [
    { image: 'repeating-linear-gradient(45deg, rgba(15,22,32,.11) 0 1.4px, transparent 1.4px 8px)', size: 'auto' },
    { image: 'repeating-linear-gradient(-45deg, rgba(15,22,32,.11) 0 1.4px, transparent 1.4px 8px)', size: 'auto' },

    { image: 'repeating-linear-gradient(0deg, rgba(15,22,32,.08) 0 1px, transparent 1px 9px), repeating-linear-gradient(90deg, rgba(15,22,32,.08) 0 1px, transparent 1px 9px)', size: 'auto' },

    { image: 'conic-gradient(from 45deg, rgba(15,22,32,.10) 25%, transparent 0 50%, rgba(15,22,32,.10) 0 75%, transparent 0)', size: '8px 8px' },
    { image: 'repeating-linear-gradient(60deg, rgba(15,22,32,.11) 0 1.2px, transparent 1.2px 11px), repeating-linear-gradient(-60deg, rgba(15,22,32,.06) 0 1px, transparent 1px 11px)', size: 'auto' }
  ];
  var AD_TOOL_GRANT = 1;               // 看完一次激励广告补 1 个道具（广告链见 core/adplay.js）
  var AD_TIME_BONUS = 60;              // 看广告加 60 秒
  /* GameConfig 内嵌：与 games/mine/game.config.json 逐字段一致（mine-config.test.js 校验）；
     reward 参数经 RewardCore fail-fast 校验，screens.home 声明驱动首页渲染 */
  var CFG = JSON.parse(document.getElementById('gameConfig').textContent);
  var Reward = RewardCore.create(CFG.reward);
  var save = Object.assign({ level: 1, clears: 0,
    energy: Reward.E_MAX, lastTs: Date.now(), alias: '', sfx: true }, load() || {});
  /* 道具库存走单调账本（core/stock.js）：只存 granted/spent 两个只增计数，库存 = granted - spent。
     旧做法是存「库存数」+ 按 updatedMs 取新合并，而 updatedMs 会被体力恢复/昵称/音效等无关写入刷新，
     于是任一端拿着默认库存做一次无关保存就把已消耗的道具复活——正是「用了道具，重新登录又变回默认 4 个」的根因。 */
  /* ===== 多语言：字典在 config（games/mine/game.config.json 的 i18n 段），
     语言选择走 core/locale.js 的 resolveLang（与倒水同一份实现，不再各写一套）。
     优先级：?lang= 调试参数 → 手动选择(持久化) → Telegram 语言 → 浏览器语言 → 默认。
     注意顺序：这段必须在任何调用 t() 的代码之前跑完，否则会踩顶层 TDZ（整段 script 静默中断）。 */
  var I18n = LocaleCore.createI18n(CFG.i18n);
  var LANG_KEY = 'mine_lang';
  var savedLang = null;
  try { savedLang = window.localStorage.getItem(LANG_KEY); } catch (e) {}   // 隐私模式会抛
  var tgUser = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe
    && window.Telegram.WebApp.initDataUnsafe.user) || {};
  var LANG = LocaleCore.resolveLang({
    search: location.search,
    saved: savedLang,
    tgLanguageCode: tgUser.language_code,
    navigatorLanguage: navigator.language
  }, I18n.locales(), CFG.i18n['default']);

  /* t(key, vars)：取词 + {占位符} 插值。缺 key 由 core 抛错（宁可炸也不显示空白）。 */
  function t(key, vars) {
    var s = I18n.t(LANG, key);
    if (!vars) return s;
    return s.replace(/\{(\w+)\}/g, function (m, name) {
      return vars[name] !== undefined ? String(vars[name]) : m;
    });
  }

  var Stock = StockCore.create(CFG.stock);
  /* 金币：通关攒、可直接买道具（不用看广告）。彩雷这边【故意不写 coins 配置】，
     走 core/coins.js 的默认值——通关 +1、200 金币换 1 个道具；
     倒水那边显式配了自己的数值（通关 +2、撤销 150 换 2 个），证明每个游戏都能自定。 */
  var Coins = CoinsCore.create(CFG.coins, Stock);
  Object.assign(save, Stock.migrate(save));
  function load(){ try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } }
  function persist(){
    /* 多标签页保护：写盘前先跟磁盘上的现值把「只增账本」取大。
       同一浏览器开两个标签页时，另一个标签页手里是过期快照，它的下一次写盘
       （首页体力每秒结算就会触发）会把已花掉的金币/道具覆盖回去 —— 实测复现过。
       granted/spent 单调只增，取大不会丢任何一侧的消耗。 */
    try {
      var onDisk = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (onDisk) Object.assign(save, Stock.reconcile(save, onDisk));

  var CHEER_NOTES = [           // [基频, 起始偏移秒, 包络峰值, 时长秒]
    [1046.50, 0,    .105, .18],   // C6
    [1318.51, .075, .105, .18],   // E6（大三度 5:4）
    [1568.00, .150, .110, .24],   // G6（纯五度 3:2）

    var el = cellEl(idx);
    if (S.marks.has(idx)) { S.marks.delete(idx); el.classList.remove('safe', 'hintsafe'); }
    else { S.marks.add(idx); el.classList.add('safe'); blip(660, .06); }
  }

  function vibrateCorrectMine() {
    try {
      if (typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function') navigator.vibrate(18);
    } catch (e) {}
  }

  function dig(idx) {
    var el = cellEl(idx);
    /* 玩家照着线索挖了 → 高亮与线索条必须退场。
       toggleMark 里早就有这一句，dig 却漏了，于是「挖完雷 ❓ 还挂在格子上」
       （2026-08-27 真页面验收逮到）。落子的两条路都要收口。 */
    if (S.clue && S.clue.idx === idx) clearClue();
    if (S.mines.has(idx)) {                 // 挖中雷 = 找对
      S.found.add(idx); S.marks.delete(idx);
      el.classList.remove('safe', 'hintsafe');
      el.classList.add('mine', 'pop');
      cheer();                              // 找对了：轻轻鼓励一下
      renderHud();
      if (S.found.size === S.size) onWin();
      return true;
    } else {                                // 挖错 → 扣血
      S.opened.add(idx); S.marks.delete(idx);
      el.classList.remove('safe', 'hintsafe');
      el.classList.add('opened', 'boom');
      blip(320, .25);   // 原来 140Hz：手机小喇叭物理上放不出这么低的频率，等于没有反馈
      S.lives -= 1; renderHud();
      if (S.lives <= 0) return onDead();
      toast(t('notMine', { n: S.lives }));
    }
  }

  /* ============ 道具 ============ */
  $('toolMine').addEventListener('click', function () {
    if (S.done) return;
    if (Stock.stock(save, 'toolMine') <= 0) return offerAdTool('toolMine', t('itemToolMineName'));
    /* S.found 是 Set，引擎按数组消费（indexOf）：直接把 Set 传进去会抛 TypeError，
       道具点了等于没点（库存不减、雷也不标） */
    var idx = MineEngine.pickUnfoundMine(S.board, Array.from(S.found));
    if (idx < 0) return toast(t('allMinesFound'));
    if (!spendTool('toolMine')) return offerAdTool('toolMine', t('itemToolMineName'));
    S.found.add(idx); S.marks.delete(idx);
    var el = cellEl(idx);
    el.classList.remove('safe', 'hintsafe');
    el.classList.add('mine', 'pop');
    cheer();                                // 道具找到的雷同样给鼓励音
    renderHud();
    if (S.found.size === S.size) onWin();
  });

  /* 道具「找线索」（2026-08-26 改造，owner 选定方案 A）：
     不再随机给一个安全格——按当前盘面的真实线索推出一格，高亮线索来源并讲清理由，
     落子仍由玩家自己点。事实只喂 S.opened(已挖开=非雷) 与 S.found(已确认的雷)；
     **S.marks 是玩家自己打的 ✕ 猜测，绝不能当事实**，他标错了会让提示跟着错。 */
  function clearClue() {
    if (!S || !S.clue) return;
    var el;
    (S.clue.group || []).forEach(function (i) {
      el = cellEl(i); if (el) el.classList.remove('cluegroup');
    });
    el = cellEl(S.clue.idx); if (el) el.classList.remove('cluespot');
    S.clue = null;
    $('clueBar').hidden = true;
  }

  function showClue(hint) {
    clearClue();
    var group = (hint.group && hint.group.cells ? hint.group.cells : []).filter(function (i) { return i !== hint.idx; });
    S.clue = { idx: hint.idx, group: group, hint: hint };
    group.forEach(function (i) { var el = cellEl(i); if (el) el.classList.add('cluegroup'); });
    var spot = cellEl(hint.idx);
    if (spot) spot.classList.add('cluespot');
    var deep = hint.depth === 'deep';
    var bar = $('clueBar');
    bar.hidden = false;
    bar.classList.toggle('deep', deep);
    $('clueIc').textContent = hint.why === 'markwrong' ? '⚠️' : '💣';
    $('clueTitle').textContent = t(hint.why === 'markwrong' ? 'clueMarkWrongTitle' : 'clueMineTitle');
    /* 理由 + 落子动作：光指位置不够，得告诉他「双击才算挖雷」——
       单击是打 ✕，玩家照着提示单击等于把雷 ✕ 掉，比不提示还糟。 */
    $('clueWhy').textContent = clueWhyText(hint);
    $('clueAct').textContent = '👉 ' + t('clueAction');
    $('clueOk').textContent = t('clueGotIt');
  }

  /* 组名（讲理由时要指得出是哪一行/哪一列/哪个色块） */
  function groupLabel(g) {
    if (!g) return t('gRegion');
    if (g.kind === 'row') return t('gRow', { n: (g.at || 0) + 1 });
    if (g.kind === 'col') return t('gCol', { n: (g.at || 0) + 1 });
    return t('gRegion');
  }

  /* 理由文案：局部推理讲得出具体规则；深度判定（跨行列联立）诚实说明，
     不硬编一个假理由——假理由比没理由更伤信任。 */
  function clueWhyText(hint) {
    var g = hint.group || {};
    var n = (g.at || 0) + 1;
    if (hint.why === 'markwrong') return t('clueMarkWrong');
    if (hint.why === 'row-last') return t('clueRowLast', { n: n });
    if (hint.why === 'col-last') return t('clueColLast', { n: n });
    if (hint.why === 'region-last') return t('clueRegionLast');
    if (hint.why === 'region-only') return t('clueRegionOnly');
    if (hint.why === 'row-clear') return t('clueRowClear', { n: n });
    if (hint.why === 'col-clear') return t('clueColClear', { n: n });
    if (hint.why === 'region-clear') return t('clueRegionClear');
    if (hint.why === 'confine') return t('clueConfine', { a: groupLabel(hint.from), b: groupLabel(hint.into) });
    if (hint.why === 'squeeze') return t('clueSqueeze');
    return t('clueDeep');
  }

  $('clueOk').addEventListener('click', clearClue);

  $('toolSafe').addEventListener('click', function () {
    if (S.done) return;
    /* 上一条线索还挂着没落子 → 重新高亮，不再收费。
       同一个盘面状态本来就只会算出同一条线索，收第二次钱等于白扣道具。 */
    if (S.clue && S.clue.hint && !S.found.has(S.clue.idx)) {
      showClue(S.clue.hint);
      return toast(t('clueStillOn'));
    }
    if (Stock.stock(save, 'toolSafe') <= 0) return offerAdTool('toolSafe', t('itemToolSafeName'));
    /* v2：marks（玩家自己打的 ✕）一并喂给引擎——它是玩家进度的**唯一**记录，
       丢掉它引擎就只能反复讲「这格安全」。引擎内部只采信其中确实不是雷的那些，
       打错的 ✕ 反而会被当成最高优先级的线索指出来。 */
    var hint = MineEngine.clueNext(S.board, {
      opened: Array.from(S.opened), found: Array.from(S.found), marks: Array.from(S.marks),
    });
    if (!hint) return toast(t('noHintLeft'));
    if (!spendTool('toolSafe')) return offerAdTool('toolSafe', t('itemToolSafeName'));
    showClue(hint);
    renderHud();
  });

  /* 用金币买道具：够钱就一步到位，不用看广告。金币与道具都记在只增账本里，
     所以「买过就是买过、花掉就是花掉」，换设备重登也不会被云端旧值回退。 */
  function buyTool(key, name) {
    var patch = Coins.buy(save, key);
    if (!patch) { toast(t('notEnoughCoins')); return false; }
    Object.assign(save, patch); persist();
    renderHud(); renderHome();
    toast(t('boughtWithCoins', { n: Coins.priceOf(key), name: name }));
    return true;
  }

  function offerAdTool(key, name) {
    var sku = Coins.sku(key), bal = Coins.balance(save);
    var adText = t('adGrant', { n: AD_TOOL_GRANT });
    /* 广告位 tool-refill（config: format=rewarded, onFail=deny）：没看完不补道具 */
    var doAd = function () {
      watchAdFor('tool-refill', function () {
        grantTool(key, AD_TOOL_GRANT); renderHud(); toast(t('toolRefilled'));
      });
    };
    if (sku && bal >= sku.price) {
      // 金币够：把「花金币」放在主按钮，看广告退居次选
      dialog(t('toolEmptyTitle'),
        t('toolEmptyBuy', { price: sku.price, amount: sku.amount, name: name, balance: bal }),
        t('buyWithCoins', { n: sku.price }), function () { buyTool(key, name); },
        adText, doAd);
    } else {
      dialog(t('toolEmptyTitle'),
        t('toolEmptyAd', { n: AD_TOOL_GRANT, name: name })
        + (sku ? t('toolEmptySave', { balance: bal, price: sku.price }) : ''),
        adText, doAd, t('cancel'), null);
    }
  }

  /* ============ 结算 ============ */
  function onWin() {
    resetGestureState();
    S.done = true; stopTimer();
    save.level = S.lv + 1; save.clears = (save.clears || 0) + 1;
    var wkMsgs = Weekly.enabled ? WeeklyCtl.addFrags(Weekly.frags.win) : [];   // 通关 → 周活动碎片
    var coinPatch = Coins.rewardClear(save);          // 通关奖励金币（earnPerClear 配 0 则为 null）
    if (coinPatch) Object.assign(save, coinPatch);
    wsOnWin();   // 双连胜:A+1,B 周期推进/出票(2026-08-24)
    persist();
    dialog(t('winTitle', { n: S.lv }), t('winBody', { n: S.size })
      + (coinPatch ? t('winCoins', { n: Coins.earnPerClear, total: Coins.balance(save) }) : ''),
      t('nextLevel'), function () { startLevel(save.level); }, t('toHome'), showHome,
      showHome);                      // 关掉这个窗（✕/点外部/Esc）= 回首页，不把人留在已结束的棋盘上
  }
  function onDead() {
    resetGestureState();
    S.done = true; stopTimer();
    dialog(t('deadTitle'), t('deadBody'),
      /* 广告位 fail-revive（config: onFail=retry）：没看完不复活 */
      t('adRevive'), function () {
        watchAdFor('fail-revive', function () {
          S.done = false; S.lives = 1; renderHud(); if (S.remain != null) startTimer();
        });
      },
      t('restart'), function () { wsOnLose(); wsGate(function () { startLevel(S.lv); }); },
      function () { wsOnLose(); showHome(); });   // 关掉 = 回首页（局已结束）；双连胜记一次失败
  }
  function onTimeUp() {
    resetGestureState();
    S.done = true;
    dialog(t('timeUpTitle'), t('timeUpBody', { n: AD_TIME_BONUS }),
      /* 广告位 time-bonus（config: onFail=deny, capping.maxPerSession=3）：没看完不加时 */
      t('adGrant', { n: AD_TIME_BONUS + 's' }), function () {
        watchAdFor('time-bonus', function () {
          /* 累加而不是覆盖：超时路径上 remain 是 0，但别的加时入口（以后可能有）
             remain 可能还有剩，覆盖式赋值会把玩家剩下的时间吞掉。 */
          S.done = false;
          S.remain = Math.max(0, S.remain || 0) + AD_TIME_BONUS;
          renderHud(); startTimer();
        });
      },
      t('restart'), function () { wsOnLose(); wsGate(function () { startLevel(S.lv); }); },
      function () { wsOnLose(); showHome(); });   // 关掉 = 回首页；双连胜记一次失败
  }

  /* HTML 转义（背包窗口与周活动页共用）：core/home.js 的 esc 在它自己的 IIFE 里，页面取不到。
     文案虽来自自家配置，但拼 HTML 一律先转义，避免以后配置里出现 & < > 引号把结构撑坏。
     教训：这个函数原来是 openBag 的局部函数，周活动页复用时 ReferenceError 让整段渲染崩掉
     （图卡 0 张、奖励发不出），真跑才暴露出来。 */
  function escHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ============ 广告（机制在 core/adplay.js + core/placements.js） ============
     RCA（2026-08-21）：在此之前所有「看广告」按钮点了直接发奖 —— 页面从未引入广告 core，
     Telegram 与浏览器里都不会出现任何广告（线上实测：广告 SDK 调用 0 次、外部请求 0 个）。
     现在统一走 core：广告源顺序、各广告位格式/失败策略/频控全部由 config 声明（每游戏可不同），
     core 只回报"看完了没有"，**发奖仍由本文件决定** —— 避免 core 代发导致没看完也拿奖。 */
  var AdPlacements = (CFG.ads && CFG.ads.placements)
    ? PlacementsCore.create(CFG.ads.placements, function () { return false; })   // 真实结果由 adplay 注入
    : null;
  var AD_STATE_KEY = 'mine_adstate_v1';
  var adState = {};                       // 各广告位的频控状态（按 placement id 存）
  try { adState = JSON.parse(localStorage.getItem(AD_STATE_KEY) || '{}') || {}; } catch (e) {}
  function saveAdState() { try { localStorage.setItem(AD_STATE_KEY, JSON.stringify(adState)); } catch (e) {} }

  /* 兜底广告卡：真的要看完倒计时才算成功，中途跳过 = 没看完（不发奖）。
     这是 house 源，注入给 core；core 优先用 Telegram/AdsGram，都没有才用它。 */
  function houseAd(seconds, done) {
    var left = Math.ceil(seconds);
    var mask = $('adMask'), skip = $('adSkip'), timer = null;
    var finish = function (watched) {
      if (timer) { clearInterval(timer); timer = null; }
      mask.hidden = true;
      skip.onclick = null;
      done(watched);
    };
    $('adLab').textContent = t('adTitle');
    $('adTip').textContent = t('adReward');
    $('adCd').textContent = t('adWatching', { n: left });
    skip.textContent = t('adSkip');
    skip.disabled = false;
    mask.hidden = false;
    skip.onclick = function () { finish(false); };          // 用户主动放弃
    timer = setInterval(function () {
      left -= 1;
      if (left <= 0) { $('adCd').textContent = ''; finish(true); return; }
      $('adCd').textContent = t('adWatching', { n: left });
    }, 1000);
  }

  /* 按需加载某个 Monetag zone 的 SDK。
     为什么不写死在 head：TMA zone 与 Website zone 是两条独立通道，
     一个页面可能同时配了两个 —— 只加载当前环境真要用的那个，
     避免把 Telegram Mini App 的 zone 用在网页流量上（那是无效流量）。 */
  function loadMonetagSdk(zone) {
    var flag = 'show_' + zone;
    if (typeof window[flag] === 'function') return Promise.resolve();
    var existing = document.querySelector('script[data-zone="' + zone + '"]');
    return new Promise(function (resolve, reject) {
      var el = existing;
      if (!el) {
        el = document.createElement('script');
        el.src = 'https://libtl.com/sdk.js';
        el.setAttribute('data-zone', zone);
        el.setAttribute('data-sdk', flag);
        document.head.appendChild(el);
      }
      var tries = 0;
      var tick = setInterval(function () {
        if (typeof window[flag] === 'function') { clearInterval(tick); resolve(); return; }
        if (++tries > 60) { clearInterval(tick); reject(new Error('sdk-timeout')); }   // 最多等 6 秒
      }, 100);
      el.addEventListener('error', function () { clearInterval(tick); reject(new Error('sdk-error')); });
    });
  }

  var CFG_ADS = CFG.ads || null;
  var AdPlay = AdPlayCore.create((CFG.ads && CFG.ads.play) || null,
    { houseAd: houseAd, loadSdk: loadMonetagSdk, openUrl: openExternal });

  /* 打开外部链接，返回是否真的开成了（被拦弹窗 → false，上层判失败不发奖）。
     坑：window.open(url,'_blank','noopener') 按规范**返回 null**，会把成功误判成被拦；
     所以不能在 features 里写 noopener，改为开完手动断 opener。 */
  function openExternal(url) {
    var w = null;
    try { w = window.open(url, '_blank'); } catch (e) { return false; }
    if (!w) return false;
    try { w.opener = null; } catch (e) { /* 跨源时不可写，无妨 */ }
    return true;
  }

  /* Multitag（被动收入）：只在浏览器、只在首页注入一次。
     为什么不放 head：① Telegram 内不该加载（会和 TMA 激励广告抢焦点）；
     ② 它含 Onclick popunder，而对局中每点一格都是一次 click，注入进对局界面会毁体验。
     注意：脚本一旦注入就无法卸载，所以对局中的频次控制要在 Monetag 后台设 capping。 */
  function loadMultitag() {
    var m = (CFG_ADS && CFG_ADS.passive && CFG_ADS.passive.multitag) || null;
    if (!m || !m.src) return false;                       // 没配 = 不启用
    if (m.env === 'web' && AdPlay.inTelegram()) return false;
    if (document.querySelector('script[data-multitag="1"]')) return false;  // 已注入
    var el = document.createElement('script');
    el.src = m.src;
    el.async = true;
    if (m.zone) el.setAttribute('data-zone', String(m.zone));
    el.setAttribute('data-cfasync', 'false');
    el.setAttribute('data-multitag', '1');
    document.head.appendChild(el);
    return true;
  }

  /* 统一入口：想靠广告拿奖励的地方都调它。
     onReward 只在「真的看完 + 频控允许 + config 的 onFail 策略允许」时才被调用。 */
  /* ============ 双连胜(core/winstreak.js · 2026-08-24)：与倒水共用同一份 core ============
     A 首页大连胜:只增不封顶;断链挂 pend,下次点「开始/重开」时弹「看广告保持」
     (拒绝/关窗即清零,连胜 <keepMinPrompt 静默清零——用户拍板)。
     B 每 every 盘出一张奖励票:看广告(streak-claim)领 体力/金币/周碎片;不领则票与
     every/every 冻结态一直保留(失败也不丢,票不叠加——用户拍板);A/B 独立。 */
  var WinStreak = WinStreakCore.create(CFG.winstreak || null);
  function wsGet() {
    return WinStreak.from({ cur: save.wsCur, pend: save.wsPend, cyc: save.wsCyc, earned: save.wsEarned, claimed: save.wsClaimed });
  }
  function wsSet(st) {
    save.wsCur = st.cur; save.wsPend = st.pend ? 1 : 0; save.wsCyc = st.cyc;
    save.wsEarned = st.earned; save.wsClaimed = st.claimed;
    persist();
  }
  function wsRewardText(rw) {
    var parts = [];
    if (rw.energy) parts.push('⚡+' + rw.energy);
    if (rw.coins) parts.push('🪙+' + rw.coins);
    if (rw.frags && Weekly.enabled) parts.push('🧩+' + rw.frags);
    return parts.join(' · ');
  }
  function wsOnWin() {
    if (!WinStreak.enabled) return;
    var r = WinStreak.win(wsGet());
    wsSet(r.state);
    if (r.ticket) setTimeout(function () { toast(t('wsTicketToast', { n: WinStreak.every })); }, 600);
  }
  function wsOnLose() {
    if (!WinStreak.enabled) return;
    var st = wsGet();
    if (st.pend) return;               // 已有未决断链(防御:同一断链不重复记)
    wsSet(WinStreak.lose(st).state);   // B 周期立即清零;A 大连胜挂 pend/小连胜静默清零
  }
  /* 断链未决时先问「看广告保持」再放行;普通开局零打扰(用户定案) */
  function wsGate(proceed) {
    if (WinStreak.enabled) {
      var ws = wsGet();
      if (ws.pend) { wsKeepDialog(ws, proceed); return; }
    }
    proceed();
  }
  /* ✕/遮罩/Esc = 放弃连胜留在原页;两个按钮各自动线后都继续 proceed */
  function wsKeepDialog(st, proceed) {
    dialog(t('wsKeepTitle', { n: st.cur }), t('wsKeepBody', { n: st.cur }),
      /* 广告位 streak-keep（config: onFail=grant）:广告源失败不怪玩家,连胜照保 */
      t('wsKeepAd'), function () {
        watchAdFor('streak-keep', function () {
          wsSet(WinStreak.keep(wsGet())); toast(t('wsKept', { n: wsGet().cur })); proceed();
        });
      },
      t('wsKeepDrop'), function () {
        wsSet(WinStreak.drop(wsGet())); toast(t('wsDropped')); proceed();
      },
      function () { wsSet(WinStreak.drop(wsGet())); toast(t('wsDropped')); if (!$('home').hidden) renderHome(); });
  }
  /* 领取奖励票:广告位 streak-claim,播完才核销入账;体力可超上限(与 water 同规则 issue #7)。
     金币走只增账本(Stock.grant→coinsEarned),周碎片走 WeeklyCtl——各自的云同步保护自动生效 */
  var wsClaiming = false;
  function wsClaimTicket() {
    if (wsClaiming || !WinStreak.hasTicket(wsGet())) return;
    wsClaiming = true;
    watchAdFor('streak-claim', function () {
      var r = WinStreak.claim(wsGet());
      wsSet(r.state);
      var rw = r.rewards;
      if (rw.energy) { save.energy += rw.energy; if (save.energy >= Reward.E_MAX) save.lastTs = Date.now(); }
      if (rw.coins) Object.assign(save, Stock.grant(save, Coins.coinsKey, rw.coins));
      persist();
      var wkMsgs = (rw.frags && Weekly.enabled) ? WeeklyCtl.addFrags(rw.frags) : [];
      toast(t('wsClaimGot', { r: wsRewardText(rw) }));
      wkMsgs.forEach(function (m, i) { setTimeout(function () { toast(m); }, 1400 * (i + 1)); });
      if (!$('home').hidden) renderHome();
    });
    setTimeout(function () { wsClaiming = false; }, 800);   // 只防连点,不锁死失败路径
  }

  function watchAdFor(placementId, onReward) {
    /* 暂停/恢复收在这一层，而不是各调用点各写一遍——否则以后新增广告位默认不受保护
       （倒水踩过这个坑，见 ad-pause-timer.test.js 的注释）。 */
    pauseClock();
    var settled = false;
    var done = function () { if (settled) return; settled = true; resumeClock(); };
    AdPlay.playPlacement(AdPlacements, placementId, adState[placementId] || {}).catch(function (err) {
      console.warn('[mine ads] playPlacement threw placement=' + placementId +
        ' err_name=' + (err && err.name) + ' err_msg=' + String((err && err.message) || err).slice(0, 200));
      return { granted: false, shown: false, ad: { reason: 'error' } };
    }).then(function (res) {
      adState[placementId] = res.state || {};
      saveAdState();
      /* 顺序要紧：先恢复时钟再发奖。发奖会调 startTimer，若此时还在暂停态，
         startTimer 只会记下「本该在跑」而不真的开表，玩家的加时就白加了。
         页面若仍不可见（directlink 场景玩家还在广告页），visibilitychange 那一层
         仍然按住停表，等他真的回来才走表。 */
      done();
      if (res.granted) { onReward(); return; }
      if (res.shown === false) { toast(t('adCapped')); return; }          // 频控拦下
      var why = res.ad && res.ad.reason;
      if (why === 'no-source') { toast(t('adNone')); return; }
      toast(t('adFailed'));                                               // 没看完
      /* 降级可观测：广告源常态化失败时能从这行看出来（本机硬纪律） */
      var st = AdPlay.stats();
      console.warn('[mine ads] ad-not-completed placement=' + placementId +
        ' source=' + (res.ad && res.ad.source) + ' reason=' + why +
        ' totals ok/fail=' + st.ok + '/' + st.failed + ' bySource=' + JSON.stringify(st.bySource));
    }, function (err) {                       // 兜底：任何未预期失败也必须把时钟还给玩家
      done();
      console.warn('[mine ads] ad chain error placement=' + placementId +
        ' err_name=' + (err && err.name) + ' err_msg=' + String((err && err.message) || err).slice(0, 200));
    });
  }

  /* ============ 每周活动 ============
     机制（周界/解锁/领取状态机/结转）全部在 core/weekly.js，与倒水共用同一份实现；
     本游戏只在 game.config.json 的 weekly 段声明自己的奖励：金币 + 两种道具，
     3 张图、阈值 60/150/300（倒水是 6 张图、发体力和提示）。
     奖励入账走各自的经济体系：金币/道具都记在只增账本（core/stock.js），所以云端同步与
     多标签页保护自动生效，不需要这里另写一套。 */
  var Weekly = WeeklyCore.create(CFG.weekly);
  var WK_KEY = 'mine_weekly_v1';
  var WeeklyCtl = {
    state: null,
    load: function () {
      var raw = null;
      try { raw = JSON.parse(localStorage.getItem(WK_KEY) || 'null'); } catch (e) {}
      this.state = Weekly.normalize(raw, Weekly.weekKey(Date.now()));
      if (this.state !== raw) this.flush();
    },
    flush: function () { try { localStorage.setItem(WK_KEY, JSON.stringify(this.state)); } catch (e) {} },
    settle: function () {                       // 跨周则重置 + 结转（渲染/加碎片前都先走这里）
      var wk = Weekly.weekKey(Date.now());
      var n = Weekly.normalize(this.state, wk);
      if (n !== this.state) { this.state = n; this.flush(); }
    },
    addFrags: function (n) {                    // 解锁只进「可领取」，不自动发奖
      this.settle();
      var st = this.state, before = st.frags, msgs = [];
      st.frags += n;
      Weekly.newlyUnlocked(before, st.frags).forEach(function (i) {
        if (!st.claimed[i]) msgs.push(t('wkUnlockToast', { pic: wkPicName(i) }));
      });
      if (before < Weekly.goal && st.frags >= Weekly.goal && !st.grand) msgs.push(t('wkGrandToast'));
      this.flush();
      return msgs;
    },
    claim: function (i) {                       // core 状态机把关（仅 claimable 可领），奖励入账后落盘
      this.settle();
      var res = Weekly.claim(this.state, i);
      this.state = res.state; this.flush();
      grantWeeklyReward(res.reward);
      toast(t('wkGot', { text: rewardText(res.reward.type, res.reward.n) }));
      renderWeekly(); renderHome();
    },
    claimGrand: function () {
      this.settle();
      var res = Weekly.claimGrand(this.state);
      this.state = res.state; this.flush();
      var parts = [];
      Object.keys(res.reward).forEach(function (k) {
        grantWeeklyReward({ type: k, n: res.reward[k] });
        parts.push(rewardText(k, res.reward[k]));
      });
      toast(t('wkGot', { text: parts.join(' + ') }));
      renderWeekly(); renderHome();
    }
  };

  /* 奖励入账：金币与道具都走 core/stock.js 的只增账本（云端同步/多标签页保护自动生效）。
     配置里出现未接线的奖励类型时明确抛错，而不是静默丢奖。 */
  function grantWeeklyReward(r) {
    if (r.type === 'coins') { Object.assign(save, Stock.grant(save, Coins.coinsKey, r.n)); persist(); return; }
    if (Stock.keys.indexOf(r.type) !== -1) { grantTool(r.type, r.n); return; }
    throw new Error('weekly: 奖励类型 "' + r.type + '" 没有接线（检查 config.weekly.rewardPool）');
  }
  function rewardText(type, n) {
    var key = 'rw' + type.charAt(0).toUpperCase() + type.slice(1);   // coins → rwCoins
    return t(key, { n: n });
  }
  function wkPicName(i) {
    var th = Weekly.themeFor(Date.now());
    var pack = (LANG === 'zh' ? th.zh : th.en) || th.zh;
    return (pack.pics && pack.pics[i]) || ('#' + (i + 1));
  }
  function wkThemeName() {
    var th = Weekly.themeFor(Date.now());
    var pack = (LANG === 'zh' ? th.zh : th.en) || th.zh;
    return pack.name || '';
  }
  function renderWeekly() {
    if (!WeeklyCtl.state) WeeklyCtl.load();
    WeeklyCtl.settle();
    var st = WeeklyCtl.state;
    $('btnWkBack').textContent = t('wkBack');
    $('wkH').textContent = t('wkTitle');
    $('wkTheme').textContent = wkThemeName();
    $('wkGoalLab').textContent = t('wkGoal', { n: Weekly.goal });
    $('wkFragLab').textContent = t('wkFragLab');
    $('wkFragNum').textContent = st.frags + ' / ' + Weekly.goal;
    $('wkBar').style.width = Math.min(100, (st.frags / Weekly.goal) * 100) + '%';
    var carry = $('wkCarry');
    carry.hidden = !(st.carried > 0);
    if (st.carried > 0) carry.textContent = t('wkCarry', { n: st.carried });
    var left = Math.max(0, Weekly.weekEnd(Date.now()) - Date.now());
    $('wkCd').textContent = t('wkCd', { d: Math.floor(left / 86400000), h: Math.floor(left / 3600000) % 24 });
    // 主题图列表
    var rows = Weekly.thresholds.map(function (need, i) {
      var stt = Weekly.picStatus(st, i);
      var got = st['r' + i];
      var sub = stt === 'claimed' ? (got ? rewardText(got.type, got.n) : t('wkClaimed'))
        : stt === 'claimable' ? t('wkClaimable') : t('wkLocked', { n: need - st.frags });
      return '<div class="wkpic ' + stt + '" data-i="' + i + '">' +
        '<span class="ico">' + (stt === 'claimed' ? '✅' : stt === 'claimable' ? '🎁' : '🔒') + '</span>' +
        '<span class="info"><b>' + escHtml(wkPicName(i)) + '</b><span>' + escHtml(sub) + '</span></span>' +
        '<button type="button" data-claim="' + i + '"' + (stt === 'claimable' ? '' : ' disabled') + '>' +
        escHtml(stt === 'claimed' ? t('wkClaimed') : t('wkClaim')) + '</button></div>';
    }).join('');
    $('wkGrid').innerHTML = rows;
    Array.prototype.forEach.call($('wkGrid').querySelectorAll('button[data-claim]'), function (b) {
      b.addEventListener('click', function () { WeeklyCtl.claim(parseInt(b.getAttribute('data-claim'), 10)); });
    });
    // 大奖行
    var gs = Weekly.grandStatus(st);
    var gparts = Object.keys(Weekly.grand).map(function (k) { return rewardText(k, Weekly.grand[k]); });
    $('wkGrandName').textContent = t('wkGrand');
    $('wkGrandDesc').textContent = gs === 'locked' ? t('wkGrandLocked', { n: Weekly.goal }) : gparts.join(' + ');
    var gb = $('wkGrandBtn');
    gb.textContent = gs === 'claimed' ? t('wkClaimed') : t('wkGrandClaim');
    gb.disabled = gs !== 'claimable';
    $('wkGrandRow').className = 'wkpic wkgrand ' + gs;
    $('wkAdBtn').textContent = t('wkAd', { n: Weekly.frags.ad });
    $('wkNote').textContent = t('wkNote', { n: Weekly.frags.win });
  }
  /* 首页入口回填：碎片进度 + 可领角标（角标数=待领图数含大奖，由 core 算） */
  function renderWeeklyEntry() {
    if (!$('btnWeekly')) return;
    if (!Weekly.enabled) { $('btnWeekly').hidden = true; return; }
    if (!WeeklyCtl.state) WeeklyCtl.load();
    WeeklyCtl.settle();
    /* 入口可能是整行卡（老布局，有标题/副标题/碎片数），也可能是侧边小图标（只有角标）——
       按锚点在不在决定填什么，两种布局共用这一个函数。 */
    if ($('wkEntryTitle')) $('wkEntryTitle').textContent = t('wkEntry');
    if ($('wkEntrySub')) $('wkEntrySub').textContent = t('wkEntrySub');
    if ($('wkEntryFrag')) $('wkEntryFrag').textContent = WeeklyCtl.state.frags + '/' + Weekly.goal;
    var cc = Weekly.claimableCount(WeeklyCtl.state);
    var badge = $('wkBadge');
    badge.hidden = cc === 0;
    badge.textContent = String(cc);
  }
  function showWeekly() {
    $('home').hidden = true; $('game').hidden = true; $('wkPage').hidden = false;
    renderWeekly();
  }

  /* ============ 弹窗 / toast ============ */
  var toastTimer = null;
  function toast(msg) {
    var el = $('toast'); el.textContent = msg; el.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1600);
  }
  /* 弹窗。硬规则：任何弹窗都必须留有退出路径——右上角 ✕、点窗口外的遮罩、Esc 三条路都通。
     误点开一个只有「去改名 / 退出登录」的窗口却出不来，是绝对不允许的状态。
     onDismiss 可选：给「关掉后要恢复现场」的弹窗用（如结束局面要回首页），默认只关窗。 */
  var dlgDismiss = null;
  function hideDialog() { $('overlay').classList.remove('show'); dlgDismiss = null; }
  function dismissDialog() {                    // 用户主动放弃：✕ / 点外部 / Esc
    var after = dlgDismiss;
    hideDialog();
    if (after) after();
  }
  function dialog(title, body, mainText, onMain, subText, onSub, onDismiss) {
    $('dlgTitle').textContent = title;
    $('dlgBody').textContent = body;
    $('dlgList').hidden = true;                 // 默认纯文本弹窗；背包窗口自己打开列表区
    var mainBtn = $('dlgMain'), subBtn = $('dlgSub'), ov = $('overlay');
    dlgDismiss = onDismiss || null;
    mainBtn.textContent = mainText;
    mainBtn.onclick = function () { hideDialog(); if (onMain) onMain(); };
    if (subText) {
      subBtn.style.display = ''; subBtn.textContent = subText;
      subBtn.onclick = function () { hideDialog(); if (onSub) onSub(); };
    } else subBtn.style.display = 'none';
    $('dlgX').onclick = dismissDialog;
    ov.onclick = function (e) { if (e.target === ov) dismissDialog(); };   // 只有点在遮罩上才关，点窗口内不关
    ov.classList.add('show');
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && $('overlay').classList.contains('show')) dismissDialog();
  });

  /* 入口检测要同时挂 hashchange：用户往已经打开的页面地址栏后面加 #selftest 回车时，
     浏览器只触发 hashchange、不会重载页面——只在启动时判一次的话面板永远不出现。 */
  /* 充值 10000 金币（自检面板专用，普通玩家看不到入口）。
     走生产同一条发放路径 Stock.grant → coinsEarned 累加；该字段在云端是 merge:"max"，
     所以**登录状态下写入会抬升云端值，并跟着 run.ceo 账号跨设备生效**，且不会被其它设备旧值覆盖。
     注意 max 是只增语义：加上去就降不回来（真要清零得反向加 coinsSpent）。
     平台按 owner 做行级隔离，只能给「当前这台设备上已登录的这个账号」充值——
     这也是为什么不能凭昵称给别人充值。 */
  var GRANT_AMOUNT = 10000;
  function grantCoins() {
    var out = [];
    function put(k, v) { out.push(k + '：' + v); $('stOut').textContent = out.join('\n'); }
    var before = Coins.balance(save);
    var patch = Stock.grant(save, Coins.coinsKey, GRANT_AMOUNT);
    if (!patch) { put('结果', '发放失败（金币账目未配置）'); return; }
    Object.assign(save, patch); persist(); renderHome();
    put('账号', (Plat && Plat.user && (Plat.user.name || Plat.user.id)) || '未登录（仅本机生效）');
    put('金币', before + ' → ' + Coins.balance(save) + '（+' + GRANT_AMOUNT + '）');
    put('累计获得', String(save.coinsEarned || 0));
    if (!Plat || !Plat.user) {
      put('云端同步', '未登录 → 只写在这台设备；登录后会自动并入云端（取较大值）');
      return;
    }
    put('云端同步', '正在写入并回读确认…');
    /* saveCloud 直接写（不经防抖，避免"点完就关页面"丢失），再 loadCloud 回读实证真的落库。
       两者都是 Promise；回读值必须 >= 本地才算成功，不做乐观宣称。 */
    Plat.saveCloud(save, Date.now())
      .then(function () { return Plat.loadCloud(); })
      .then(function (row) {
        if (!row) { put('云端回读', '读不到云端行（稍后再点一次确认）'); return; }
        var cloudEarned = row.coins_earned || 0;
        var cloudBal = Math.max(0, cloudEarned - (row.coins_spent || 0));
        put('云端回读', 'coins_earned=' + cloudEarned + ' / coins_spent=' + (row.coins_spent || 0)
          + ' → 云端余额 ' + cloudBal);
        put('结论', cloudBal >= Coins.balance(save)
          ? '✅ 已入云端，换台设备登录同一账号即可看到'
          : '⚠ 云端还没跟上，等几秒再点一次本按钮');
      })
      .catch(function (err) {
        put('云端回读', '失败：' + ((err && (err.code || err.message)) || err)
          + '（登录可能已过期，回首页重新登录后再点）');
      });
  }

  function syncSelfTestEntry() {
    if (!/selftest/.test(location.hash) && !/selftest/.test(location.search)) return;
    if (!$('selftest').hidden) return;
    $('selftest').hidden = false;
    $('stGrant').addEventListener('click', grantCoins);
  }
  syncSelfTestEntry();
  window.addEventListener('hashchange', syncSelfTestEntry);

  /* ============ 调试口（截图/自动化用，与倒水页同风格） ============ */
  window.__mine = {
    ads: AdPlay,                       // 自动化观测广告链用（availability/stats/sources）
    /* marks/clue 也要露出来：「找线索」的验收要看的正是「玩家已经 ✕ 掉的格」与
       「这次线索指哪、理由是什么」，只给 found 的话自动化只能靠截图猜。 */
    state: function () { return S && { lv: S.lv, size: S.size, found: Array.from(S.found),
      marks: Array.from(S.marks), mines: Array.from(S.mines),
      clue: S.clue ? { idx: S.clue.idx, why: S.clue.hint && S.clue.hint.why, depth: S.clue.hint && S.clue.hint.depth } : null,
      lives: S.lives, remain: S.remain, done: S.done }; },
    dig: dig, mark: toggleMark,
    solve: function () { S.mines.forEach(function (i) { if (!S.found.has(i)) dig(i); }); },
    home: function () { showHome(); }, start: function () { startGame(); }
  };

  /* ============ 首页：ShellCore + HomeCore 按 gameConfig screens.home 声明渲染 ============ */
  /* 首页装配：按 config 声明渲染。切换语言时整块重建，所以抽成函数（bindHome 随后重绑事件）。 */
  function buildHome() {
    ensureHomeStyle();
    $('home').innerHTML = ShellCore.create(HomeCore.registry(), CFG.screens).render('home', {}).join('');
  }

  /* 首页样式跟着模块一起放在 core（HomeCore.styles）：不搬进 core，别的游戏还得各抄一份 CSS，
     「换个 config 就换一副首页」根本做不到。主题色由 config 的 theme 段给，缺省回落 core 默认。 */
  function ensureHomeStyle() {
    if ($('homeCoreStyle')) return;
    var st = document.createElement('style');
    st.id = 'homeCoreStyle';
    st.textContent = HomeCore.styles(CFG.theme);
    document.head.appendChild(st);
  }

  /* 语言下拉的选项：core/home.js 的 lang-select 模块只产出空 <select id="langSel">，
     选项在这里按字典键填充——每种语言显示自己的自称（langName），
     所以加语言只需在 config 的 i18n.locales 补一份字典，页面代码不用动。 */
  function fillLangOptions() {
    var sel = $('langSel');
    if (!sel) return;
    sel.innerHTML = I18n.locales().map(function (code) {
      return '<option value="' + code + '"' + (code === LANG ? ' selected' : '') + '>'
        + HomeCore.escapeHtml(I18n.t(code, 'langName')) + '</option>';
    }).join('');
    sel.value = LANG;
  }

  /* 静态文案回填：HTML 里写死的那些文字（标题/HUD 标签/道具按钮/首页 label/底部提示）
     在这里按当前语言灌一遍。首页 label 走锚点回填，避免改 core/home.js 的 config 契约。 */
  function applyStaticI18n() {
    document.documentElement.lang = LocaleCore.htmlLang(LANG);
    document.title = t('docTitle');
    var setText = function (id, val) { var el = $(id); if (el) el.textContent = val; };
    setText('btnBack', t('back'));
    // 无障碍标签/提示也是文案：英文下不该念中文（此前 aria-label 全是写死的中文）
    var setAttr = function (id, attr, val) { var el = $(id); if (el) el.setAttribute(attr, val); };
    // 对局页顶部标题此前写死在静态 HTML 里，英文下仍显示「彩色扫雷」（用户实报的「顶部还显示中文」）
    var gt = $('gameTitle');
    if (gt) gt.innerHTML = t('logoMain') + ' <em>' + t('logoSub') + '</em>';
    setAttr('board', 'aria-label', t('boardLabel'));
    setAttr('langSel', 'aria-label', t('langLabel'));
    setAttr('dlgX', 'aria-label', t('close'));
    setAttr('dlgX', 'title', t('close'));
    setText('hudLvK', t('hudLevel'));
    setText('hudLeftK', t('hudMines'));
    setText('hudTimeK', t('hudTime'));
    setText('toolMineLbl', t('toolMineBtn'));
    setText('toolSafeLbl', t('toolSafeBtn'));
    setText('sfxLabel', t('sfxLabel'));       // core/home.js 的 sound-toggle 产出 id="sfxLabel"
    setText('langLabel', t('langLabel'));     // core/home.js 的 lang-select 产出 id="langLabel"
    fillLangOptions();
    /* 老版首页的统计格标签（<b id=...> 后面的兄弟 <span>）。游戏化首页已经没有这些格子，
       所以逐个判空——倒水那种老布局仍走这条路，两种首页共用同一个翻译函数。 */
    var labels = { homeLv: 'statLevel', homeClears: 'statClears' };
    Object.keys(labels).forEach(function (id) {
      var el = $(id); if (!el) return;
      var span = el.nextElementSibling;
      if (span) span.textContent = t(labels[id]);
    });
    /* 游戏化首页（2026-08-26）：金币/道具没有文字标签了，翻译职责落到无障碍标签上——
       没有可读文案不等于不用翻译（英文模式下读屏念中文同样是漏翻）。 */
    var coinsEl = $('homeCoins');
    if (coinsEl && coinsEl.closest && coinsEl.closest('.coinchip')) {
      coinsEl.closest('.coinchip').setAttribute('aria-label', t('statCoins'));
    }
    setText('heroBadge', t('logoSub'));
    setText('heroKicker', t('nextLevel'));
    setText('heroDesc', t('tipLine2'));
    setText('heroChapter', t('statClears'));
    // Dock / 侧边图标的文字都在 <span class="lb"> 里（图标那个 span 不能碰，否则图标被文案盖掉）
    var tabs = { dkHome: 'tabHome', btnBag: 'statTools', dkRules: 'tabRules', dkSet: 'tabSet',
      btnStreak: 'tabStreak', btnWeekly: 'tabEvent' };
    Object.keys(tabs).forEach(function (id) {
      var el = $(id); if (!el) return;
      var lb = el.querySelector('.lb');
      if (lb) lb.textContent = t(tabs[id]);
    });
    /* core/home.js 的 logo 模块产出 `<div class="logo">💣 彩色扫雷<em>COLOR MINES</em></div>`——
       主标题是【裸文本节点】（不是 .logomain 那种子元素），副标题在 <em> 里。
       所以按节点改：图标 + 主标题写文本节点，副标题写 em。 */
    var logo = document.querySelector('#home .logo');
    if (logo) {
      var em = logo.querySelector('em');
      for (var n = 0; n < logo.childNodes.length; n++) {
        var node = logo.childNodes[n];
        if (node.nodeType === 3 && node.nodeValue.trim()) { node.nodeValue = '💣 ' + t('logoMain'); break; }
      }
      if (em) em.textContent = t('logoSub');
    }
    /* 开始按钮由 core/home.js 渲染成 `<button id=btnStart>label <span id=startLv>N</span><small>…</small></button>`，
       label 是裸文本节点、小字在 <small> 里——所以按节点改，不能整块 textContent（会抹掉关卡数字）。 */
    var startBtn = $('btnStart');
    if (startBtn) {
      /* startBtn 文案里的关卡号由 core 渲染成独立的 <span id=startLv>，
         所以字典给的是「开始 第 {n}」这类整句：把 {n} 之前的部分写进裸文本节点，
         数字仍由 renderHome() 灌进 span，两边不互相覆盖。 */
      /* 老布局的 label 是按钮的第一个文本节点；游戏化首页的主 CTA 外面还套了一层
         <span class="ctalabel">（里面才是文本 + 关卡号），不认这一层的话英文 fallback 会漏在页面上。 */
      var labelHost = startBtn.querySelector('.ctalabel') || startBtn;
      if (labelHost.firstChild && labelHost.firstChild.nodeType === 3) {
        var full = t('startBtn', { n: '\u0000' });          // 用哨兵占位，安全切分
        labelHost.firstChild.nodeValue = full.split('\u0000')[0];
      }
      var small = startBtn.querySelector('small');
      if (small) small.textContent = t('startSub', { n: Reward.E_COST });
    }
    /* 提示行：core 的 hintline 模块 class 是 .hintline（不是 .tips/.hint），两行用 <br> 分隔。
       文案来自字典，用 escapeHtml 兜一层再拼 <br>，不直接把字典塞进 innerHTML。 */
    setText('gameHint', t('gameHint'));      // 关内棋盘下方的玩法提示
    var hint = document.querySelector('#home .hintline');
    if (hint) {
      hint.innerHTML = HomeCore.escapeHtml(t('tipLine1')) + '<br>' + HomeCore.escapeHtml(t('tipLine2'));
    }
  }

  /* 切换语言：写持久化 → 换 LANG → 重建首页 DOM → 重绑事件 → 回填静态文案 → 重渲染数值。
     不整页 reload，所以顺序里「重绑事件」不能漏（漏了按钮全死，本轮重点回归项）。 */
  function setLang(lang) {
    if (!I18n.locales().length || lang === LANG) return;
    var hit = LocaleCore.matchLang(lang, I18n.locales());
    if (!hit) return;
    LANG = hit;
    try { window.localStorage.setItem(LANG_KEY, LANG); } catch (e) {}
    /* 顺序要紧：先重建 DOM（buildHome）→ 再重绑事件（bindHome，否则按钮全死）
       → 再回填静态文案（applyStaticI18n 内含 fillLangOptions）→ 最后刷数值。 */
    buildHome(); bindHome(); applyStaticI18n(); renderHome();
    if (S && !S.done) renderHud();          // 关内 HUD 标签也要跟着换
  }

  buildHome();

  function renderHome() {
    var r = Reward.restore(save.energy, save.lastTs, Date.now());
    if (r.energy !== save.energy || r.lastTs !== save.lastTs) { save.energy = r.energy; save.lastTs = r.lastTs; persist(); }
    if ($('homeLv')) $('homeLv').textContent = save.level;
    $('startLv').textContent = save.level;
    if ($('homeClears')) $('homeClears').textContent = save.clears || 0;
    /* 游戏化首页的主视觉：大关卡号 = 下一关；右下角是累计通关数；
       星级位放本关真实盘面尺寸（关卡由算法无限生成，没有「第几章 / 共几关」这种数，不编） */
    if ($('heroLv')) {
      $('heroLv').textContent = save.level;
      var spec = MineLevels.spec(save.level);
      $('heroStars').textContent = spec.size + ' × ' + spec.size;
      $('heroProgress').textContent = save.clears || 0;
    }
    // 道具格已改成图标按钮（数量不在首页显示，点开背包窗口看），所以这里不再回填数量
    if ($('homeCoins')) $('homeCoins').textContent = Coins.balance(save);
    renderWeeklyEntry();
    $('enVal').textContent = save.energy;
    // 体力上限：游戏化首页给了独立锚点 #enMax，老布局仍是 .energy .max
    var maxEl = $('enMax') || document.querySelector('.energy .max');
    if (maxEl) maxEl.textContent = ' / ' + Reward.E_MAX;
    $('enBar').style.width = Math.min(100, Math.round(save.energy / Reward.E_MAX * 100)) + '%';
    $('enSub').textContent = save.energy >= Reward.E_MAX ? t('energyFull')
      : t('energyRegen', { n: Math.max(0, Math.ceil((Reward.E_TICK - (Date.now() - save.lastTs)) / 1000)) });
    renderIdentity();
    // 音效开关已收进设置弹窗，首页可能没有它
    if ($('sfxToggle')) {
      $('sfxToggle').textContent = save.sfx ? t('on') : t('off');
      $('sfxToggle').setAttribute('aria-pressed', String(!!save.sfx));
    }
    // 双连胜(2026-08-24):首页只留侧边图标 + 角标，两块详情在点开的弹窗里
    renderStreakRail();
    fillStreakCard();
  }
  function showHome() {
    if ($('wkPage')) $('wkPage').hidden = true;
    stopTimer();
    $('game').hidden = true; $('home').hidden = false;
    loadMultitag();            // 被动广告只在首页注入
    renderHome();
    maybePromptLogin();
  }
  function startGame() {
    // 双连胜(2026-08-24):断链未决时先问「看广告保持」;普通开局零打扰
    if (WinStreak.enabled && wsGet().pend) { wsKeepDialog(wsGet(), startGame); return; }
    renderHome();                        // 先按当前时间恢复体力再判定
    if (save.energy < Reward.E_COST) {
      dialog(t('energyLowTitle'), t('energyLowBody', { have: save.energy, need: Reward.E_COST, grant: Reward.E_AD }),
        t('adGrant', { n: Reward.E_AD }), function () { watchAdFor('tool-refill', function () {
          save.energy += Reward.E_AD;    // 广告补体力可超上限（与 water 同规则，issue #7）
          if (save.energy >= Reward.E_MAX) save.lastTs = Date.now();
          persist(); renderHome(); toast(t('energyRefilled'));
        }); }, t('cancel'), null);
      return;
    }
    save.energy -= Reward.E_COST;
    if (save.energy + Reward.E_COST >= Reward.E_MAX) save.lastTs = Date.now();
    persist();
    $('home').hidden = true; $('game').hidden = false;
    startLevel(save.level);
  }
  /* 首页按钮绑定收进一个函数：切换语言时首页 DOM 会整块重建（innerHTML），
     旧节点上的监听器随之失效，必须重新绑一遍——否则切完语言按钮全成死的。 */
  function bindHome() {
    $('btnStart').addEventListener('click', startGame);
    if ($('sfxToggle')) $('sfxToggle').addEventListener('click', function () { save.sfx = !save.sfx; persist(); renderHome(); });
    if ($('btnIdentity')) $('btnIdentity').addEventListener('click', onIdentityClick);
    if ($('langSel')) $('langSel').addEventListener('change', function (e) { setLang(e.target.value); });
    // btnWeekly / wsClaim 不在这里绑：周活动已是侧边图标（走 data-action），领取按钮活在连胜弹窗里
    /* 游戏化首页：Dock 每格与金币「+」都靠 data-action 找处理函数。
       白名单在这里，config 里写了没实现的 action 会立刻报错——不许出现点了没反应的按钮。 */
    var ACTIONS = { home: showHome, bag: openBag, shop: openBag, rules: openRules,
      settings: openSettings, streak: openStreak, weekly: showWeekly };
    var acted = $('home').querySelectorAll('[data-action]');
    for (var i = 0; i < acted.length; i++) {
      var name = acted[i].getAttribute('data-action');
      if (!ACTIONS[name]) throw new Error('home config: 未实现的 action "' + name + '"');
      acted[i].addEventListener('click', ACTIONS[name]);
    }
    // 老布局（倒水）没有 dock，道具格自己是个按钮
    if ($('btnBag') && !$('btnBag').getAttribute('data-action')) $('btnBag').addEventListener('click', openBag);
  }

  /* 侧边连胜图标的角标：有未领取的奖励票就亮金色「!」（该点了），
     否则显示当前连胜数；连胜为 0 时不显示——首页不堆无意义的 0。 */
  function renderStreakRail() {
    var badge = $('wsRailBadge');
    if (!badge || !WinStreak.enabled) { if (badge) badge.hidden = true; return; }
    var ws = wsGet();
    if (WinStreak.hasTicket(ws)) {
      badge.textContent = '!';
      badge.classList.add('gold');
      badge.hidden = false;
    } else {
      badge.classList.remove('gold');
      badge.textContent = String(ws.cur);
      badge.hidden = ws.cur === 0;
    }
  }

  /* 双连胜卡的回填：卡片现在活在弹窗里，弹窗没开就什么都不做。
     A 大连胜 + B 每 N 盘奖励票进度，两块共用这一份数据。 */
  function fillStreakCard() {
    if (!WinStreak.enabled || !$('wsCard')) return;
    var ws = wsGet();
    var shown = WinStreak.cycleShown(ws);
    $('wsCur').textContent = ws.cur;
    $('wsCurLabel').textContent = t('wsLabel');
    // A 块（无上限连胜）与 B 块（最近 N 盘奖励进度）是两码事，说明写在 A 块下面免得看混
    if ($('wsCurHint')) $('wsCurHint').textContent = t('wsCurHint');
    $('wsCycLabel').textContent = t('wsCycLabel', { n: WinStreak.every });
    $('wsCycTxt').textContent = shown + '/' + WinStreak.every;
    $('wsCycBar').style.width = Math.round(shown / WinStreak.every * 100) + '%';
    $('wsClaim').textContent = t('wsClaimBtn');
    $('wsClaim').hidden = !WinStreak.hasTicket(ws);
  }

  /* 连胜窗口：点右侧🔥图标打开，里面才是 A 大连胜 + B 奖励票进度 + 领取按钮。
     内容照旧由 config 声明（screens.streak）渲染。 */
  function openStreak() {
    dialog(t('streakTitle'), '', t('gotIt'), null, null, null, null);
    var list = $('dlgList');
    list.innerHTML = ShellCore.create(HomeCore.registry(), CFG.screens).render('streak', {}).join('');
    list.hidden = false;
    fillStreakCard();
    $('wsClaim').addEventListener('click', function () {
      hideDialog();          // 领取要播广告，先把窗口收掉再走发放流程
      wsClaimTicket();
    });
  }

  /* 玩法窗口：首页底部那两行小字收进来，首页只留主视觉与按钮 */
  function openRules() {
    dialog(t('tabRules'), t('tipLine1') + ' ' + t('tipLine2'), t('gotIt'), null, null, null, null);
  }

  /* 设置窗口：音效 / 语言从首页收进弹窗（首页不再像一张设置清单）。
     窗口内容同样由 config 声明（screens.settings）渲染，不是手写 markup——
     所以别的游戏想加一项设置，仍然只改配置。 */
  function openSettings() {
    dialog(t('tabSet'), '', t('gotIt'), null, null, null, null);
    var list = $('dlgList');
    list.innerHTML = ShellCore.create(HomeCore.registry(), CFG.screens).render('settings', {}).join('');
    list.hidden = false;
    var syncSfx = function () {
      $('sfxToggle').textContent = save.sfx ? t('on') : t('off');
      $('sfxToggle').setAttribute('aria-pressed', String(!!save.sfx));
    };
    $('sfxLabel').textContent = t('sfxLabel');
    $('langLabel').textContent = t('langLabel');
    $('langSel').setAttribute('aria-label', t('langLabel'));
    syncSfx();
    $('sfxToggle').addEventListener('click', function () { save.sfx = !save.sfx; persist(); syncSfx(); });
    fillLangOptions();
    // 切语言会重建首页 DOM，弹窗留在屏上会指向已被替换的节点，所以先关窗再切
    $('langSel').addEventListener('change', function (e) { var v = e.target.value; hideDialog(); setLang(v); });
  }

  /* 背包窗口：首页道具格是个图标按钮，点开这里看「有哪些道具、各剩几个、干什么用」。
     数量从首页移到这里的好处——首页只剩一个入口图标，而窗口里能放下名称与说明。
     道具清单来自 core/stock.js 的配置声明（含 icon/name/desc 元数据），
     所以以后加新道具只改配置，这个窗口自动多一行，不用动代码。
     金币不是道具，用 Coins.coinsKey 排除掉（它在首页有自己的显示位）。 */
  function openBag() {
    var rows = Stock.list(save, [Coins.coinsKey]);
    var html = rows.length === 0
      ? '<p class="bagempty">' + escHtml(t('bagEmpty')) + '</p>'
      : rows.map(function (it) {
          // 道具名/说明优先走 i18n（config 里的 nameKey/descKey），没配才用写死的字面量
          var nm = it.nameKey ? t(it.nameKey) : it.name;
          var ds = it.descKey ? t(it.descKey) : it.desc;
          return '<div class="bagrow' + (it.stock > 0 ? '' : ' empty') + '">' +
            '<span class="bagicon" aria-hidden="true">' + escHtml(it.icon) + '</span>' +
            '<span class="baginfo"><b>' + escHtml(nm) + '</b><span>' + escHtml(ds) + '</span></span>' +
            '<span class="bagqty">×' + it.stock + '</span>' +
            '</div>';
        }).join('');
    dialog(t('bagTitle'), t('bagBody'), t('gotIt'), null, null, null, null);
    var list = $('dlgList');
    list.innerHTML = html;
    list.hidden = false;
  }
  setInterval(function () { if (!$('home').hidden) renderHome(); }, 1000);
  $('btnBack').addEventListener('click', function () {
    if (S && !S.done) {
      dialog(t('quitTitle'), t('quitBody', { n: S.lv }),
        // 双连胜:局中弃战 = 没赢,算断链(与失败/超时同口径)
        t('quit'), function () { wsOnLose(); showHome(); }, t('keepPlaying'), null);
    } else showHome();
  });

  /* ============ run.ceo 平台：单栏身份 + 云存档，匿名可玩优先 ============ */
  var Plat = null, platPrompted = false;
  var SYNC_FAILS = 0;   // 云端回写累计失败次数（降级可观测：常态化失败要能一眼看出来）
  var PLAT_EXPIRED = false, PLAT_LAST_NAME = '';
  var RENAME_STORE_KEY = 'mine:rename-before';
  var renameReturn = { renamed: false, cleanUrl: location.href };
  if (/^https?:/i.test(location.href)) {
    renameReturn = IdentityCore.takeRenameFlag(location.href);
    if (renameReturn.renamed) history.replaceState(null, '', renameReturn.cleanUrl);
  }
  /* IdentityCore 返回的是文案 key，这里映射到 i18n 字典键 —— 于是身份行文案自动跟随语言。
     不要在这里写死文案：那会绕过 i18n，切语言时身份行会留在旧语言（本轮的坑）。 */
  var ID_TEXT_KEY = {
    me: 'defaultPlayer',
    idSrcCloud: 'srcCloud',
    idSrcTemp: 'srcLocal',
    idSubPending: 'idConnecting',
    idSubAnon: 'idAnon',
    idSubCloud: 'idSynced',
    idSubCloudTemp: 'idSyncedNoName',
    idSubExpired: 'idExpired',
    idSubUnsupported: 'idUnsupported',
    idActLogin: 'login',
    idActRelogin: 'reLogin',
    idActRename: 'goRename'
  };
  function idText(key) { return key && ID_TEXT_KEY[key] ? t(ID_TEXT_KEY[key]) : (key || ''); }
  function identityView() {
    return IdentityCore.resolve({
      mode: Plat ? Plat.mode : 'pending',
      user: PLAT_EXPIRED ? null : (Plat && Plat.user),
      expired: PLAT_EXPIRED,
      // 存档里的系统默认名带着「生成时那门语言」的字面量，显示时按当前语言重拼（core/identity.js）
      tempName: IdentityCore.localizeAlias(ensureTempName(), t('playerPrefix')),
      lastName: PLAT_LAST_NAME,
      defaultKey: 'me'
    });
  }
  function renderIdentity() {
    if (!$('btnIdentity')) return;
    var v = identityView();
    var name = v.name || idText(v.nameKey) || idText('me');
    $('idName').textContent = name;
    $('idAvatar').firstChild.nodeValue = IdentityCore.avatarChar(name) || t('defaultPlayer');
    $('idSource').textContent = idText(v.sourceKey);
    $('idSource').classList.toggle('show', !!v.sourceKey);
    $('idSub').textContent = idText(v.subKey);
    $('idBadge').className = 'idbadge ' + v.badge;
    $('idAction').textContent = v.action.kind === 'panel' ? t('accountEntry') : idText(v.action.labelKey);
    $('btnIdentity').dataset.state = v.state;
    $('btnIdentity').dataset.action = v.action.kind;
    if (!PLAT_EXPIRED && name) PLAT_LAST_NAME = name;
  }
  function markAuthExpired(reason) {
    var shown = $('idName') && $('idName').textContent;
    if (shown) PLAT_LAST_NAME = shown;
    PLAT_EXPIRED = true;
    console.warn('[mine identity] 登录已过期：' + reason, {
      lastName: PLAT_LAST_NAME,
      mode: Plat && Plat.mode
    });
    renderIdentity();
  }
  function nicknameApex() {
    return /^play-[a-z0-9-]+\.run\.ceo$/i.test(location.hostname)
      ? 'https://run.ceo'
      : location.origin;
  }
  function goRename() {
    var slug = Plat && Plat.play && Plat.play.slug;
    if (!slug) { toast(t('noGameId')); return; }
    var before = identityView().name || PLAT_LAST_NAME || '';
    try {
      sessionStorage.setItem(RENAME_STORE_KEY, before);
      location.assign(IdentityCore.renameUrl({
        apex: nicknameApex(),
        slug: slug,
        returnTo: IdentityCore.markReturn(location.href),
        scope: 'perGame'
      }));
    } catch (err) {
      console.warn('[mine identity] 无法打开 run.ceo 改名页：' + String(err && err.message || err), {
        slug: slug,
        origin: location.origin
      });
      toast(t('renamePageFail'));
    }
  }
  function finishRenameReturn(session) {
    if (!renameReturn.renamed) return;
    var before = '';
    try {
      before = sessionStorage.getItem(RENAME_STORE_KEY) || '';
      sessionStorage.removeItem(RENAME_STORE_KEY);
    } catch (err) {
      console.warn('[mine identity] 读取改名前名字失败：' + String(err && err.message || err));
    }
    var after = session && session.user ? session.user.name : null;
    var outcome = IdentityCore.renameOutcome({ before: before, after: after });
    if (outcome.status === 'applied') {
      toast(t('nameUpdated'));
      return;
    }
    console.warn('[mine identity] 改名回跳未确认生效：' +
      (outcome.status === 'stale' ? t('nameUnchanged') : t('noUsableName')), {
      status: outcome.status,
      before: before,
      after: after
    });
    toast(t('renameSubmitted'));
  }
  function platformSync() {
    if (!Plat || Plat.mode !== 'online' || !Plat.user) return;
    Plat.queueSync(function () { return save; }, {
      onAuthLost: function () { markAuthExpired('queueSync.onAuthLost'); toast(t('loginExpiredToast')); },
      /* 降级必须可观测：云端回写失败过去被静默吞掉，道具/进度对不上时日志里一条线索都没有。
         这里把异常本体 + 累计失败次数都记下来，常态化失败一眼可见。 */
      onError: function (err) {
        SYNC_FAILS += 1;
        console.warn('[mine cloud] 云存档回写失败（累计 ' + SYNC_FAILS + ' 次）：' +
          ((err && (err.code || err.name)) || 'unknown') + ' / ' +
          String((err && err.message) || err).slice(0, 200) + ' status=' + (err && err.status));
      }
    });
  }
  /* 登录引导：匿名通关满 N 盘（config platform.loginPromptAfterClears）在首页非阻断提示一次 */
  function maybePromptLogin() {
    if (!Plat || Plat.mode !== 'online' || Plat.user) return;
    if (!Plat.core.shouldPromptLogin({ clears: save.clears || 0, prompted: platPrompted })) return;
    platPrompted = true;
    dialog(t('cloudPromptTitle'), t('cloudPromptBody', { n: save.clears || 0 }),
      t('login'), function () { Plat.login(); }, t('later'), null);
  }
  function onIdentityClick() {
    var action = identityView().action.kind;
    if (action === 'none') {
      toast(Plat ? t('idUnsupported') : t('platformConnecting'));
      return;
    }
    if (action === 'login' || action === 'relogin') { Plat.login(); return; }
    if (action === 'rename') { goRename(); return; }
    dialog(t('accountTitle'), t('accountBody'),
      t('goRenameCloud'), goRename, t('logout'), function () {
        Plat.logout(); Plat.user = null; PLAT_EXPIRED = false; renderIdentity(); toast(t('loggedOut'));
      });
  }
  PlatformCore.connect(CFG.platform).then(function (session) {
    Plat = session;
    if (session.user) PLAT_EXPIRED = false;
    renderIdentity();
    finishRenameReturn(session);
    if (session.mode !== 'online') return;
    session.on('authexpired', function () { markAuthExpired('session.authexpired'); });
    if (!session.user) return;
    // 登录态：拉云档 → 字段级合并（进度取大、道具/体力按时间戳取新）→ 落本地并回写云端
    session.loadCloud().then(function (row) {
      // localFresh：本地没有实际游玩痕迹（换设备刚打开就登录），云端优先，防默认档覆盖云档
      var localFresh = (save.clears || 0) === 0 && save.level <= 1;
      var merged = session.core.mergeSave(save, row, { localFresh: localFresh }).save;
      Object.keys(merged).forEach(function (k) { save[k] = merged[k]; });
      // 云端老行只有旧「库存数」列时按它推导 granted/spent；已有账本则原样保留（migrate 幂等）
      Object.assign(save, Stock.migrate(save));
      ensureTempName(); persist(); renderHome();
      if (S && !S.done) renderHud();
    }).catch(function (err) {
      console.warn('[mine identity] 云存档载入失败：' + String(err && err.message || err));
      renderIdentity();
    });
  });
  /* 改完名字回到游戏：名字到底变了没必须判定清楚，不许静默当成功。
     stale/unknown 是「HTTP 正常、无异常、功能却没生效」那类降级——只记一行日志发现不了它常态化，
     所以计数跨会话持久化，连续到阈值就升级成用户可见的告警提示。 */
  function readRenameDegrade() {
    try { return JSON.parse(localStorage.getItem(DEGRADE_KEY) || 'null'); } catch (e) { return null; }
  }
  function writeRenameDegrade(state) {
    try { localStorage.setItem(DEGRADE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  function settleRenameReturn() {
    var after = Plat && Plat.user && typeof Plat.user.name === 'string' ? Plat.user.name : null;
    var outcome = IdentityCore.renameOutcome({ before: RENAME_BEFORE, after: after });
    var degrade = IdentityCore.trackRenameDegrade({
      prev: readRenameDegrade(), outcome: outcome, at: Date.now()
    });
    writeRenameDegrade(degrade);
    if (outcome.warn) {
      console.warn('[identity] 改名回跳后名字未更新:', {
        status: outcome.status, before: RENAME_BEFORE, after: after,
        platMode: Plat ? Plat.mode : 'pending', signedIn: !!(Plat && Plat.user),
        streak: degrade.streak, total: degrade.total, alert: degrade.alert
      });
    }
    if (outcome.status === 'applied') {
      PLAT_LAST_NAME = outcome.name || PLAT_LAST_NAME;
      toast(t('idRenameApplied', { name: outcome.name }));
    } else {
      toast(degrade.alert ? t('idRenameDegraded') : t(outcome.msgKey));
    }
    renderIdentity();
    return { outcome: outcome, degrade: degrade };
  }

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden' && Plat && Plat.mode === 'online') Plat.flush(function () { return save; });
  });

  $('btnWkBack').addEventListener('click', showHome);
  $('wkGrandBtn').addEventListener('click', function () { WeeklyCtl.claimGrand(); });
  $('wkAdBtn').addEventListener('click', function () {
    /* 看广告领碎片：走 core 广告链（tool-refill 广告位），没看完不给碎片 */
    watchAdFor('tool-refill', function () {
      var msgs = WeeklyCtl.addFrags(Weekly.frags.ad);
      toast(t('wkFragGot', { n: Weekly.frags.ad }));
      msgs.forEach(function (m, i) { setTimeout(function () { toast(m); }, 900 * (i + 1)); });
      renderWeekly(); renderHome();
    });
  });
  bindHome();            // 首页事件绑定（与 setLang 里重建后调用的是同一份，避免两处漂移）
  applyStaticI18n();     // 静态文案按当前语言灌一遍（必须在 DOM 装配之后）
  showHome();
})();
</script>
</body>
</html>
