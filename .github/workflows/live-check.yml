name: 线上健康检查

# 为什么要有它（#57）：2026-09-01 线上整站白屏，从发布到有人报过了约 17 小时。
# 发布的包本身是好的，是**发布之后**产物被改写坏的——所以构建期门禁抓不住，
# 只能去看线上真正在服的那一份。
#
# 这个 workflow 不改变任何生产状态，只读：拉线上 HTML 逐块解析 + 真开一次页面。
# 定时跑 => 线上坏了在小时级内自动变红，而不是等用户来报。
#
# 它跟 PR 的 CI 是分开的：线上坏不该拦住无关 PR 的合并。

on:
  schedule:
    - cron: '17 */6 * * *'   # 每 6 小时一次（错开整点，避开 GitHub 的高峰排队）
  workflow_dispatch:
    inputs:
      url:
        description: '要检查的线上地址'
        required: false
        default: 'https://play-color-mines.run.ceo/'

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 启动 headless Chrome（调试端口 19301）
        run: |
          google-chrome --version || chromium --version
          (google-chrome --headless=new --remote-debugging-port=19301 \
             --no-sandbox --disable-gpu --user-data-dir=/tmp/cdp-profile about:blank &) || \
          (chromium --headless=new --remote-debugging-port=19301 \
             --no-sandbox --disable-gpu --user-data-dir=/tmp/cdp-profile about:blank &)
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:19301/json/version >/dev/null; do sleep 1; done'

      # 退出码：0 通过 / 1 线上坏了 / 2 没有可用 Chrome（这里当失败处理，
      # 避免「没跑却看着是绿的」——与仓内其它运行时 gate 同口径）。
      - name: 检查 color-mines 线上
        run: |
          node scripts/verify-live.mjs \
            --url "${{ github.event.inputs.url || 'https://play-color-mines.run.ceo/' }}" \
            --root '#home'
